<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变：天空到海水过渡 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCEEFF"/>
      <stop offset="0.5" stop-color="#B8DCF5"/>
      <stop offset="1" stop-color="#A0CFEE"/>
    </linearGradient>
    <!-- Y 字母渐变：白色到极浅蓝，营造通透感 -->
    <linearGradient id="yGrad" x1="0" y1="140" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F8FF"/>
    </linearGradient>
    <!-- a 字母渐变：柔和淡黄 -->
    <linearGradient id="aGrad" x1="0" y1="270" x2="0" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE599"/>
      <stop offset="1" stop-color="#FFC93D"/>
    </linearGradient>
    <!-- 波浪渐变：白色到浅蓝 -->
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#A8D4F0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7BB8E0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7BB8E0" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#A8D4F0" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#A8D4F0" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7BB8E0" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- ═══════════ 水波纹装饰（8条，纵向分布） ═══════════ -->
  <!-- 波纹1：上部，白色为主，浅振幅 -->
  <path d="M -10 72 C 50 58, 130 96, 220 82 S 370 52, 460 78 S 530 92, 530 72"
        stroke="url(#waveGrad3)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 波纹2：上部偏下，蓝色 -->
  <path d="M -10 128 C 60 142, 120 106, 200 124 S 310 154, 400 132 S 500 108, 530 128"
        stroke="url(#waveGrad2)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 波纹3：中上，白色到蓝色 -->
  <path d="M -10 198 C 40 182, 110 218, 190 200 S 300 168, 390 196 S 500 222, 530 200"
        stroke="url(#waveGrad1)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- 波纹4：中上偏下，蓝色 -->
  <path d="M -10 262 C 70 278, 140 242, 230 264 S 350 290, 440 266 S 520 242, 530 262"
        stroke="url(#waveGrad2)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 波纹5：中下偏上，白色 -->
  <path d="M -10 332 C 50 318, 140 352, 220 336 S 340 306, 430 330 S 520 354, 530 334"
        stroke="url(#waveGrad3)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 波纹6：中下，蓝色到白色 -->
  <path d="M -10 382 C 80 398, 160 362, 240 386 S 360 412, 450 388 S 520 364, 530 384"
        stroke="url(#waveGrad1)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 波纹7：下部，白色 -->
  <path d="M -10 438 C 60 422, 150 458, 240 440 S 350 414, 440 436 S 520 458, 530 440"
        stroke="url(#waveGrad2)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- 波纹8：底部，蓝色 -->
  <path d="M -10 478 C 70 492, 160 464, 250 480 S 370 502, 460 482 S 530 468, 530 480"
        stroke="url(#waveGrad1)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ═══════════ 字母主体（在波浪之上） ═══════════ -->
  <g>
    <!-- 字母 Y（白色通透渐变） -->
    <g stroke="url(#yGrad)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 左上斜线：从左上向右下汇聚 -->
      <path d="M 135 140 C 155 165, 170 195, 185 250"/>
      <!-- 右上斜线：从右上向左下汇聚 -->
      <path d="M 255 140 C 235 165, 215 200, 195 250"/>
      <!-- 竖直线：从交汇点到基线 -->
      <path d="M 190 250 C 189 290, 190 340, 190 378"/>
    </g>

    <!-- 字母 a（柔和淡黄渐变） -->
    <g stroke="url(#aGrad)" stroke-width="60" stroke-linecap="round" fill="none">
      <!-- 圆形部分（碗）：完整圆弧 -->
      <circle cx="298" cy="314" r="52"/>
      <!-- 竖线：从碗右上方向下延伸至基线 -->
      <path d="M 346 270 C 346 310, 346 350, 346 378"/>
    </g>
  </g>
</svg>
