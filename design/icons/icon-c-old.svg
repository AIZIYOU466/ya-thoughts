<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景：上浅 #F0F6FF → 中下 #C8E0F2 → 水面以下更深的 #A8D0EC -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F6FF"/>
      <stop offset="0.6" stop-color="#C8E0F2"/>
      <stop offset="1" stop-color="#A8D0EC"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角方形（圆角半径 115） -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- ═══════════ Y：土褐色树枝（整体下移，底部贴近水面线） ═══════════ -->
  <g stroke="#8B6B4A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 主干（底部 → 分叉）+ 左分支 -->
    <path d="M 218 430 L 210 340 L 140 265"/>
    <!-- 右分支 -->
    <path d="M 210 340 L 258 272"/>
  </g>
  <!-- 分叉处平滑：用略深的#6B4F35做暗部树节 -->
  <circle cx="210" cy="340" r="13.5" fill="#6B4F35"/>

  <!-- 树皮纹路：#6B4F35，宽 3.5 的短横线，与所在枝干垂直、位置错落不均（主干3 + 左2 + 右2） -->
  <g stroke="#6B4F35" stroke-width="3.5" stroke-linecap="round">
    <!-- 主干 3 条（从上到下，向右伸出） -->
    <path d="M 212 362 L 228 362"/>
    <path d="M 216 388 L 233 388"/>
    <path d="M 224 412 L 242 412"/>
    <!-- 左分支 2 条（绕中心旋转，保持与枝干垂直） -->
    <path d="M 158 291 L 172 291" transform="rotate(-43 165 291)"/>
    <path d="M 178 312 L 192 312" transform="rotate(-43 185 312)"/>
    <!-- 右分支 2 条 -->
    <path d="M 221 316 L 235 316" transform="rotate(35 228 316)"/>
    <path d="M 231 300 L 245 300" transform="rotate(35 238 300)"/>
  </g>

  <!-- 末端叶子：左叶淡绿 #7FB89A、右叶鸭黄 #FFC83D，沿枝干方向延伸 -->
  <g fill="#7FB89A" transform="translate(118 241) rotate(-45)">
    <path d="M -32 0 Q -8 -15 16 0 Q -8 15 -32 0 Z"/>
  </g>
  <g fill="#FFC83D" transform="translate(275 248) rotate(-55)">
    <path d="M -32 0 Q -8 -15 16 0 Q -8 15 -32 0 Z"/>
  </g>

  <!-- ═══════════ a：字母 a 化形成的鸭子（a 的圆=身体，a 的竖尾=脖子+头） ═══════════ -->
  <!-- 身体：a 的封闭圆（略扁的椭圆），右缘伸出小尖角上翘 = 鸭尾 -->
  <ellipse cx="316" cy="336" rx="46" ry="36" fill="#FFC83D"/>
  <path d="M 356 318 L 386 296 L 358 350 Z" fill="#FFC83D"/>
  <!-- 脖子+头：a 右侧的竖直尾，向上延伸后向左弯折，末端圆头 = 鸭头（头朝左） -->
  <path d="M 349 311 C 364 262 368 216 342 196 C 320 178 298 164 286 152"
        stroke="#FFC83D" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- 鸭嘴：从头左侧伸出一小段（橙 #E8912D） -->
  <path d="M 277 140 L 248 150 L 277 161 Z" fill="#E8912D"/>
  <!-- 眼睛：头中央偏左的小圆点 -->
  <circle cx="279" cy="146" r="3" fill="#2A2A2A"/>

  <!-- ═══════════ 水波纹：两道横向弧线，Y 与鸭子都"站在"水面上 ═══════════ -->
  <g stroke="#6A9CC4" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 70 400 Q 328 360 446 402" stroke-width="8"/>
    <path d="M 94 440 Q 320 410 446 438" stroke-width="10"/>
  </g>
</svg>