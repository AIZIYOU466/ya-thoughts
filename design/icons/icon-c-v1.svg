<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F6FF"/>
      <stop offset="1" stop-color="#D8E8FA"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角方形 + 顶部到底部渐变 -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- 水波纹：底部两道弧线，40px / 65px -->
  <path d="M 216 472 Q 256 490 296 472" stroke="#A8C8E8" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 186 447 Q 256 471 326 447" stroke="#A8C8E8" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Y：树枝字形（左臂 + 主干，圆角连接） -->
  <path d="M 112 170 Q 146 236 185 300 L 185 392" stroke="#4A6B5C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Y：右臂 -->
  <path d="M 262 182 Q 224 242 185 300" stroke="#4A6B5C" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- 分叉处平滑 -->
  <circle cx="185" cy="300" r="16" fill="#4A6B5C"/>
  <!-- 枝头小绿叶（树枝意象） -->
  <path d="M 88 133 C 100 122 116 144 112 170 C 102 162 92 152 88 133 Z" fill="#7FB89A"/>
  <path d="M 300 148 C 312 140 288 156 262 182 C 272 190 292 172 300 148 Z" fill="#7FB89A"/>

  <!-- a：鸭身（黄色圆）+ 鸭眼 + 竖笔 -->
  <circle cx="352" cy="349" r="56" fill="#FFC83D"/>
  <circle cx="322" cy="314" r="6.5" fill="#4A6B5C"/>
  <path d="M 416 278 L 416 405" stroke="#4A6B5C" stroke-width="28" stroke-linecap="round"/>
</svg>