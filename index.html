      var sy = t.clientY - g.lastY;
      if (sy) listEl.scrollTop -= sy; // JS 手动滚动（浏览器已被 touch-action:none + preventDefault 禁言）
      g.lastY = t.clientY;
      g.suppressClick = true;
    }
  }

  // window touchend：左滑吸附/弹回、拖拽落位写库，并复位全部状态
  function onGestureEnd(e) {
    var g = gesture;
    if (!g) return;
    detachGestureListeners();
    var li = g.li;
    if (g.mode === 'swipe') {
      var body = li.querySelector('.swipe-body');
      li.classList.remove('swiping'); // 先恢复过渡，再清除内联位移 → 平滑弹回/展开
      if (g.viewX <= -SWIPE_SNAP) {
        li.classList.add('swipe-open'); // 滑过 80px → 吸附展开
        console.log('[gesture] swipe snap', { offset: g.viewX });
      } else {
        closeOpenSwipe(li); // 否则弹回
      }
      if (body) body.style.transform = '';
      if (g.suppressClick) gestureSuppressClick = true;
    } else if (g.mode === 'drag') {
      cancelScheduledDrag(); // 丢弃未执行的 rAF，随后同步补最后一次让位
      var movedAmt = Math.abs(g.dragShift) > DRAG_JITTER;
      if (movedAmt) { g.suppressClick = true; moveDrag(g); } // 同步应用最终 hover 位置
      if (g.dragIndex === g.startIndex && !movedAmt) {
        // 长按期间手指未移动：取消拖拽，视为普通点击（打开便签）
        li.classList.remove('dragging');
        li.style.transform = '';
        resetGesture(g);
        return;
      }
      if (g.suppressClick) gestureSuppressClick = true;
      console.log('[gesture] drag drop', { fromIndex: g.startIndex, toIndex: g.dragIndex });
      finishDragReorder(g); // 落位 + 立即写 order
    } else if (g.mode === 'scroll') {
      // 已进入 JS 手动滚动：消费本次点按，不打开便签
      gestureSuppressClick = true;
    } else {
      // 未进入左滑/拖拽/滚动的简单点按：移动过才抑制 click
      var t = e.changedTouches[0];
      if (t && (Math.abs(t.clientX - g.startX) > DRAG_JITTER ||
                Math.abs(t.clientY - g.startY) > DRAG_JITTER)) gestureSuppressClick = true;
    }
    if (li.isConnected) li.classList.remove('swiping', 'dragging');
    gesture = null;
  }

  // window touchcancel：系统中断（来电、通知、浏览器抢占），全部复位不落位
  function onGestureCancel() {
    var g = gesture;
    if (!g) return;
    console.log('[gesture] touchcancel', { mode: g.mode });
    resetGesture(g);
  }

  // 手势开始时在 window 上注册 move/end/cancel（passive:false，preventDefault 才有效）
  function attachGestureListeners() {
    if (gestureListenersAttached) return;
    gestureListenersAttached = true;
    window.addEventListener('touchmove', onGestureMove, { passive: false });
    window.addEventListener('touchend', onGestureEnd, { passive: false });
    window.addEventListener('touchcancel', onGestureCancel, { passive: false });
  }

  // 手势结束时移除，平时 window 上零监听
  function detachGestureListeners() {
    if (!gestureListenersAttached) return;
    gestureListenersAttached = false;
    window.removeEventListener('touchmove', onGestureMove);
    window.removeEventListener('touchend', onGestureEnd);
    window.removeEventListener('touchcancel', onGestureCancel);
  }

  // 手势启动（挂在每张 .note-item 的 touchstart 上，passive:true 不 preventDefault）：
  // 记录起点、清掉上次残留定时器、启动 500ms 长按定时器、注册 window move/end/cancel。
  // 不 preventDefault：click 合成不受影响，按钮点击、卡片打开都走原生 click。
  function onGestureStart(e) {
    var li = e.currentTarget;
    if (!li || !li.classList || !li.classList.contains('note-item')) return;
    // 关键修复：从左滑按钮上开始的触摸绝不触发卡片手势 → click 原样送达按钮
    if (e.target && e.target.closest && e.target.closest('.swipe-actions')) return;
    listPressFired = false;
    gestureSuppressClick = false; // 新一轮按下：清掉上个手势可能残留的抑制位
    if (gesture) {
      if (!gesture.li || !gesture.li.isConnected) resetGesture(gesture); // 上个手势异常残留：自愈
      if (gesture) return; // 已有手势进行中：不启动新手势
    }
    if (multiMode) return; // 多选模式不启动新手势
    var t = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : (e.touches && e.touches[0]);
    if (!t) return;
    if (li.classList.contains('swipe-open')) {
      // 点已展开的卡片本体：收拢、不打开便签、不启动新手势
      closeOpenSwipe();
      gestureSuppressClick = true;
      return;
    }
    closeOpenSwipe(li); // 点其他卡片时，展开中的卡片先弹回
    console.log('[gesture] touchstart', { x: t.clientX, y: t.clientY, target: (e.target && e.target.className) || '' });
    gesture = {
      li: li,
      id: li.dataset.id,
      startX: t.clientX,
      startY: t.clientY,
      dragStartY: t.clientY,
      lastY: t.clientY,
      viewX: 0,
      mode: 'pending',
      suppressClick: false,
      longPressTimer: null
    };
    attachGestureListeners(); // move/end/cancel 全挂 window（passive:false），end/cancel 时移除
    // 长按 500ms 且未移动超过 10px → 进入拖拽；按标题排序时禁止拖拽（不设定时器）
    if (sortBy !== 'title') {
      gesture.longPressTimer = setTimeout(function () {
        if (gesture && gesture.mode === 'pending') {
          console.log('[gesture] longpress fired');
          startDragReorder(gesture);
        }
      }, DRAG_HOLD);
    }
  }

  // 手势结束清理：摘除 window 监听、取消长按定时器、取消未执行的拖拽 rAF、恢复面容与让位状态
  function resetGesture(g) {
    if (!g) return;
    detachGestureListeners();
    cancelScheduledDrag(); // 丢弃残留拖拽帧，避免落位后再被 moveDrag 改写
    if (g.longPressTimer) { clearTimeout(g.longPressTimer); g.longPressTimer = null; }
    var li = g.li;
    if (li && li.isConnected) {
      li.classList.remove('swiping', 'dragging', 'swipe-reveal');
      var body = li.querySelector('.swipe-body');
      if (body) body.style.transform = '';
      li.style.transform = '';
    }
    clearDragShifts();
    if (gesture === g) gesture = null;
  }

  // 左滑跟手：只改 transform，超展开宽度带阻尼
  function applySwipe(g) {
    var x = g.viewX;
    var off = x < -SWIPE_REVEAL ? -SWIPE_REVEAL - (x + SWIPE_REVEAL) * 0.35 : x;
    if (off > 0) off = 0;
    var body = g.li.querySelector('.swipe-body');
    if (body) body.style.transform = 'translate3d(' + off + 'px,0,0)';
    // Bug2(B)：位移越过阈值后才让菜单从右侧滑入（swipe-reveal）；回滑出阈值则滑回藏起。
    // 菜单的滑入/滑出由 .swipe-actions 的 transition 完成，这里只负责开关 class。
    var revealOn = x <= -SWIPE_REVEAL_TRIGGER;
    if (revealOn !== g.li.classList.contains('swipe-reveal')) {
      g.li.classList.toggle('swipe-reveal', revealOn);
    }
  }

  // 拖拽开始：长按 500ms 且未移动超过 10px（标题排序下不触发）
  function startDragReorder(g) {
    if (gesture !== g || !g.li || !g.li.isConnected) return;
    if (multiMode || sortBy === 'title') return;
    var items = noteItemsInDom();
    var idx = -1;
    for (var i = 0; i < items.length; i++) {
      if (items[i] === g.li) { idx = i; break; }
    }
    if (idx === -1) { resetGesture(g); return; }
    g.startIndex = g.dragIndex = idx;
    g.items = items;
    g.slots = [];
    for (i = 0; i < items.length; i++) {
      g.slots.push(items[i].offsetHeight + (parseFloat(getComputedStyle(items[i]).marginBottom) || 0));
    }
    g.dragStartY = g.startY;
    g.dragShift = 0;
    g.mode = 'drag';
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (err) {} }
    // touchstart 已第一时间在 window 注册 move/end/cancel，此处无需额外捕获
    g.li.classList.add('dragging');
    g.li.style.transform = 'translate3d(0px,0px,0) scale(1.02)'; // 放大+浮起（阴影由 CSS）
  }

  // 其余卡片让位：拖到 d 位时，(o, d] 区间依次上移自己的前一格，(d, o) 区间下移自己一格
  function applyDragShifts(g) {
    var o = g.startIndex, d = g.dragIndex, slots = g.slots;
    for (var j = 0; j < g.items.length; j++) {
      var it = g.items[j];
      if (it === g.li) continue;
      var y = 0;
      if (d > o && j > o && j <= d) y = -(slots[j - 1]);
      else if (d < o && j >= d && j < o) y = slots[j];
      if (y) { it.classList.add('drag-shift'); it.style.transform = 'translate3d(0px,' + y + 'px,0)'; }
      else { it.classList.remove('drag-shift'); it.style.transform = ''; }
    }
  }

  /* 拖拽跟随（rAF 节流）：把卡片放到手指下方，实时按被拖卡片中心点 y 计算目标索引。
     hoverIndex 判定用卡片「天然槽位中心线」±20px（offsetTop 是布局位，不受让位
     translate 影响）—— 相邻卡片让位后边界不会跟着退让，拖 1 过 2、3 时依次灵敏让位；
     快速跨多格时一次算到位。只有 hoverIndex 变化才重算让位，避免每帧重排。 */
  var DRAG_SLOT_TOL = 20; // 中心点进入目标卡片中心线 ±20px 即触发让位
  var dragRafId = 0;      // 拖拽 rAF 节流句柄（同一时间只挂一帧）

  function moveDrag(g) {
    if (Math.abs(g.dragShift) > DRAG_JITTER) g.suppressClick = true;
    var items = g.items, li = g.li;
    // 被拖卡渲染中心：布局位 offsetTop + 手指位移 + 半高（translate 不改 offsetTop）
    var cy = li.offsetTop + g.dragShift + li.offsetHeight / 2;
    var hover = g.dragIndex;
    var best = DRAG_SLOT_TOL; // 只有进入某张卡中心线 ±20px 才换位
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      if (it === li) continue;
      var c = it.offsetTop + it.offsetHeight / 2; // 目标卡天然中心线
      var dist = Math.abs(cy - c);
      if (dist <= best) { best = dist; hover = j; }
    }
    if (hover !== g.dragIndex) { g.dragIndex = hover; applyDragShifts(g); } // 仅 hover 变化才重算
    li.style.transform = 'translate3d(0px,' + g.dragShift + 'px,0) scale(1.02)';
  }

  // rAF 节流调度：touchmove 只更新 dragShift，让位/重排放到下一帧；已挂帧则跳过
  function scheduleDragMove(g) {
    if (dragRafId) return;
    dragRafId = requestAnimationFrame(function () {
      dragRafId = 0;
      if (gesture === g && g.mode === 'drag' && g.li.isConnected) moveDrag(g);
    });
  }

  // 取消尚未执行的拖拽帧（松手/取消时调用，防止残留位移）
  function cancelScheduledDrag() {
    if (dragRafId) { cancelAnimationFrame(dragRafId); dragRafId = 0; }
  }

  // 松手落位：“啪”地落位，不重播任何动画（完全跳过 FLIP）。
  // 拖动期间其余卡片已让位到位；落手这一帧同时完成：切 DOM 顺序 + 清掉所有 translateY
  // + 清掉被拖卡的 transform。全程不加过渡类、不强制重排，浏览器只画一帧 ——
  // 卡片直接落在新位置，其他卡片已在正确位置，不闪、不重播。
  function finishDragReorder(g) {
    var i;
    var moved = g.dragIndex !== g.startIndex;
    var all = noteItemsInDom();
    var li = g.li;
    if (moved) {
      var remaining = [];
      for (i = 0; i < all.length; i++) if (all[i] !== li) remaining.push(all[i]);
      if (g.dragIndex >= remaining.length) listEl.appendChild(li);
      else listEl.insertBefore(li, remaining[g.dragIndex]);
      all = noteItemsInDom();
    }
    // 先清 transform（此时仍带 .dragging 的 transition:none，同一绘帧内生效不会补间），
    // 再摘除 dragging 类与其余卡片的让位 class/位移；无强制重排 → 瞬移落位
    li.style.transform = '';
    li.classList.remove('dragging');
    for (i = 0; i < all.length; i++) {
      all[i].classList.remove('drag-shift', 'drag-anim');
      all[i].style.transform = '';
    }
    // 松手立即写入 IndexedDB 的 order；若原本是时间排序，自动切到自定义排序
    if (moved) saveCustomOrder(noteItemsInDom());
    if (moved && (sortBy === 'updated' || sortBy === 'created')) {
      sortBy = 'custom';
      try { localStorage.setItem(SORT_KEY, sortBy); } catch (err) {}
      updateSortMenu();
      renderList();
    }
  }

  // 拖拽结果落库：非置顶便签按可见顺序写 order（0..n）；被过滤隐藏的追加到末尾
  //（保持相对顺序）；置顶仍按 pinnedAt 排，不参与 order
  function saveCustomOrder(domItems) {
    var seen = {};
    var seq = [];
    for (var i = 0; i < domItems.length; i++) {
      var id = domItems[i].dataset.id;
      if (id) seen[id] = true;
      var n = id ? noteById(id) : null;
      if (n && !isPinned(n)) seq.push(n);
    }
    var hidden = notes.filter(function (x) { return !isPinned(x) && !seen[x.id]; })
      .sort(function (a, b) {
        var oa = (a.order == null ? a.createdAt : a.order);
        var ob = (b.order == null ? b.createdAt : b.order);
        return oa - ob || a.createdAt - b.createdAt;
      });
    var all = seq.concat(hidden);
    var jobs = [];
    for (i = 0; i < all.length; i++) { all[i].order = i; jobs.push(dbPut(all[i])); }
    Promise.all(jobs).catch(function () { /* 存储失败静默 */ });
  }

  // 左滑按钮动作：置顶 / 复制 / 删除（点击后直接执行，不先弹回卡片）
  function runSwipeAction(act, id) {
    if (!act || !id) return;
    if (act === 'pin') {
      var wasPinned = isPinned(noteById(id));
      pinWithFlip(id); // 立即切换 pinnedAt，卡片带过渡移到新位置
      showUndoToast(wasPinned ? '已取消置顶' : '已置顶');
    } else if (act === 'copy') {
      copyNoteText(id); // 立即复制，成功/失败自带 toast
    } else if (act === 'delete') {
      deleteSingleNote(id); // 先弹自定义确认框，确认后立即走曲线删除动画
    }
  }

  // 置顶/取消置顶的位移过渡（FLIP）：先记录所有卡片旧位置 → togglePin 触发重渲染
  // → 再把每张卡片从旧位置用 transform 过渡到新位置，避免“瞬间跳位”。
  // renderList 会重建 DOM，因此按 id 匹配新旧节点；减少动态效果时直接切换。
  function pinWithFlip(id) {
    if (prefersReducedMotion()) { togglePin(id); return; }
    var before = {};
    var oldItems = noteItemsInDom();
    for (var i = 0; i < oldItems.length; i++) {
      var oid = oldItems[i].dataset.id;
      if (oid) before[oid] = oldItems[i].getBoundingClientRect();
    }
    togglePin(id); // 内部 renderList() 重建列表
    var newItems = noteItemsInDom();
    var moving = [];
    for (i = 0; i < newItems.length; i++) {
      var el = newItems[i];
      var old = before[el.dataset.id];
      if (!old) continue;
      var dy = old.top - el.getBoundingClientRect().top;
      if (Math.abs(dy) < 1) continue;
      el.style.transition = 'none';
      el.style.transform = 'translate3d(0,' + dy + 'px,0)';
      moving.push(el);
    }
    if (!moving.length) return;
    void listEl.offsetHeight; // 提交起点帧
    for (i = 0; i < moving.length; i++) {
      moving[i].style.transition = 'transform 0.28s var(--ease-swift)';
      moving[i].style.transform = '';
    }
    setTimeout(function () {
      for (var k = 0; k < moving.length; k++) {
        if (moving[k].isConnected) { moving[k].style.transition = ''; moving[k].style.transform = ''; }
      }
    }, 320);
  }

  // 构建一枚左滑操作按钮。单一事件路径：只绑一个 click，点击后立即执行动作，
  // “关闭展开态 + 执行动作”同步完成，无两段式延迟；不绑任何 touch/pointer 事件，
  // 由 .swipe-actions 容器不挂监听 + 卡片 touchstart 首行排除 .swipe-actions
  // 双重保证：按钮上的触摸永不触发卡片手势，click 必定生效。
  function makeSwipeBtn(act, svg, label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'swipe-btn' + (act === 'delete' ? ' danger' : '');
    b.dataset.act = act;
    b.setAttribute('aria-label', label);
    b.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + svg + '</svg><span>' + label + '</span>';
    b.addEventListener('click', function (e) {
      e.stopPropagation(); // 不触发卡片打开/多选
      console.log('[swipe] button click', { action: act });
      var li = b.closest('.note-item');
      if (!li) return;
      var id = li.dataset.id;
      if (!id) return;
      closeOpenSwipe(); // 关闭展开态 + 执行动作同步完成，无“先弹回、后执行”两段式
      runSwipeAction(act, id); // 立即执行；置顶重渲染、删除走曲线动画
    });
    return b;
  }

  // 空白处点按：收拢展开的卡片（Touch Events 版，监听卡片手势同款事件）
  document.addEventListener('touchstart', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('.note-item')) return;
    closeOpenSwipe();
  }, { passive: true });

  function renderList() {
    var sorted = sortedNotesFor(segFilter).filter(matchesSearch); // 分段与搜索"与"关系

    listEl.innerHTML = '';

    var hasNotes = sorted.length > 0;
    var emptyTitleEl = emptyEl.querySelector('.empty-title');
    var emptyHintEl = emptyEl.querySelector('.empty-hint');
    emptyEl.style.display = hasNotes ? 'none' : 'flex';
    if (emptyTitleEl && emptyHintEl) {
      if (segFilter === 'todo') {
        emptyTitleEl.textContent = '没有待办事项';
        emptyHintEl.textContent = '点右下角 + 新建待办';
      } else if (segFilter === 'done') {
        emptyTitleEl.textContent = '还没有完成的待办';
        emptyHintEl.textContent = '去「待办」里完成一个试试';
      } else {
        emptyTitleEl.textContent = '还没有便签';
        emptyHintEl.textContent = '点右下角 + 开始记录';
      }
    }
    countEl.textContent = hasNotes ? sorted.length + ' 条' : '';
    // 搜索无结果提示；普通空状态照旧
    if (searchQuery && !hasNotes) {
      searchEmptyEl.textContent = '没有找到含“' + searchInput.value.trim() + '”的便签';
      searchEmptyEl.style.display = 'block';
    } else {
      searchEmptyEl.style.display = 'none';
    }
    listView.classList.toggle('multi', multiMode);
    headerEl.classList.toggle('selecting', multiMode);
    if (multiMode) updateSelCount();
    if (multiMode) updateSelAllBtn();
    var lastPin = lastPinnedIndex(sorted); // 置顶区末尾下标，用于插分割线

    sorted.forEach(function (note, noteIdx) {
      var li = document.createElement('li');
      li.className = 'note-item';
      if (isTodo(note)) li.classList.add('is-todo');
      if (isTodo(note) && isDone(note)) li.classList.add('is-done');

      // 左滑操作区（置顶/复制/删除）+ 卡片本体集合：本体盖在按钮之上并随左滑位移
      var actions = document.createElement('div');
      actions.className = 'swipe-actions';
      actions.appendChild(makeSwipeBtn('pin', SWIPE_PIN_SVG, '置顶'));
      actions.appendChild(makeSwipeBtn('copy', SWIPE_COPY_SVG, '复制'));
      actions.appendChild(makeSwipeBtn('delete', SWIPE_DEL_SVG, '删除'));
      var face = document.createElement('div');
      face.className = 'swipe-body';

      var box = document.createElement('div');
      box.className = 'sel-box' + (selectedIds[note.id] ? ' on' : '');
      box.textContent = '✓';

      // 待办：卡片左侧圆形复选框，点击直接切换完成状态（不进编辑页）
      if (isTodo(note)) {
        var chk = document.createElement('div');
        chk.className = 'todo-chk' + (isDone(note) ? ' on' : '');
        chk.textContent = '✓';
        chk.addEventListener('click', function (e) {
          e.stopPropagation(); // 不触发卡片打开/多选
          if (listPressFired) { listPressFired = false; return; }
          toggleTodoDone(note.id);
        });
        face.appendChild(chk);
      }

      var body = document.createElement('div');
      body.className = 'note-body';

      var title = document.createElement('div');
      title.className = 'title';
      if (searchQuery) {
        title.innerHTML = highlightText(titleOf(note), searchQuery); // 纯文本经转义后包 mark，无注入
      } else {
        title.textContent = titleOf(note); // textContent，天然防注入
      }

      var time = document.createElement('div');
      time.className = 'time';
      time.textContent = formatTime(note.updatedAt);

      // 未完成待办且有截止时间：右上角显示倒计时，已过期标红
      if (isTodo(note) && !isDone(note) && note.dueAt) {
        li.classList.add('has-due');
        var due = document.createElement('div');
        var txt = dueText(note);
        due.className = 'due-badge' + (txt === '已过期' ? ' overdue' : '');
        due.textContent = txt;
        due.dataset.id = note.id; // 事件委托刷新倒计时文案
        face.appendChild(due);
      }

      // 该便签含重点图片 → 右上角小星标提示（异步查库，带缓存）
      if (note.id) {
        var starFlag = document.createElement('div');
        starFlag.className = 'star-flag';
        starFlag.textContent = '⭐';
        starFlag.style.display = 'none';
        face.appendChild(starFlag);
        noteHasStarredImage(note.id).then(function (has) {
          if (!has) return;
          li.classList.add('has-star');
          starFlag.style.display = 'block';
        });
      }

      // 置顶便签：卡片加 is-pinned（左侧竖条由 CSS ::before 绘制），右上角小图钉
      if (isPinned(note)) {
        li.classList.add('is-pinned', 'has-pin');
        var pinFlag = document.createElement('div');
        pinFlag.className = 'pin-flag';
        pinFlag.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l1 7 3 3H5l3-3z"/></svg>';
        face.appendChild(pinFlag);
      }

      // 摘要：默认 -webkit-line-clamp 2 行省略号；展开态由 expandedSummaries 恢复
      var wrap = document.createElement('div');
      wrap.className = 'excerpt-wrap';
      var summary = document.createElement('div');
      summary.className = 'summary';
      if (expandedSummaries[note.id]) summary.classList.add('expanded');
      if (searchQuery) {
        summary.innerHTML = highlightText(excerptOf(note), searchQuery);
      } else {
        summary.textContent = excerptOf(note);
      }
      wrap.appendChild(summary);

      body.appendChild(title);
      body.appendChild(wrap);
      body.appendChild(time);
      face.appendChild(box);
      face.appendChild(body);
      var clip = document.createElement('div');
      clip.className = 'swipe-clip'; // Bug2(B)：菜单裁剪容器（菜单藏在右缘外，左滑越过阈值才滑入）
      clip.appendChild(actions);
      li.appendChild(clip);
      li.appendChild(face);

      li.dataset.id = note.id; // 事件委托用：点击时从这里取 id

      // 手势：左滑操作菜单 + 长按拖拽排序（见「手势层」小节，纯 Touch Events）
      li.addEventListener('touchstart', onGestureStart, { passive: true }); // 不 preventDefault，click 合成不受影响
      // 长按/右键不再弹系统菜单（原长按操作菜单已移除）
      li.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      listEl.appendChild(li);

      // 溢出检测 → 超过 2 行才创建展开按钮。
      // li 已挂到 DOM；列表可见时立即量；不可见时（backToList 先 renderList 再
      // show('list')，此刻列表 display:none）自旋等到 .active 出现，量出的
      // scrollHeight 才是真实值。≤2 行 → 按钮完全不创建
      (function (li, wrap, summary) {
        var measure = function () {
          if (!listView.classList.contains('active')) { requestAnimationFrame(measure); return; }
          var btn = buildSummaryToggle(note.id, summary);
          if (btn) { wrap.classList.add('has-toggle'); wrap.appendChild(btn); }
        };
        measure();
      })(li, wrap, summary);

      // 置顶区与普通区之间插一条极浅分割线（无置顶或置顶排到最后时不显示）
      if (noteIdx === lastPin && lastPin < sorted.length - 1) {
        var divider = document.createElement('li');
        divider.className = 'pin-divider';
        listEl.appendChild(divider);
      }
    });
  }

  /* ---------- 单条操作菜单已移除：置顶/复制/删除改为左滑露出，长按负责拖拽排序 ---------- */

  // 复制标题+正文纯文本；优先 navigator.clipboard，失败（非安全上下文等）退回 execCommand
  function copyNoteText(id) {
    var note = noteById(id);
    if (!note) return;
    var text = titleOf(note) + '\n' + plainTextOf(note.content);
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showUndoToast(ok ? '已复制' : '复制失败');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showUndoToast('已复制');
      }, fallback);
    } else {
      fallback();
    }
  }

  // 删除单条便签及其图片（复用批量删除的事务）。
  // 普通模式与长按菜单「删除」都走「弧形飞入垃圾桶」动画：克隆卡片沿二次贝塞尔
  // 曲线以 linear 均匀速率飞向顶栏垃圾桶（550ms，rAF 手动驱动），动画结束回调里
  // 才真正删 IndexedDB + DOM，其余卡片 200ms 折叠补位；
  // 动画被节流打断/抛异常时由幂等兑底强删一次，保证数据一致；
  // prefers-reduced-motion 下不播放动画，直接删除。
  // 多选批量删除（#sel-delete）保持原有瞬时行为，不走此动画。
  function deleteSingleNote(id) {
    var note = noteById(id);
    if (!note) return;
    // 弃用原生 confirm（按钮文字随浏览器语言变），改用可复用自定义确认框；
    // 点击“是” → 立即走曲线删除动画；点“否”/遮罩 → 什么都不做
    confirmDialog({
      title: '删除便签',
      message: '删除后无法恢复，确定删除这条便签吗？',
      confirmText: '是',
      cancelText: '否'
    }).then(function (ok) {
      if (!ok) return;
      showUndoToast('已删除');
      var li = liForNoteId(id);
      // 卡片不在列表（分段/搜索过滤）/ 减少动态效果：跳过动画直接删
      if (prefersReducedMotion() || !li || !li.isConnected) { removeNoteNow(id); return; }
      var deleted = false; // 幂等兑底：动画完成/中断/异常都只执行一次数据删除
      var doDelete = function () {
        if (deleted) return;
        deleted = true;
        removeNoteNow(id);
      };
      try {
        // 复用曲线删除动画（内部按卡片当前 boundingRect 克隆，飞向右上角垃圾桶）；
        // 真实数据删除（IndexedDB note + images 清理）放进动画结束回调执行
        animateCardToTrash(id, li, doDelete);
      } catch (err) {
        flyAnimating = false; // 动画启动异常：复位飞行锁
        doDelete();           // 并强制删除一次，避免数据不一致
      }
    });
  }

  // 可复用的确认对话框：confirmDialog({title,message,confirmText,cancelText}) → Promise<boolean>
  // 遮罩淡入 150ms；点“是”resolve(true)，点“否”或遮罩 resolve(false)。
  // 同一时刻只允许一个对话；重复调用时后者立即拿到 false（防双开）。
  var confirmModalEl = null;
  var confirmOpen = false;
  function confirmDialog(opts) {
    opts = opts || {};
    if (!confirmModalEl) confirmModalEl = document.getElementById('confirm-modal');
    return new Promise(function (resolve) {
      if (!confirmModalEl || confirmOpen) { resolve(false); return; }
      confirmOpen = true;
      confirmModalEl.querySelector('.confirm-title').textContent = opts.title || '确认删除';
      confirmModalEl.querySelector('.confirm-msg').textContent = opts.message || '';
      var cancelBtn = confirmModalEl.querySelector('.confirm-cancel');
      var okBtn = confirmModalEl.querySelector('.confirm-ok');
      cancelBtn.textContent = opts.cancelText || '否';
      okBtn.textContent = opts.confirmText || '是';
      var settled = false;
      function finish(val) {
        if (settled) return;
        settled = true;
        confirmModalEl.classList.remove('show');
        setTimeout(function () { confirmOpen = false; }, 160); // 等淡出结束再允许下一次
        resolve(val);
      }
      cancelBtn.onclick = function () { finish(false); };
      okBtn.onclick = function () { finish(true); };
      confirmModalEl.onclick = function (e) { if (e.target === confirmModalEl) finish(false); }; // 点遮罩
      confirmModalEl.classList.add('show');
    });
  }

  // 找出当前列表中 id 对应的卡片 DOM（分段/搜索过滤下可能不在 → null）
  function liForNoteId(id) {
    var kids = listEl.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.classList && el.classList.contains('note-item') && String(el.dataset.id) === String(id)) return el;
    }
    return null;
  }

  // 即删：IndexedDB（连带图片）→ 内存缓存 → DOM 折叠补位（200ms）→ 计数/空态
  function removeNoteNow(id) {
    dbDeleteNotesWithImages([id]).then(function (imgIds) {
      imgIds.forEach(function (imgId) {
        if (imgUrlCache[imgId]) {
          URL.revokeObjectURL(imgUrlCache[imgId]);
          delete imgUrlCache[imgId];
        }
      });
      notes = notes.filter(function (n) { return n.id !== id; }); // 更新内存缓存
      collapseListItem(liForNoteId(id), function () {
        var remain = sortedNotesFor(segFilter).filter(matchesSearch).length;
        if (remain === 0) renderList(); // 空态 / 计数由 renderList 统一处理
        else countEl.textContent = remain + ' 条';
      });
    }).catch(function () {
      alert('删除失败，请重试'); // 事务失败则什么都没删，数据保持原样
    });
  }

  // 剩余卡片补位动画：把被删卡片的高度/内边距/外边距折叠到 0（200ms），
  // 下方卡片随之平滑上移填满缺口；结束后移除卡片 DOM 与相邻分割线。
  function collapseListItem(li, done) {
    if (!li || !li.isConnected) { done(); return; }
    var h = li.getBoundingClientRect().height;
    if (prefersReducedMotion() || !h) { removeLiAndDivider(li); done(); return; }
    var body = li.querySelector('.swipe-body'); // 卡片本体：与 li 同步折叠内边距
    li.style.boxSizing = 'border-box';
    li.style.overflow = 'hidden';
    li.style.height = h + 'px';
    li.style.transition = [
      'height 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'padding-top 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'padding-bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'margin-bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1)'
    ].join(', ');
    if (body) {
      body.style.transition = 'padding-top 0.2s cubic-bezier(0.4, 0, 0.2, 1), padding-bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
    }
    void li.offsetHeight; // 强制回流锁定起点
    li.style.height = '0px';
    li.style.paddingTop = '0px';
    li.style.paddingBottom = '0px';
    li.style.marginBottom = '0px';
    li.style.opacity = '0';
    if (body) { body.style.paddingTop = '0px'; body.style.paddingBottom = '0px'; }
    var settled = false;
    var finish = function () {
      if (settled) return;
      settled = true;
      li.removeEventListener('transitionend', onEnd);
      clearTimeout(fallback);
      removeLiAndDivider(li);
      done();
    };
    var onEnd = function (e) {
      if (e.target === li && (e.propertyName === 'height' || e.propertyName === 'margin-bottom')) finish();
    };
    var fallback = setTimeout(finish, 250); // transitionend 丢失兜底
    li.addEventListener('transitionend', onEnd);
  }

  // 移除卡片及其后的置顶分割线（分割线不参与补位动画，随卡片一并消失）
  function removeLiAndDivider(li) {
    var after = li.nextElementSibling;
    if (after && after.classList && after.classList.contains('pin-divider')) after.remove();
    li.remove();
  }

  /* ---------- 弧形删除动画（curved card deletion） ----------
     触发：卡片操作面板 / 左滑菜单点「删除」→ deleteSingleNote。
     克隆卡片固定定位到当前包围盒，逐帧沿二次贝塞尔曲线飞向右上角「选择」图标
     （原垃圾桶按钮已移除，落点锚点改为 sel-enter 的中心），
     位置/缩放/旋转统一走 linear 均匀速率（p = t）：全程匀速推进、无头重脚轻
     （scale 1→0.05 均匀收缩、旋转 0→25° 匀速递进）；
     opacity 前 60% 保持 1、后 40% 线性衰减到 0；transform-origin
     指向右上角落点。落点同步脉冲。同一时刻只允许一张卡片在飞。 */
  var flyAnimating = false; // 是否有卡片正在飞向落点
  var trashPulseTimer = null;

  function trashCenter() {
    var r = $('sel-enter').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function animateCardToTrash(id, li, done) {
    if (flyAnimating) { done(); return; } // 已有卡片在飞：本次直接删除，不排队
    flyAnimating = true;

    var s = li.getBoundingClientRect();
    var from = { x: s.left + s.width / 2, y: s.top + s.height / 2 }; // 卡片中心
    var end = trashCenter();                                          // 垃圾桶中心
    // 控制点：起点→终点连线的中点，再向右上偏移 (60, -80)，画一条明显上扬的弧线
    var midX = (from.x + end.x) / 2, midY = (from.y + end.y) / 2;
    var ctrl = { x: midX + 60, y: midY - 80 };

    var clone = document.createElement('div');
    clone.className = 'fly-clone';
    clone.setAttribute('aria-hidden', 'true');
    clone.style.left = s.left + 'px';
    clone.style.top = s.top + 'px';
    clone.style.width = s.width + 'px';
    clone.style.height = s.height + 'px';
    clone.style.willChange = 'transform, opacity'; // 提示合成器：只动画 transform/opacity
    clone.appendChild(li.cloneNode(true));
    document.body.appendChild(clone);
    void clone.offsetHeight; // 确保首帧定位生效后再起动画

    pulseTrashBtn(); // 垃圾桶同步脉冲（300ms）
    var t0 = performance.now();
    var DUR = 550;
    var finished = false;
    var finish = function () {
      if (finished) return;
      finished = true;
      clearTimeout(stall);
      clone.style.willChange = ''; // 动画结束移除合成提示
      clone.remove(); // 飞行结束：清理克隆体
      flyAnimating = false;
      if (done) done();
    };
    var stall = setTimeout(finish, DUR + 60); // rAF 被节流（切后台等）时兜底收尾
    // linear 均匀速率：p = t，位置/缩放/旋转全程匀速推进，无「头重脚轻」的慢开头快收尾。
    // opacity 前 60% 保持 1、后 40% 线性衰减到 0（不同时结束，飞入后期才淡出）。
    // 只改 transform（translate3d + scale + rotate）与 opacity，
    // 触发 GPU 合成加速；不动 top/left/width/height，避免多次布局抖动造成掉帧
    var frame = function (now) {
      try {
        var p = Math.min(1, (now - t0) / DUR);
        var e = p; // linear：均匀速率，p = t
        // 二次贝塞尔采样：p(t) = (1-t)²·P0 + 2(1-t)t·C + t²·P1（弧线形状不变，速度变均匀）
        var u = 1 - e;
        var cx = u * u * from.x + 2 * u * e * ctrl.x + e * e * end.x;
        var cy = u * u * from.y + 2 * u * e * ctrl.y + e * e * end.y;
        // scale 从 1 到 0.05 线性变化：sc = 1 - 0.95·p；
        // opacity：p < 0.6 保持 1，p ≥ 0.6 后按 (1 - (p-0.6)/0.4) 线性衰减到 0；
        // 旋转 0 → 25° 随同一线性进度递进
        var sc = 1 - 0.95 * e;
        var opacity = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
        clone.style.transform =
          'translate3d(' + (cx - from.x) + 'px,' + (cy - from.y) + 'px,0)' +
          ' scale(' + sc + ')' +
          ' rotate(' + (25 * e) + 'deg)';
        clone.style.opacity = String(opacity);
        if (p < 1) { requestAnimationFrame(frame); return; }
        finish();
      } catch (err) {
        finish(); // 动画异常兜底：清理克隆体并执行删除回调，保证数据一致
      }
    };
    requestAnimationFrame(frame);
  }

  // 落点脉冲：300ms 内 scale 1 → 1.2 → 1（CSS keyframes 一次性播放，打在「选择」图标上）
  function pulseTrashBtn() {
    var btn = $('sel-enter');
    if (!btn || prefersReducedMotion()) return;
    btn.classList.remove('pulsing');
    void btn.offsetWidth; // 重置动画
    btn.classList.add('pulsing');
    clearTimeout(trashPulseTimer);
    trashPulseTimer = setTimeout(function () { btn.classList.remove('pulsing'); }, 320);
  }

  /* ---------- 视图切换（简化版单向滑入/滑出，状态由 show() 全权管理） ---------- */

  var editorAnimCleanup = null; // 滑入/滑出过程的清理函数（transitionend + 超时兜底）

  // 动画结束：移除一次性临时 class，编辑页回到基线到位态 translateX(0)。
  // 滑出（返回列表）结束时必须把编辑页彻底隐藏（去掉 .active → display:none），
  // 否则它会按基线 transform 滑回来盖住列表页，右下角 + 按钮也被挡住
  function finishEditorAnim() {
    if (editorAnimCleanup) { editorAnimCleanup(); editorAnimCleanup = null; }
    var wasLeaving = editorView.classList.contains('leaving');
    editorView.classList.remove('entering', 'leaving');
    if (wasLeaving) editorView.classList.remove('active');
  }

  // 挂动画结束监听：transitionend（transform）或 340ms 超时兜底
  //（后台标签页等场景收不到 transitionend，超时强制复位到位态）
  function watchEditorAnimEnd() {
    var onEnd = function (e) {
      if (e.target !== editorView || e.propertyName !== 'transform') return;
      finishEditorAnim();
    };
    var fallback = setTimeout(finishEditorAnim, 340);
    editorAnimCleanup = function () {
      clearTimeout(fallback);
      editorView.removeEventListener('transitionend', onEnd);
    };
    editorView.addEventListener('transitionend', onEnd);
  }

  // 返回列表：编辑页滑出（滑入途中点返回则直接掉头），结束后隐藏复位
  function hideEditorWithTransition() {
    if (!editorView.classList.contains('active')) return;
    if (editorAnimCleanup) { editorAnimCleanup(); editorAnimCleanup = null; } // 取消在途动画
    editorView.classList.add('leaving'); // → translateX(100%)，从任何当前位置都能过渡
    watchEditorAnimEnd();
  }

  function show(view) {
    var toEditor = view === 'editor';
    listView.classList.toggle('active', !toEditor); // 列表直接显隐，不做联动动画
    if (toEditor) {
      finishEditorAnim(); // 上一次滑出未结束也要先复位，保证本次一定能进入
      editorView.classList.add('active');       // display:flex + 到位态基线 translateX(0)
      editorView.classList.add('entering');     // 先摆到屏外起点 100%
      editorView.style.transition = 'none';     // 摆起点不参与过渡（含中途改道时避免来回弹）
      void editorView.offsetWidth;              // 强制重排，锁定起点
      editorView.style.transition = '';         // 恢复过渡
      editorView.classList.remove('entering');  // 100% → 0 滑入，结束停在基线到位态
      watchEditorAnimEnd();
    } else {
      hideEditorWithTransition();
    }
  }

  /* ---------- 编辑器 ---------- */

  // 旧版正文用 [图片:id] 文本标记，打开时升级为内联 <img>（id 仅含字母数字，无注入风险）
  function upgradeLegacyMarkers(content) {
    return String(content || '').replace(MARKER_RE, '<img data-img-id="$1" alt="便签图片">');
  }

  function openNote(id) {
    var myToken = ++openToken; // 本次的入场号；后续在途异步都带着它校验
    var note = noteById(id);
    if (!note) return;
    currentId = id;
    editorEl.innerHTML = upgradeLegacyMarkers(note.content); // 同步写入，无竞态
    hydrateImages(editorEl, myToken); // 异步补 src/pos，完成后校验 token
    savedRange = null; // 换了笔记，旧选区作废；没点过光标则插入时落到末尾
    savedSelection = null; // 底部格式按钮的选区快照同样作废（避免对新笔记误用旧选区）
    syncEditorTodoUI();
    resetUndoHistory(); // 每次打开便签都清空撤销历史
    updateWordCount(); // 打开即显示本篇字数
    show('editor');
    // 不自动聚焦编辑器：避免进入编辑页就弹键盘；用户点一下编辑器再输入
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  // 编辑页待办区（复选框 + 提醒按钮）随当前便签类型显隐与刷新
  function syncEditorTodoUI() {
    var note = noteById(currentId);
    var isT = !!(note && isTodo(note));
    editorTodoHead.style.display = isT ? 'flex' : 'none';
    dueBtn.style.display = isT ? 'inline-flex' : 'none';
    if (!isT) return;
    editorTodoChk.classList.toggle('on', isDone(note));
    if (note.dueAt) {
      var d = new Date(note.dueAt);
      dueBtn.textContent = '⏰ ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes());
      dueBtn.classList.remove('overdue');
    } else {
      dueBtn.textContent = '⏰ 设置提醒';
      dueBtn.classList.remove('overdue');
    }
    dueInput.value = note.dueAt ? toLocalInputValue(note.dueAt) : '';
    hideDuePop();
  }

  function createNote(type) {
    var now = Date.now();
    var note = { id: uid(), content: '', createdAt: now, updatedAt: now };
    if (type === 'todo') {
      note.type = 'todo';
      note.dueAt = null;
      note.doneAt = null;
    }
    notes.unshift(note);
    dbPut(note).catch(function () { /* 存储失败静默 */ });
    openNote(note.id);
  }

  function autosave() {
    if (!currentId) return;
    var note = noteById(currentId);
    if (!note) return;
    note.content = editorEl.innerHTML.replace(/ class="lp-dim"/g, ''); // 序列化成 HTML 存库；长按反馈类不入库
    note.updatedAt = Date.now();
    syncImagesStars(); // 重点标注与正文一起入库
    invalidateStarFlagCache(currentId);
    dbPut(note).then(function () {
      saveStatus.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(function () {
        saveStatus.classList.remove('show');
      }, 1200);
    }).catch(function () { /* 存储失败静默 */ });
  }

  function backToList() {
    openToken++; // 离开编辑器，作废该笔记所有在途异步加载
    // 空便签自动清理，避免留下空条目
    var note = noteById(currentId);
    if (note && isNoteEmpty(note)) {
      notes = notes.filter(function (n) { return n.id !== currentId; });
      dbDelete(currentId).catch(function () { /* 存储失败静默 */ });
      cleanupImagesForNote(currentId);
    }
    currentId = null;
    clearTimeout(wordCountTimer); // 取消在途的字数统计，避免空引用
    renderList();
    show('list');
    // Bug3：+ 按钮由 #list-view 的 visibility 显隐控制（列表页保持渲染不摘树，
    // 返回时只滑出编辑页、不重建不重播动画），此处不再做防御性 DOM 操作
  }

  function deleteCurrent() {
    var note = noteById(currentId);
    var label = note ? titleOf(note) : '';
    confirmDialog({
      title: '删除便签',
      message: '删除后无法恢复，确定删除这条便签吗？',
      confirmText: '是',
      cancelText: '否'
    }).then(function (ok) {
      if (!ok || currentId == null) return;
      notes = notes.filter(function (n) { return n.id !== currentId; });
      dbDelete(currentId).catch(function () { /* 存储失败静默 */ });
      cleanupImagesForNote(currentId);
      openToken++; // 同 backToList：删除即离开编辑器，作废在途加载
      currentId = null;
      renderList();
      show('list');
      showUndoToast('已删除');
    });
  }

  /* ---------- 撤销 / 重做（仅编辑页正文与标题内容） ---------- */

  var UNDO_MAX = 50;          // 历史栈上限
  var undoHistory = [];       // 快照栈：{ content, caretOffset, imgCount }
  var undoPointer = -1;       // 当前所在的历史位置
  var undoTimer = null;       // 500ms 防抖定时器
  var isRestoring = false;    // 恢复快照写 DOM 期间不产生新快照
  var lastPushedSnap = null;  // 上一次入栈（或打开便签）时的基准，用于识别图片增删
  var undoToastTimer = null;

  function caretOffsetNow() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !editorEl.contains(sel.anchorNode)) return -1;
    var r = sel.getRangeAt(0);
    var range = document.createRange();
    range.selectNodeContents(editorEl);
    range.setEnd(r.endContainer, r.endOffset);
    return range.toString().length; // 纯文本偏移量
  }

  function snapshotNow() {
    return {
      content: editorEl.innerHTML,
      caretOffset: caretOffsetNow(),
      imgCount: editorEl.querySelectorAll('img[data-img-id]').length
    };
  }

  // 光标按纯文本偏移恢复：从编辑器起点数第 offset 个字符处
  function setCaretByOffset(root, offset, range) {
    var remaining = offset;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while ((node = walker.nextNode())) {
      var len = node.nodeValue.length;
      if (remaining <= len) {
        try { range.setStart(node, remaining); range.collapse(true); return true; }
        catch (err) { return false; }
      }
      remaining -= len;
    }
    return false;
  }

  function pushUndoSnapshot() {
    undoTimer = null;
    var snap = snapshotNow();
    if (lastPushedSnap) {
      if (snap.content === lastPushedSnap.content) return; // 无实际变化
      // 仅图片增删（纯文本相同）不入历史：图片有独立的数据管理
      if (snap.imgCount !== lastPushedSnap.imgCount &&
          htmlToPlain(snap.content) === htmlToPlain(lastPushedSnap.content)) {
        lastPushedSnap = snap; // 图片状态同步到基准，但不产生撤销步
        return;
      }
    }
    undoHistory = undoHistory.slice(0, undoPointer + 1); // 新操作丢弃重做分支
    if (undoHistory.length >= UNDO_MAX) undoHistory.shift();
    undoHistory.push(snap);
    undoPointer = undoHistory.length - 1;
    lastPushedSnap = snap;
    updateUndoButtons();
  }

  // 内容变化后延迟 500ms 入栈，连续输入合并成一个快照
  function scheduleUndoSnapshot() {
    if (isRestoring) return;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(pushUndoSnapshot, 500);
  }

  function restoreSnapshot(snap) {
    isRestoring = true;
    editorEl.innerHTML = String(snap.content || '').replace(/ class="lp-dim"/g, '');
    var sel = window.getSelection();
    var restored = false;
    if (snap.caretOffset >= 0 && sel) {
      var range = document.createRange();
      if (setCaretByOffset(editorEl, snap.caretOffset, range)) {
        sel.removeAllRanges();
        sel.addRange(range);
        restored = true;
      }
    }
    if (!restored) { // 无有效偏移：光标放编辑器末尾
      editorEl.focus();
      var end = document.createRange();
      end.selectNodeContents(editorEl);
      end.collapse(false);
      if (sel) { sel.removeAllRanges(); sel.addRange(end); }
    }
    var note = noteById(currentId);
    if (note) {
      note.content = editorEl.innerHTML;
      note.updatedAt = Date.now();
      dbPut(note).catch(function () { /* 存储失败静默 */ });
    }
    renderImageStrip();
    // 快照不含图片增删历史：恢复后清掉库里已不存在的图片节点，避免幽灵图
    Array.prototype.forEach.call(editorEl.querySelectorAll('img[data-img-id]'), function (img) {
      var id = img.dataset.imgId;
      if (!id || imgUrlCache[id]) return;
      dbGetImage(id).then(function (rec) {
        if (rec || !img.isConnected) return;
        img.remove();
        var n = noteById(currentId);
        if (n) {
          n.content = editorEl.innerHTML;
          dbPut(n).catch(function () { /* 存储失败静默 */ });
        }
      });
    });
    isRestoring = false;
  }

  function updateUndoButtons() {
    $('undo-btn').disabled = undoPointer <= 0; // 最初状态：撤销变灰
    $('redo-btn').disabled = undoPointer >= undoHistory.length - 1;
  }

  // 打开便签时重置历史（历史不跨便签、不跨会话）
  function resetUndoHistory() {
    clearTimeout(undoTimer);
    undoTimer = null;
    isRestoring = true;
    undoHistory = [snapshotNow()];
    undoHistory[0].caretOffset = -1;
    undoPointer = 0;
    lastPushedSnap = undoHistory[0];
    isRestoring = false;
    updateUndoButtons();
  }

  function undoEdits() {
    if (undoPointer <= 0) return;
    clearTimeout(undoTimer);
    undoPointer--;
    lastPushedSnap = undoHistory[undoPointer];
    restoreSnapshot(undoHistory[undoPointer]);
    showUndoToast('已撤销');
    updateUndoButtons();
  }

  function redoEdits() {
    if (undoPointer >= undoHistory.length - 1) return;
    clearTimeout(undoTimer);
    undoPointer++;
    lastPushedSnap = undoHistory[undoPointer];
    restoreSnapshot(undoHistory[undoPointer]);
    showUndoToast('已重做');
    updateUndoButtons();
  }

  function showUndoToast(text) {
    var toast = $('undo-toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(undoToastTimer);
    undoToastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1500);
  }

  /* ---------- 图片插入 ---------- */

  // 保存编辑器当前选区；光标不在编辑器里时存 null（插入时落到末尾）
  function saveEditorRange() {
    var sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    } else {
      savedRange = null;
    }
  }

  // 保存的选区是否还能用（起点节点必须仍连接在文档里且属于编辑器）
  function rangeIsValid(range) {
    return !!(range && range.startContainer && range.startContainer.isConnected &&
              editorEl.contains(range.startContainer));
  }

  // 在光标处插入元素：优先恢复点「图片」按钮前保存的选区，无效则落到编辑器末尾
  function insertNodeAtCaret(node) {
    editorEl.focus();
    var sel = window.getSelection();
    if (rangeIsValid(savedRange)) {
      sel.removeAllRanges();
      sel.addRange(savedRange); // 恢复保存的光标位置
    } else {
      savedRange = null;
      var end = document.createRange();
      end.selectNodeContents(editorEl);
      end.collapse(false); // 从未保存过有效光标，定位到编辑器末尾
      sel.removeAllRanges();
      sel.addRange(end);
    }
    var range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    // 光标移到插入内容之后，同时更新 savedRange，多张图按 DOM 顺序依次插入
    var r = document.createRange();
    r.setStartAfter(node);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
    savedRange = r.cloneRange();
    // contenteditable 不会因 DOM 操作自动触发 input，手动触发以启动自动保存
    editorEl.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function handleImageFiles(files) {
    if (!currentId || !files || !files.length) return;
    Array.prototype.forEach.call(files, function (file) {
      if (!file || file.type.indexOf('image/') !== 0) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('图片「' + file.name + '」超过 10MB，已跳过');
        return;
      }
      var rec = {
        id: uid(),
        noteId: currentId,
        mime: file.type,
        blob: file,
        pos: Date.now(), // 存储时在正文中的顺序（DOM 顺序）
        createdAt: Date.now(),
        starred: false // 图片重点标注，默认无
      };
      dbPutImage(rec).then(function () {
        if (currentId !== rec.noteId) {
          // 上传落库前用户已离开该笔记：作废插入并清掉孤儿记录，避免图片串到别的便签
          dbDeleteImage(rec.id).catch(function () { /* 存储失败静默 */ });
          return;
        }
        var img = document.createElement('img');
        img.dataset.imgId = rec.id;
        img.dataset.imgNoteId = rec.noteId; // 供重点标注写库时补 noteId
        img.alt = '便签图片';
        img.src = URL.createObjectURL(rec.blob); // 立即在正文里显示
        insertNodeAtCaret(img);
        renderImageStrip();
      }).catch(function () {
        alert('图片保存失败，请重试');
      });
    });
  }

  function getImageURL(id) {
    if (imgUrlCache[id]) return Promise.resolve(imgUrlCache[id]);
    return dbGetImage(id).then(function (rec) {
      if (!rec) return null;
      var url = URL.createObjectURL(rec.blob);
      imgUrlCache[id] = url;
      return url;
    }).catch(function () { return null; });
  }

  // 打开笔记时为每张 img 恢复 src 并复用 objectURL；旧记录缺 pos 时按 DOM 顺序补写
  // myToken：调用时的 openToken，回调回来后不一致说明已切笔记，直接丢弃
  function hydrateImages(container, myToken) {
    if (myToken === undefined) myToken = openToken;
    var imgs = container.querySelectorAll('img[data-img-id]');
    Array.prototype.forEach.call(imgs, function (img, idx) {
      var id = img.dataset.imgId;
      if (!id) return;
      img.dataset.imgNoteId = currentId || ''; // 供重点标注写库时补 noteId
      if (imgUrlCache[id]) { img.src = imgUrlCache[id]; return; }
      getImageURL(id).then(function (url) {
        if (myToken !== openToken) return; // 已切到别的笔记，丢弃过期结果
        if (url && img.isConnected) img.src = url;
      });
      dbGetImage(id).then(function (rec) {
        if (myToken !== openToken) return; // 过期结果不回写
        if (rec && rec.pos === undefined) {
          rec.pos = idx;
          return dbPutImage(rec);
        }
        if (rec && rec.starred && img.isConnected) {
          img.classList.add('starred'); // 库里标记了重点 → 恢复样式
          renderImageStrip();
        }
      }).catch(function () { /* 补写失败静默 */ });
    });
    renderImageStrip(myToken);
  }

  function renderImageStrip(myToken) {
    if (myToken === undefined) myToken = openToken;
    var ids = [];
    var seen = {};
    Array.prototype.forEach.call(editorEl.querySelectorAll('img[data-img-id]'), function (img) {
      var id = img.dataset.imgId;
      if (!seen[id]) { seen[id] = true; ids.push(id); }
    });

    stripEl.innerHTML = '';
    stripEl.style.display = ids.length ? 'flex' : 'none';

    var token = ++stripRenderToken;
    ids.forEach(function (id) {
      getImageURL(id).then(function (url) {
        // 双重校验：本条渲染已被更新，或已切换笔记，都丢弃过期结果
        if (!url || token !== stripRenderToken || myToken !== openToken) return;
        var wrap = document.createElement('div');
        wrap.className = 'img-thumb';
        var srcImg = editorEl.querySelector('img[data-img-id="' + id + '"]');
        if (srcImg && srcImg.classList.contains('starred')) wrap.classList.add('starred'); // 缩略图同步星标

        var img = document.createElement('img');
        img.src = url;
        img.alt = '便签图片';

        wrap.appendChild(img);
        stripEl.appendChild(wrap);
      });
    });
  }

  // 删除便签时清理其图片，并回收已生成的 objectURL
  function cleanupImagesForNote(noteId) {
    dbDeleteImagesForNote(noteId).then(function (ids) {
      ids.forEach(function (id) {
        if (imgUrlCache[id]) {
          URL.revokeObjectURL(imgUrlCache[id]);
          delete imgUrlCache[id];
        }
      });
    }).catch(function () { /* 存储失败静默 */ });
  }

  /* ---------- 导出 / 导入 ---------- */

  function closeMenu() {
    menuPop.classList.remove('open');
    var mb = document.getElementById('menu-btn');
    if (mb) mb.classList.remove('open'); // 同步移除激活高亮
  }

  // Blob → base64（不带 data: 前缀），用 FileReader
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result);
        resolve(s.slice(s.indexOf(',') + 1));
      };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  // base64 → Blob，用 atob + Uint8Array
  function base64ToBlob(b64, mime) {
    var bin = atob(String(b64 || ''));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || 'application/octet-stream' });
  }

  function fileToText(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsText(file);
    });
  }

  // 核心导出：只导出 noteIds 里的笔记及其对应图片；filePrefix 决定文件名前缀
  function exportNotes(noteIds, filePrefix) {
    var idSet = {};
    (noteIds || []).forEach(function (id) { idSet[id] = true; });
    return openDB().then(function (db) {
      return Promise.all([
        reqAsPromise(db.transaction(STORE).objectStore(STORE).getAll()),
        reqAsPromise(db.transaction(IMAGES).objectStore(IMAGES).getAll())
      ]);
    }).then(function (all) {
      var noteRecs = all[0].filter(function (n) { return idSet[n.id]; }).map(normalizeNote);
      var imgRecs = all[1].filter(function (g) { return g.noteId && idSet[g.noteId]; });
      return Promise.all(imgRecs.map(function (rec) {
        return blobToBase64(rec.blob).then(function (b64) {
          return {
            id: rec.id, noteId: rec.noteId, mime: rec.mime, dataBase64: b64,
            pos: rec.pos, createdAt: rec.createdAt, // 附加字段，恢复时保留图片顺序
            starred: rec.starred === true // 保留重点标注
          };
        });
      })).then(function (imgs) {
        var payload = {
          version: 2, // v2：包含待办字段；导入侧兼容 version 1
          exportedAt: new Date().toISOString(),
          notes: noteRecs.map(function (n) {
            return {
              id: n.id, content: n.content, createdAt: n.createdAt, updatedAt: n.updatedAt,
              type: n.type, dueAt: n.dueAt, doneAt: n.doneAt,
              pinnedAt: n.pinnedAt, color: n.color, starred: n.starred,
              order: n.order // 拖拽排序字段
            };
          }),
          images: imgs
        };
        var d = new Date();
        var stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
        var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filePrefix + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      });
    }).catch(function () { alert('导出失败，请重试'); });
  }

  // ⋮ 菜单「导出」= 导出全部
  function doExport() {
    closeMenu();
    exportNotes(notes.map(function (n) { return n.id; }), 'notes-backup-');
  }

  function doImport() {
    closeMenu();
    importInput.click();
  }

  function validImportPayload(p) {
    return !!(p && typeof p === 'object' && (p.version === 1 || p.version === 2) &&
              Array.isArray(p.notes) &&
              (p.images === undefined || Array.isArray(p.images)));
  }

  function handleImportFile(file) {
    if (!file) return;
    fileToText(file).then(function (text) {
      var payload = JSON.parse(text); // 解析失败走 catch
      if (!validImportPayload(payload)) {
        alert('文件格式不正确，导入已取消');
        return;
      }
      var now = Date.now();
      var noteRecs = payload.notes.filter(function (n) {
        return n && typeof n.id === 'string';
      }).map(function (n) {
        // version 1 旧备份缺待办字段，按默认值补齐（dueAt/doneAt 为 null）
        var due = (payload.version >= 2 && typeof n.dueAt === 'number') ? n.dueAt : null;
        var done = (payload.version >= 2 && typeof n.doneAt === 'number') ? n.doneAt : null;
        return normalizeNote({
          id: n.id,
          content: typeof n.content === 'string' ? n.content : '',
          createdAt: Number(n.createdAt) || now,
          updatedAt: Number(n.updatedAt) || Number(n.createdAt) || now,
          type: n.type === 'todo' ? 'todo' : 'note',
          dueAt: due,
          doneAt: done,
          pinnedAt: (payload.version >= 2 && 'pinnedAt' in n && n.pinnedAt !== undefined) ? n.pinnedAt : null,
          color: (payload.version >= 2 && 'color' in n && n.color !== undefined) ? n.color : null,
          starred: (payload.version >= 2 && n.starred === true),
          order: typeof n.order === 'number' ? n.order : null // 拖拽排序字段（旧备份无则回退按创建时间）
        });
      });
      var imgRecs = (payload.images || []).filter(function (g) {
        return g && typeof g.id === 'string' && typeof g.dataBase64 === 'string';
      }).map(function (g) {
        return {
          id: g.id,
          noteId: typeof g.noteId === 'string' ? g.noteId : null,
          mime: typeof g.mime === 'string' ? g.mime : 'application/octet-stream',
          blob: base64ToBlob(g.dataBase64, g.mime),
          pos: Number(g.pos) || 0,

          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });

        return dbGetAll().then(function (arr) {
          notes = arr;
          backfillOrder(); // 导入后补齐缺失的 order（旧备份/无 order 字段的记录）

    Array.prototype.forEach.call(imgs, function (img) {

  // execCommand('hiliteColor') 不可用时 fallback：手动把选区包进 <mark>
  function wrapSelectionInMark() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    var range = sel.getRangeAt(0);
    var mk = document.createElement('mark');
    mk.appendChild(range.extractContents());
    range.insertNode(mk);
    sel.removeAllRanges();
    var r2 = document.createRange();
    r2.selectNodeContents(mk);
    sel.addRange(r2); // 选区保留
  }

  // 取消高亮：把选区 intersect 到的所有 <mark> 拆开（子节点原位移回）
  function unwrapSelectionMarks() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    var range = sel.getRangeAt(0);
    var marks = Array.prototype.slice.call(editorEl.querySelectorAll('mark'));
    marks.forEach(function (mk) {
      if (!range.intersectsNode(mk)) return;
      var p = mk.parentNode;
      if (!p) return;
      while (mk.firstChild) p.insertBefore(mk.firstChild, mk);
      p.removeChild(mk);
    });
    sel.removeAllRanges();
    sel.addRange(range); // 选区保留
  }

  // 高亮 toggle：已是高亮 → 取消；否则 execCommand，失败则包 <mark>
  function toggleHighlight() {
    if (!restoreSelection()) return; // 先恢复保存的选区再操作，与 execFmt 同一思路
    var markEl = selMarkAncestor();
    var stateOn = fmtState('hiliteColor');
    if (markEl) {
      unwrapSelectionMarks();
    } else if (stateOn) {
      document.execCommand('hiliteColor', false, 'transparent');
    } else {
      var ok = false;
      try { ok = document.execCommand('hiliteColor', false, '#FFF3B0'); } catch (e) {}
      if (!ok) wrapSelectionInMark();
    }
    refreshFmtStates();
    editorEl.dispatchEvent(new Event('input', { bubbles: true }));
  }

  fmtBoldBtn.addEventListener('click', function () { execFmt('bold'); });
  fmtHiliteBtn.addEventListener('click', toggleHighlight);

  // 按下不抢编辑器焦点，选区才不会丢（pointerdown 阻止焦点转移，click 仍会触发）
  Array.prototype.forEach.call([fmtBoldBtn, fmtHiliteBtn], function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    b.addEventListener('mousedown', function (e) { e.preventDefault(); }); // 不支持 Pointer Events 的旧内核兜底
  });

  // 选区持续记录 + 按钮可用态同步
  document.addEventListener('selectionchange', saveSelection);

  // 粘贴时只保留纯文本与换行，清掉富文本格式
  editorEl.addEventListener('paste', function (e) {
    e.preventDefault();
    var text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
    document.execCommand('insertText', false, text);
  });

  window.addEventListener('beforeunload', function () {
    if (currentId) autosave();
  });

  // 应用内提醒：启动时检查已到期未完成的待办，alert 提示（最多列 5 条）
  function checkDueReminders() {
    try {
      if (sessionStorage.getItem('due-reminded') === '1') return; // 本会话已提醒过
    } catch (e) { /* 隐私模式等场景 */ }
    var now = Date.now();
    var due = notes.filter(function (n) {
      return isTodo(n) && !isDone(n) && n.dueAt && n.dueAt <= now;
    }).sort(function (a, b) { return a.dueAt - b.dueAt; });
    if (!due.length) return;
    var lines = due.slice(0, 5).map(function (n) { return '· ' + titleOf(n); });
    if (due.length > 5) lines.push('...还有 ' + (due.length - 5) + ' 条');
    alert('你有 ' + due.length + ' 条待办已到期\n' + lines.join('\n'));
    try { sessionStorage.setItem('due-reminded', '1'); } catch (e) {}
  }

  // 启动：打开数据库 → 迁移旧 localStorage 数据 → 加载 → 首次渲染 → 到期提醒
  openDB()
    .then(migrateLegacy)
    .then(dbGetAll)
    .then(function (arr) {
      notes = arr;
      backfillOrder(); // 无 order 字段的旧便签按 createdAt 升序补齐（初始顺序按创建时间）
      updateSortMenu(); // 应用持久化的排序方式后再首次渲染
      renderList();
      checkDueReminders();
    })
    .catch(function () {
      // 数据库打不开（极端隐私模式等）时显示空列表
      renderList();
    });
})();

/* ---------- UI 动效增强层（独立 IIFE，只做表现增强，不改任何业务逻辑） ---------- */
(function () {
  'use strict';
  var listView = document.getElementById('list-view');
  var editorView = document.getElementById('editor-view');
  var viewerEl = document.getElementById('img-viewer');
  var listEl = document.getElementById('note-list');
  // 触觉反馈：不支持的平台静默忽略
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  /* --- 页面切换动画已简化并内联到业务层 show()：类名增删与 transitionend 清理
         都在同处完成，不再用 MutationObserver 观察/接管（原实现的存在 400ms
         静默窗口与 animationend 丢事件两个隐患，会导致 transform 停在中间态） --- */

  /* --- 图片查看器关闭动画接管：open 移除后保活 0.18s 淡出 --- */
  var closingLatch = false;
  var vo = new MutationObserver(function () {
    var open = viewerEl.classList.contains('open');
    if (!open && !closingLatch) {
      closingLatch = true;
      viewerEl.classList.add('closing');
    } else if (open) {
      closingLatch = false;
      viewerEl.classList.remove('closing');
    }
  });
  vo.observe(viewerEl, { attributes: true, attributeFilter: ['class'] });
  viewerEl.addEventListener('animationend', function (e) {
    if (e.animationName === 'viewer-fade-out') viewerEl.classList.remove('closing');
  });

  /* --- 首屏卡片依次入场：只对首次渲染生效，之后的重渲染不闪动 --- */
  var bootDone = false;
  var lo = new MutationObserver(function () {
    if (bootDone || !listEl.children.length) return;
    bootDone = true;
    lo.disconnect();
    listEl.classList.add('boot-in');
    setTimeout(function () { listEl.classList.remove('boot-in'); }, 600);
  });
  lo.observe(listEl, { childList: true });

  /* --- 主题切换 + 径向扩散过渡 ---
     统一走 DOM 覆盖层方案：真实页面保持旧主题不动，覆盖层以新主题底色为圆，
     从按钮处向四周扩散盖住旧主题，圆盖满后立即翻转真实主题。
     不用 CSS transition 驱动 clip-path（浏览器支持不稳定，会停顿/掉帧），
     改用 requestAnimationFrame 逐帧手写 clip-path 圆半径：
       每帧 r = maxRadius * easeInOutQuart(t / duration)，duration = 1100ms（cinematic 档），
       覆盖到屏幕后立即结束，无额外等待。
     prefers-reduced-motion 时直接切换，无动画。 */
  var themeBtn = document.getElementById('theme-btn');
  var rippleEl = document.getElementById('theme-ripple');
  var THEME_KEY = 'notes-theme';
  var root = document.documentElement;
  var animating = false;

  function currentTheme() { return root.getAttribute('data-theme') || 'light'; }

  // 图标随主题互切：浅色显示标准新月、深色显示标准太阳（圆形 + 8 条光线）。
  // 同一 SVG 内两个 <g> 用 display 属性互切（viewBox 0 0 24 24 与 path 坐标匹配，
  // 彻底解决旧 path 坐标残缺导致的“半圆月亮”问题）
  var themeSun = document.getElementById('theme-sun');
  var themeMoon = document.getElementById('theme-moon');
  function syncThemeBtn() {
    var dark = currentTheme() === 'dark';
    themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    themeBtn.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
    if (themeSun) themeSun.style.display = dark ? 'block' : 'none';
    if (themeMoon) themeMoon.style.display = dark ? 'none' : 'block';
  }
  syncThemeBtn();

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    syncThemeBtn();
  }

  // 按钮中心（视口坐标）：扩散起点。按钮未渲染时退化为屏幕中心
  //（coverRadius 仍保证圆形覆盖到最远角落；不写死右上角，避免圆心落在固定位置）
  function btnCenter() {
    var r = themeBtn.getBoundingClientRect();
    if (!r || (!r.width && !r.height)) {
      return { x: (window.innerWidth || 0) / 2, y: (window.innerHeight || 0) / 2 };
    }
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // 覆盖最远角落所需的圆半径
  function coverRadius(cx, cy) {
    var w = window.innerWidth || 0;
    var h = window.innerHeight || 0;
    return Math.ceil(Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy))) + 8;
  }

  function reducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function switchTheme(cx, cy) {
    if (animating) return; // 动画期间禁用
    var oldTheme = currentTheme();
    var newTheme = oldTheme === 'dark' ? 'light' : 'dark';

    if (reducedMotion()) { applyTheme(newTheme); return; } // 减少动态效果：无动画直接切

    var radius = coverRadius(cx, cy);
    animating = true;

    // 覆盖层只含纯背景色（新主题底色），从按钮处扩散盖住旧主题；
    // 圆盖满后的那一帧内同时完成「切主题 + 移除覆盖层」，不留中间帧，杜绝闪屏
    var layer = rippleEl.firstElementChild;
    layer.setAttribute('data-theme', newTheme);
    layer.style.clipPath = 'circle(0px at ' + cx + 'px ' + cy + 'px)';
    rippleEl.classList.add('on');
    void layer.offsetWidth; // 强制首帧定位生效，rAF 循环从此连续推进

    var DUR = 1100;
    var t0 = performance.now();
    // easeInOutQuart：t<0.5 → 8t⁴；否则 1 - 8·(t-1)⁴，等价 cubic-bezier(0.76, 0, 0.24, 1)。
    // 对称平滑：先缓慢起势、中段加速、再对称减速收尾 —— motion-tokens.md 的「有重量感铺开」
    var easeInOutQuart = function (x) {
      return x < 0.5 ? 8 * x * x * x * x : 1 - 8 * Math.pow(x - 1, 4);
    };
    var frame = function (now) {
      var t = Math.min(1, (now - t0) / DUR);
      var r = Math.ceil(radius * easeInOutQuart(t));
      layer.style.clipPath = 'circle(' + r + 'px at ' + cx + 'px ' + cy + 'px)';
      if (t < 1) { requestAnimationFrame(frame); return; }
      // 覆盖完成的那一帧（问题1修复：杜绝闪帧）：
      // ① 先给 <html> 设置 data-theme = 新主题（applyTheme 内 setAttribute，含持久化与图标同步）；
      // ② 强制重排一次（读取 offsetHeight），让浏览器立即按新主题重算样式；
      // ③ 在下一帧的 requestAnimationFrame 回调里才移除覆盖层——
      //    主题生效与覆盖层消失不在同一绘制帧，页面永远不会“露出旧主题”，无闪屏。
      //    移除是瞬时 display:none（无 transition），覆盖层纯色 var(--bg-page) 与页面一致。
      applyTheme(newTheme);
      void document.documentElement.offsetHeight;
      requestAnimationFrame(function () {
        rippleEl.classList.remove('on');
        layer.style.clipPath = '';
        layer.removeAttribute('data-theme');
        animating = false;
      });
    };
    requestAnimationFrame(frame);
  }

  // Bug1：真实触点坐标。click 的合成坐标在部分移动 WebView（幽灵点击/快速滑动松手）
  // 里不可靠甚至为 0；先在捕获阶段用 pointerdown 记录真实触点（触摸/鼠标均带坐标），
  // click 时优先用。键盘（Enter/Space）不产生 pointerdown，坐标保持 null 走按钮中心兜底。
  var lastTap = null;
  themeBtn.addEventListener('pointerdown', function (e) {
    lastTap = { x: e.clientX, y: e.clientY };
  });

  // 统一走 click：真实坐标优先；键盘（Enter/Space）合成的 click 无坐标，
  // 用按钮中心作扩散起点，也天然避免 keydown + 合成 click 双触发
  themeBtn.addEventListener('click', function (e) {
    if (animating) return;
    var cc = null;
    if (e.clientX || e.clientY) cc = { x: e.clientX, y: e.clientY }; // 常规 click 坐标可信
    else if (lastTap) cc = lastTap;                                  // 合成/幽灵 click 坐标全 0：用最近真实触点
    if (!cc) { var c = btnCenter(); cc = c; }                        // 键盘：按钮中心
    lastTap = null; // 只消费一次
    switchTheme(cc.x, cc.y);
  });

  // 跟随系统主题：仅在用户从未手动选择时生效
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSysChange = function (e) {
      var saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
      if (saved) return; // 用户已手动选择，不跟随系统
      var sys = e.matches ? 'dark' : 'light';
      if (currentTheme() !== sys) applyTheme(sys);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSysChange);
    else if (mq.addListener) mq.addListener(onSysChange); // 旧版 Safari
  }

  /* --- 触觉反馈：capture 阶段监听，不影响原处理逻辑 --- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('#sel-delete')) buzz(30); // 删除确认后 30ms
    if (t.closest('#sel-export') || t.closest('#menu-export')) buzz(20); // 导出 20ms
  }, true);
})();

/* ---------- Android 物理返回键：编辑页 → 列表；多选 → 退出多选；列表 → 退出 App ----------
   仅 Capacitor 打包环境生效：浏览器里 window.Capacitor 不存在，整段跳过，不影响网页测试。
   页面状态从 DOM class 读取（两个 IIFE 闭包内的 backToList/exitMultiMode 不直接可见），
   通过触发现有按钮的 click 复用原有处理函数，不改任何业务逻辑。 */
(function () {
  'use strict';
  if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)) return;
  var App = window.Capacitor.Plugins.App;
  App.addListener('backButton', function () {
    // 编辑页 → 返回列表（复用 #back-btn 的现有处理 backToList）
    if (document.getElementById('editor-view').classList.contains('active')) {
      document.getElementById('back-btn').click();
      return;
    }
    // 多选模式 → 退出多选（复用 #sel-cancel 的现有处理 exitMultiMode）
    if (document.getElementById('list-view').classList.contains('multi')) {
      document.getElementById('sel-cancel').click();
      return;
    }
    // 列表页且非多选 → 允许退出 App
    App.exitApp();
  });
})();
</script>
</body>
