<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"> <!-- interactive-widget：输入法弹出时压缩视口，列表不被键盘遮挡 -->
<title>便签 · 极简备忘录</title>
<script>
/* 主题初始化：渲染前同步执行，避免首帧闪错主题（FOUC）。
   优先读用户手动选择（localStorage），否则跟随系统。
   结果写在 <html data-theme="light|dark"> 上，CSS 用属性选择器而不是 media query，
   这样手动切换时无需系统配合也能生效。 */
(function () {
  try {
    var saved = localStorage.getItem('notes-theme');
    var dark = saved ? saved === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
  /* ============ 设计系统：颜色 / 圆角 / 阴影 / 缓动 ============ */
  :root {
    --bg-page: #F7F8FA;
    --bg-card: #FFFFFF;
    --bg-toolbar: rgba(255, 255, 255, 0.92);
    --text-primary: #1A1D21;
    --text-secondary: #6B7280;
    --text-tertiary: #A8ADB7;
    --divider: #EDEFF2;
    --primary: #2E6BE6;
    --primary-soft: #EAF1FD;
    --danger: #E5484D;
    --radius-card: 16px;
    --radius-btn: 12px;
    --radius-pill: 999px;
    --chip-bg: #F0F2F5;
    --chip-press: #E4E7EC;
    --tap-press: #FAFBFC;
    --sel-border: #D0D4DA;
    --sel-card: #F5F9FF;
    --icon-idle: #D8DCE3;
    --mask: rgba(0, 0, 0, 0.4);
    --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.06);
    --shadow-fab: 0 6px 20px rgba(46, 107, 230, 0.32);
    --card-border: 1px solid rgba(0, 0, 0, 0.04);
    --time-muted: #B0B4BB;
    --img-btn-bg: #EEF1F5;
    --img-btn-text: #6B7280;
    --count-color: #A8ADB7;
    --sel-count-color: #8A8F99;
    /* 组件级语义颜色：暗色模式 = 二级 token 重映射，组件不再单独写死色值 */
    --input-bg: #F0F2F5;
    --input-focus-bg: var(--bg-card);
    --input-placeholder: #A8ADB7;
    --input-clear-color: #A8ADB7;
    --input-clear-bg: rgba(0, 0, 0, 0.06);
    --input-clear-bg-active: rgba(0, 0, 0, 0.12);
    --icon-btn-color: #A8ADB7;
    --icon-btn-bg: #F0F2F5;
    --icon-btn-bg-active: #E1E4EA;
    --mark-bg: #FFF3B0;
    --pin-flag-color: #A8ADB7;
    --ease-swift: cubic-bezier(0.32, 0.72, 0, 1);
    --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.12);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* 深色变量：由 <html data-theme="dark"> 驱动（见 head 内的主题初始化脚本），
     不再用 prefers-color-scheme 媒体查询 —— 否则用户手动切换会被系统主题盖住 */
  [data-theme="dark"] {
      --bg-page: #0F1115;
      --bg-card: #1A1D21;
      --bg-toolbar: rgba(26, 29, 33, 0.92);
      --text-primary: #E8EAED;
      --text-secondary: #9AA0A6;
      --text-tertiary: #6E747D;
      --divider: #22262D;
      --primary: #2E6BE6;
      --primary-soft: #16233D;
      --danger: #E5484D;
      --chip-bg: #23272E;
      --chip-press: #2A2F36;
      --tap-press: #1F2329;
      --sel-border: #3A3F46;
      --sel-card: #14202F;
      --icon-idle: #2E333B;
      --mask: rgba(0, 0, 0, 0.55);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-pop: 0 8px 32px rgba(0, 0, 0, 0.5);
      --card-border: 1px solid rgba(255, 255, 255, 0.06);
      --time-muted: #6E747D;
      --img-btn-bg: #252932;
      --img-btn-text: #C8CDD5;
      --count-color: #6E747D;
      --sel-count-color: #9AA0A6;
      /* 组件级语义颜色暗色分支（与 :root 同名 token 一一对应） */
      --input-bg: #252932;
      --input-focus-bg: #252932;
      --input-placeholder: #6B7280;
      --input-clear-color: #6B7280;
      --input-clear-bg: rgba(255, 255, 255, 0.08);
      --input-clear-bg-active: rgba(255, 255, 255, 0.08);
      --icon-btn-color: #8A8F99;
      --icon-btn-bg: #252932;
      --icon-btn-bg-active: #30363F;
      --mark-bg: rgba(255, 243, 176, 0.28);
      --pin-flag-color: #9AA0A6;
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  button {
    font-family: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  img { -webkit-user-drag: none; }

  .view { display: none; height: 100dvh; }
  .view.active { display: flex; flex-direction: column; }
  /* 编辑页盖在列表上层（不透明背景）；切换时列表直接显隐，不再做视差联动 */
  #editor-view { position: relative; z-index: 2; background: var(--bg-page); }

  /* 页面切换（简化版）：基线态就是到位态 —— #editor-view.active 即 translateX(0)。
     进页：先加 .entering 摆到屏外 100%，强制重排后移除 → 一次性滑入到 0；
     返回：加 .leaving → 滑回 100% 后隐藏复位。
     transitionend（或 340ms 超时兜底）后移除临时 class；即使过渡事件全部丢失，
     基线最终态也是 translateX(0)，页面任何情况下都能滑到位、不留空白 */
  #editor-view.active { transform: translateX(0); transition: transform 0.28s var(--ease-swift); }
  #editor-view.active.entering { transform: translateX(100%); }
  #editor-view.active.leaving { transform: translateX(100%); }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes box-pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* ============ 列表页：毛玻璃顶栏（悬浮，列表从其下滚过） ============ */
  /* Bug3：列表页改为 fixed 覆盖视口（脱离文档流，编辑页打开期间保持渲染，不摘树）。
     display:none 会让子元素（右下角 + 按钮）的 CSS 动画在每次返回列表时整体重播，
     表现为 + 按钮「闪一下/重加载感」；visibility 隐藏不打断动画计时，返回时无重播。
     编辑页是不透明层，盖住即可。fixed + inset:0 与 .view 的 100dvh 等效，不撑高 body。 */
  #list-view { position: fixed; inset: 0; max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; visibility: hidden; }
  #list-view.active { visibility: visible; }
  #list-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    height: 56px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 10px 0 20px;
    background: var(--bg-toolbar);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--divider);
  }
  #list-header h1 { grid-column: 2; font-size: 17px; font-weight: 600; text-align: center; }
  #list-header .count { display: none; } /* 计数已移到列表第一行 #note-count-bar */

  /* 顶栏图标按钮：统一 44×44 点击区 / 20×20 图标居中 / 按钮间距 4px。
     未激活色 = 主文字色（浅色 #1A1D21 / 深色 #E8EAED），菜单展开 = 激活 = 主色 #2E6BE6。
     点击反馈：scale(0.92) + 底色，150ms ease，松开自动恢复。 */
  #theme-btn, #sel-enter, #menu-btn {
    width: 44px; height: 44px;
    padding: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--text-primary);
    transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.15s var(--ease);
  }
  #theme-btn:active, #sel-enter:active, #menu-btn:active {
    background: rgba(0, 0, 0, 0.04); /* 浅色点击底色 */
    transform: scale(0.92);
  }
  [data-theme="dark"] #theme-btn:active,
  [data-theme="dark"] #sel-enter:active,
  [data-theme="dark"] #menu-btn:active { background: rgba(255, 255, 255, 0.06); } /* 深色点击底色 */
  #menu-btn.open { color: var(--primary); } /* 菜单展开 = 激活态 */

  /* 主题图标初始态（JS 未跑时的首帧也正确）：浅色 = 新月，深色 = 太阳。
     切换时 JS 写 inline style（内联样式优先级高于此处，可随时覆盖） */
  #theme-sun { display: none; }
  #theme-moon { display: block; }
  [data-theme="dark"] #theme-sun { display: block; }
  [data-theme="dark"] #theme-moon { display: none; }

  /* 删除飞行时落点脉冲（落点锚点是「选择」图标，300ms 内 1 → 1.2 → 1，一次性 animation） */
  #sel-enter.pulsing { animation: trash-pulse 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes trash-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* 卡片删除飞行克隆体：fixed 定位、不拦截事件，JS 逐帧沿贝塞尔曲线飞向垃圾桶 */
  .fly-clone {
    position: fixed;
    z-index: 9998; /* 高于列表/顶栏/弹层，低于主题扩散过渡层(9999) */
    margin: 0;
    pointer-events: none;
    will-change: transform, opacity;
    transform-origin: right top; /* 缩放点指向右上角「选择」图标（删除动画落点锚点） */
    border-radius: var(--radius-card);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .fly-clone .note-item {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    margin: 0;
    display: block;
    list-style: none;
    box-shadow: none;
    cursor: default;
  }
  /* 克隆体只显示卡片本体：隐藏左滑按钮，并强制本体回到原位（展开态也不带位移） */
  .fly-clone .swipe-actions { display: none; }
  .fly-clone .swipe-body {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    border-radius: var(--radius-card);
    box-shadow: none;
    transform: none !important;
  }

  /* 顶栏右侧动作区：主题切换 | 选择 | ⋮ 菜单，间距统一 4px */
  .hdr-actions { grid-column: 3; justify-self: end; display: inline-flex; align-items: center; gap: 4px; }

  /* 多选模式顶栏：取消 / 已选 X 条 /（全选·删除·导出） */
  #sel-bar { display: none; align-items: center; gap: 8px; grid-column: 1 / -1; justify-content: space-between; }
  #list-header.selecting h1,
  #list-header.selecting .count,
  #list-header.selecting .menu-btn,
  #list-header.selecting .hdr-actions { display: none; }
  #list-header.selecting #sel-bar { display: flex; }
  /* 左「取消」：文字按钮，主色 #2E6BE6，15px/500 */
  #sel-bar #sel-cancel {
    min-height: 44px;
    padding: 0 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--primary);
    border-radius: 10px;
    transition: background 0.15s var(--ease), transform 0.15s var(--ease);
  }
  #sel-bar #sel-cancel:active { background: var(--chip-bg); transform: scale(0.94); }
  /* 中「已选 X 条」：14px，浅色 #8A8F99 / 深色 #9AA0A6（--sel-count-color） */
  #sel-count { font-size: 14px; color: var(--sel-count-color); animation: fade-in 0.2s var(--ease); }
  /* 右「全选 / 删除 / 导出」：14px/500，flex gap 12px 右对齐 */
  #sel-actions { display: inline-flex; align-items: center; gap: 12px; }
  #sel-actions button {
    min-height: 44px;
    padding: 0 6px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 10px;
    transition: background 0.15s var(--ease), transform 0.15s var(--ease);
  }
  #sel-actions button:active { background: var(--chip-bg); transform: scale(0.94); }
  #sel-all { color: var(--text-secondary); } /* #6B7280 灰 */
  #sel-delete { color: var(--danger); }      /* #E5484D 红（沿用批量删除主色） */
  #sel-export { color: var(--primary); }     /* #2E6BE6 主色 */

  /* 列表页第一行：条数小字提示（#note-count 由原 JS 继续写入，位置从顶栏移到这里） */
  #note-count-bar {
    flex: 0 0 auto;
    margin: calc(env(safe-area-inset-top) + 68px) 20px 0;
    font-size: 14px;
    line-height: 1;
    color: var(--count-color);
  }
  #list-view.multi #note-count-bar { visibility: hidden; }

  /* ============ 主题径向扩散过渡（View Transitions API 优先，clip-path 兜底） ============ */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; } /* 新主题截图盖在旧主题上方，由 clip-path 揭开 */
  #theme-ripple {
    position: fixed; inset: 0;
    z-index: 9999; /* 高于 #img-viewer(100)，整个过渡在所有 UI 之上 */
    display: none;
    pointer-events: none; /* 老主题在下层照常可见可点，过渡本身不吃事件 */
  }
  #theme-ripple.on { display: block; }
  /* 覆盖层底色由 JS 写入的 data-theme 决定（属性选择器对任意元素生效），
     即新主题页面底色；View Transitions 可用时整层不会被用到 */
  #theme-ripple > .ripple-layer { position: absolute; inset: 0; background: var(--bg-page); }
  @media (prefers-reduced-motion: reduce) {
    #theme-ripple, #theme-ripple.on { display: none !important; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
  }

  /* 搜索框：顶栏下方、分段控件上方 */
  #search-wrap {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    margin: 10px 20px 0;
    padding: 0 12px;
    background: var(--input-bg);
    border: 1px solid transparent;
    border-radius: 10px;
    transition: background 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  #search-wrap:focus-within { background: var(--input-focus-bg); border-color: var(--primary); }
  #search-icon { flex: 0 0 auto; color: #A8ADB7; }
  #search-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
  }
  #search-input::placeholder { color: #A8ADB7; }
  #search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; } /* 用自定义 ×，隐藏原生清除按钮 */
  #search-clear {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    display: none;
    align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--input-clear-color);
    background: var(--input-clear-bg);
    transition: background 0.15s var(--ease);
  }
  #search-clear:active { background: var(--input-clear-bg-active); }
  #search-wrap.has-text #search-clear { display: inline-flex; }
  /* 关键词高亮 */
  .note-item .title mark,
  .note-item .summary mark {
    background: var(--mark-bg);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  /* 搜索无结果提示 */
  #search-empty {
    display: none;
    padding: 80px 20px 0;
    text-align: center;
    font-size: 14px;
    color: #8A8F99;
  }

  /* 列表区与卡片 */
  #note-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    list-style: none;
    padding: 12px 20px calc(110px + env(safe-area-inset-bottom));
  }
  /* 左滑操作菜单 + 拖拽排序（手势层，纯 Touch Events）依赖的结构：
     li.note-item 是手势容器（touch-action: none 常驻，浏览器绝不接管任何手势，
     纵向滚动也由 JS 手动驱动 listEl.scrollTop）；
     内部先放 .swipe-actions（右侧三个操作按钮），再放 .swipe-body（卡片本体）。
     位移动画只改 transform / opacity；平时放开 overflow 让阴影正常溢出，
     滑动/展开/拖拽期间裁剪左侧伸出部分 */
  .note-item {
    position: relative;
    margin-bottom: 10px;
    border-radius: var(--radius-card);
    cursor: pointer;
    list-style: none;
    touch-action: none; /* 常驻禁用浏览器手势：滚动/左滑/拖拽全走 JS（passive:false + preventDefault） */
  }
  .note-item.swiping, .note-item.swipe-open { overflow: hidden; }
  /* （旧 .gesturing { touch-action:none !important } 已随 Pointer Events 手势层一起删除：
     .note-item 现在常驻 touch-action:none，无需动态切换） */
  /* Bug2(B)：菜单的物理裁剪边界（overflow:hidden 裁掉右缘外待命的菜单），
     z-index:1 在卡片(z-index:2)之下；无背景 → 跟手露出的列表底色，不是『待命面板』 */
  .note-item .swipe-clip {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 120px;
    overflow: hidden;
    border-radius: var(--radius-card);
    z-index: 1;
    will-change: transform;
  }
  .note-item.swipe-reveal .swipe-actions { transform: translateX(0); } /* 越过阈值：菜单从右侧滑入 */
  .note-item.swipe-open .swipe-actions { transform: translateX(0); }   /* 吸附后：恒全露（兜底） */
  /* 左滑操作区：置顶 / 复制 / 删除 三枚按钮，位于卡片本体之下右侧 */
  .note-item .swipe-actions {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 120px; /* 3 × 40px，与展开位移 -120px 完全对齐 */
    display: flex;
    overflow: hidden;
    border-radius: var(--radius-card);
    background: var(--chip-bg);
    /* Bug2(B)：初始藏在裁剪容器右缘外（translateX(100%) 被 .swipe-clip 裁掉），
       不再『一直待命被卡片揭开』；左滑越过阈值（swipe-reveal）或吸附（swipe-open）才滑入 */
    transform: translateX(100%);
    transition: transform 0.25s var(--ease-swift);
    will-change: transform; /* 与卡片同为合成层，按 z-index 稳定排序 */
  }
  .note-item .swipe-btn {
    pointer-events: auto; /* 任何时刻可点，永不被父级/手势禁用 */
    flex: 1 0 0;
    min-width: 0;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0;
    font-size: 10px;
    line-height: 1.1;
    color: var(--text-secondary);
    background: var(--chip-bg);
    border-radius: 0;
    transition: background 0.15s var(--ease), opacity 0.15s var(--ease);
  }
  .note-item .swipe-btn + .swipe-btn { border-left: 1px solid rgba(0, 0, 0, 0.05); }
  .note-item .swipe-btn:active { opacity: 0.72; }
  .note-item .swipe-btn:last-child {
    border-top-right-radius: var(--radius-card);
    border-bottom-right-radius: var(--radius-card);
  }
  .note-item .swipe-btn.danger { background: var(--danger); color: #fff; }
  .note-item .swipe-btn.danger + .swipe-btn,
  .note-item .swipe-btn + .swipe-btn.danger { border-left: none; }
  /* 卡片本体（白色卡面）：随左滑 translate3d 位移；拖拽时放大+阴影 */
  .note-item .swipe-body {
    position: relative;
    background: var(--bg-card);
    border: var(--card-border);
    border-radius: var(--radius-card);
    padding: 18px 20px;
    box-shadow: var(--shadow-card);
    transition: background 0.18s var(--ease), transform 0.25s var(--ease-swift), box-shadow 0.18s var(--ease);
    will-change: transform;
    z-index: 2; /* Bug2(B)：显式确立『卡片在上』；与 .swipe-clip 同为合成层，按 z-index 排序 */
  }
  .note-item .swipe-body:active { background: var(--tap-press); }
  .note-item.swiping .swipe-body { transition: none; } /* 跟手时关过渡 */
  .note-item.swipe-open .swipe-body { transform: translate3d(-120px, 0, 0); }
  /* 拖拽排序：被拖卡片浮起（z-index 最高、跟随手指），其余卡片让位/落位动画 */
  .note-item.dragging { z-index: 30; transition: none; }
  .note-item.dragging .swipe-body { box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18); transition: none; }
  .note-item.drag-shift { transition: transform 0.2s var(--ease); }
  .note-item.drag-anim { transition: transform 0.22s var(--ease-swift), box-shadow 0.22s var(--ease); }
  .note-item .note-body {
    flex: 1; min-width: 0;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "title time"
      "excerpt excerpt";
  }
  .note-item .title {
    grid-area: title;
    font-size: 16px; font-weight: 600; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-item .summary {
    font-size: 14px; line-height: 1.5; color: var(--text-secondary);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
  }
  /* 摘要展开态：展示全文（仅由 .summary-toggle 按钮切换） */
  .note-item .summary.expanded {
    -webkit-line-clamp: unset;
    line-clamp: unset;
    display: block;
    overflow: visible;
  }
  /* 测量态：临时解除钳制量出自然高，量完立即移除（不产生闪烁） */
  .summary-measure {
    -webkit-line-clamp: unset !important;
    line-clamp: unset !important;
    display: block !important;
    overflow: visible !important;
    height: auto !important;
  }
  /* 摘要包裹层：展开按钮的定位锚点；有按钮时给右侧留出按钮位 */
  .note-item .excerpt-wrap {
    position: relative;
    grid-area: excerpt;
    margin-top: 8px;
    min-height: 0;
  }
  .note-item .excerpt-wrap .summary { margin-top: 0; }
  .note-item .excerpt-wrap.has-toggle { padding-right: 28px; }
  .note-item .time { grid-area: time; align-self: baseline; font-size: 12px; color: var(--time-muted); padding-left: 10px; }

  /* 摘要展开/收起按钮：仅当摘要超过 2 行时由 JS 创建。
     26px 圆形，贴在摘要区右侧（垂直居中），内含 14px chevron-down。
     点击只切换本条摘要的 .expanded，不触发卡片打开/长按，不影响页面滚动 */
  .summary-toggle {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--icon-btn-color);
    background: var(--icon-btn-bg);
    border: none; padding: 0; margin: 0;
    cursor: pointer;
    transition: background 0.15s var(--ease);
    z-index: 2;
  }
  .summary-toggle:active { background: var(--icon-btn-bg-active); }
  .summary-toggle svg { transition: transform 0.22s var(--ease); will-change: transform; }
  .summary-toggle.open svg { transform: rotate(180deg); }

  /* 多选模式：圆形复选框 + 选中态 */
  .note-item .sel-box {
    display: none;
    flex: 0 0 auto;
    width: 22px; height: 22px; margin-top: 2px;
    border: 2px solid var(--sel-border);
    border-radius: 50%;
    background: var(--bg-card);
    align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
    color: transparent;
  }
  #list-view.multi .note-item .swipe-body { display: flex; gap: 12px; padding-left: 28px; }
  #list-view.multi .sel-box { display: inline-flex; animation: box-pop 0.2s var(--ease-spring); }
  .note-item .sel-box.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .note-item:has(.sel-box.on) { background: var(--sel-card); }

  /* 分段控件：全部 / 待办 / 已完成（选中项白底浮起） */
  #seg-bar {
    flex: 0 0 auto;
    display: flex;
    width: max-content;
    margin: 10px 20px 4px;
    padding: 3px;
    background: var(--chip-bg);
    border-radius: var(--radius-pill);
    transition: background 0.18s var(--ease);
  }
  #seg-bar .seg-item {
    min-height: 34px;
    padding: 0 18px;
    font-size: 14px;
    color: var(--text-secondary);
    border-radius: var(--radius-pill);
    transition: color 0.18s var(--ease), background 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  #seg-bar .seg-item.on {
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  }
  #list-view.multi #seg-bar { display: none; }

  /* 待办卡片：左侧圆形复选框 + 完成态 + 倒计时角标 */
  .note-item .todo-chk {
    display: none;
    flex: 0 0 auto;
    width: 22px; height: 22px;
    margin-top: 2px;
    border: 2px solid var(--sel-border);
    border-radius: 50%;
    background: var(--bg-card);
    align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
    color: transparent;
    cursor: pointer;
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  #list-view:not(.multi) .is-todo .todo-chk { display: inline-flex; animation: box-pop 0.2s var(--ease-spring); }
  .note-item .todo-chk.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .note-item.is-done { opacity: 0.6; }
  .note-item.is-done .title { text-decoration: line-through; }
  .note-item .due-badge {
    position: absolute;
    top: 12px; right: 14px;
    font-size: 12px; line-height: 1;
    color: var(--text-secondary);
    padding: 3px 8px;
    background: var(--chip-bg);
    border-radius: var(--radius-pill);
  }
  .note-item .due-badge.overdue { color: #fff; background: var(--danger); }
  /* 倒计时角标占用标题行右侧位置：有角标时隐藏时间戳，避免重叠 */
  .note-item.has-due .time { display: none; }

  /* 空状态 */
  #empty {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 68px 20px 80px;
    text-align: center;
  }
  #empty .empty-icon { color: var(--icon-idle); }
  #empty .empty-title { font-size: 15px; color: var(--text-secondary); margin-top: 24px; }
  #empty .empty-hint { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; }

  /* 新建选项 action sheet：底部滑入 */
  #fab-sheet {
    position: fixed; inset: 0;
    z-index: 40;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: var(--mask);
  }
  #fab-sheet.open { display: flex; }
  #fab-sheet .sheet-card {
    width: calc(100% - 24px);
    max-width: 400px;
    margin: 0 12px calc(env(safe-area-inset-bottom) + 16px);
    padding: 8px;
    background: var(--bg-card);
    border-radius: 16px;
    box-shadow: var(--shadow-pop);
    animation: sheet-in 0.28s var(--ease-swift);
  }
  #fab-sheet .sheet-opt,
  #fab-sheet .sheet-cancel {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 52px;
    font-size: 16px;
    color: var(--text-primary);
    border-radius: 12px;
    transition: background 0.15s var(--ease);
  }
  #fab-sheet .sheet-opt:active,
  #fab-sheet .sheet-cancel:active { background: var(--bg-page); }
  #fab-sheet .sheet-cancel {
    margin-top: 6px;
    color: var(--text-secondary);
    border-top: 1px solid var(--divider);
    border-radius: 0 0 12px 12px;
  }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: none; } }

  /* 图片长按菜单（编辑页）：与单条操作菜单同风格 */
  #img-menu {
    position: fixed; inset: 0;
    z-index: 41;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: var(--mask);
  }
  #img-menu.open { display: flex; }
  #img-menu .sheet-card {
    width: 100%;
    max-width: 400px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.82);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    border-radius: 16px 16px 0 0;
    box-shadow: var(--shadow-pop);
    animation: sheet-in 0.28s var(--ease-swift);
  }
  #img-menu .sheet-opt,
  #img-menu .sheet-cancel {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 52px;
    font-size: 16px;
    color: var(--text-primary);
    border-radius: 12px;
    transition: background 0.15s var(--ease);
  }
  #img-menu .sheet-opt:active,
  #img-menu .sheet-cancel:active { background: rgba(0, 0, 0, 0.05); }
  #img-menu .sheet-opt svg { flex: 0 0 auto; color: var(--text-secondary); }
  #img-menu .sheet-opt.danger,
  #img-menu .sheet-opt.danger svg { color: var(--danger); }
  #img-menu .sheet-cancel {
    justify-content: center;
    min-height: 48px;
    margin-top: 6px;
    color: var(--text-secondary);
    border-top: 1px solid var(--divider);
    border-radius: 0 0 12px 12px;
  }

  /* 编辑页：待办头部（完成复选框）与提醒按钮/弹层 */
  #editor-todo-head {
    display: none;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 14px 20px 0;
  }
  #editor-todo-chk {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border: 2px solid var(--sel-border);
    border-radius: 50%;
    background: var(--bg-card);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
    color: transparent;
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  #editor-todo-chk.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  #editor-todo-chk + span { font-size: 13px; color: var(--text-secondary); }
  #due-btn {
    display: none;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 14px;
    margin-left: 12px;
    border-radius: var(--radius-pill);
    background: var(--img-btn-bg);
    color: var(--img-btn-text);
    font-size: 14px; font-weight: 500;
    transition: background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #due-btn:active { background: var(--chip-press); transform: scale(0.96); will-change: transform; }
  #due-pop {
    position: absolute;
    bottom: calc(60px + env(safe-area-inset-bottom));
    left: 12px;
    z-index: 20;
    display: none;
    padding: 12px;
    background: var(--bg-card);
    border: 1px solid var(--divider);
    border-radius: 14px;
    box-shadow: var(--shadow-pop);
  }
  #due-pop.open { display: block; animation: pop-in 0.18s var(--ease); }
  #due-input {
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    background: var(--bg-page);
    border: 1px solid var(--divider);
    border-radius: 10px;
    padding: 8px 10px;
  }
  #due-clear {
    min-height: 36px;
    margin-left: 8px;
    padding: 0 12px;
    font-size: 14px;
    color: var(--danger);
    border-radius: 10px;
    transition: background 0.15s var(--ease);
  }
  #due-clear:active { background: rgba(229, 72, 77, 0.1); }

  /* 操作反馈 toast（撤销/重做与置顶/复制/删除共用）：
     底部安全区上方 80px，半透明黑底白字胶囊。
     入场 200ms 快入（motion-web ease-out 档），出场 150ms linear。 */
  #undo-toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 80px);
    left: 50%;
    z-index: 9999; /* body 直下节点：必须盖过所有 view/顶栏/弹层 */
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 13px;
    border-radius: var(--radius-pill);
    opacity: 0;
    transform: translate(-50%, 8px);
    pointer-events: none;
    transition: opacity 0.15s linear, transform 0.15s linear; /* 出场 150ms linear */
  }
  #undo-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
    transition: opacity 0.2s cubic-bezier(0, 0.55, 0.45, 1), /* 入场 200ms 快入 */
                transform 0.2s cubic-bezier(0, 0.55, 0.45, 1);
  }

  /* 确认对话框（替代原生 confirm，按钮文字固定为“是/否”）：
     遮罩 rgba(0,0,0,0.4) 淡入 150ms；白卡 280px / 圆角 16px / padding 24px */
  #confirm-modal {
    position: fixed;
    inset: 0;
    z-index: 120;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--mask);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s linear, visibility 0.15s linear;
  }
  #confirm-modal.show { opacity: 1; visibility: visible; }
  #confirm-modal .confirm-card {
    width: 280px;
    max-width: calc(100vw - 48px);
    padding: 24px;
    background: var(--bg-card);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    transform: translateY(6px) scale(0.98);
    transition: transform 0.15s cubic-bezier(0, 0.55, 0.45, 1);
  }
  #confirm-modal.show .confirm-card { transform: none; }
  #confirm-modal .confirm-title {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
  }
  #confirm-modal .confirm-msg {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-secondary);
  }
  #confirm-modal .confirm-btns { display: flex; gap: 12px; }
  #confirm-modal .confirm-btns button {
    flex: 1;
    height: 44px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: filter 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #confirm-modal .confirm-cancel { background: #F0F2F5; color: #1A1D21; }
  #confirm-modal .confirm-ok { background: #E5484D; color: #fff; }
  #confirm-modal .confirm-btns button:active { transform: scale(0.97); filter: brightness(0.96); }
  [data-theme="dark"] #confirm-modal .confirm-card { background: #1A1D21; }
  [data-theme="dark"] #confirm-modal .confirm-title { color: #E8EAED; }
  [data-theme="dark"] #confirm-modal .confirm-msg { color: #9AA0A6; }
  [data-theme="dark"] #confirm-modal .confirm-cancel { background: #23272E; color: #E8EAED; }

  /* 悬浮新建按钮 */
  #add-btn {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    bottom: max(28px, calc(env(safe-area-inset-bottom) + 28px));
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-fab);
    z-index: 10;
    /* Bug3：删掉 animation: fab-pop —— @keyframes fab-pop 从未定义（死引用）；
       且列表从 display:none 恢复时该动画会整体重播，加剧 + 按钮「闪一下」 */
    transition: transform 0.3s var(--ease-spring), background 0.15s var(--ease), filter 0.15s var(--ease);
  }
  #list-view.sheet-open #add-btn { transform: scale(0.9); opacity: 0.7; }
  #add-btn svg { animation: fab-breathe 1.5s var(--ease) 0.4s infinite; will-change: transform; }
  #add-btn:active { transform: scale(0.94); filter: brightness(0.9); will-change: transform; }
  @keyframes fab-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

  /* ============ 编辑页 ============ */
  .editor-bar {
    height: 56px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 8px;
    background: var(--bg-toolbar);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--divider);
  }
  .editor-bar-left { display: flex; justify-self: start; }
  #back-btn {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--text-secondary);
    transition: background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #back-btn:active { background: var(--chip-bg); transform: scale(0.94); will-change: transform; }
  .bar-spacer { width: 1px; }
  .editor-bar-right { display: flex; justify-self: end; align-items: center; gap: 8px; }
  .undo-redo-btn {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--text-secondary);
    transition: background 0.15s var(--ease), transform 0.1s var(--ease), opacity 0.15s var(--ease);
  }
  .undo-redo-btn:active { background: var(--chip-bg); transform: scale(0.94); will-change: transform; }
  .undo-redo-btn:disabled { opacity: 0.3; pointer-events: none; }
  #delete-btn {
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--danger);
    transition: background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #delete-btn:active { background: rgba(229, 72, 77, 0.1); transform: scale(0.96); will-change: transform; }
  /* 分享按钮：主色图标，点击区域 44x44 */
  #share-btn {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--primary);
    transition: background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #share-btn:active { background: var(--chip-bg); transform: scale(0.94); will-change: transform; }

  /* 分享兜底 modal：剪贴板 API 不可用时手动复制 */
  #share-mask {
    position: fixed; inset: 0; z-index: 60;
    display: none;
    align-items: center; justify-content: center;
    background: var(--mask);
  }
  #share-mask.open { display: flex; animation: fade-in 0.2s var(--ease); }
  #share-card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 20px;
    width: calc(100% - 48px); max-width: 360px;
    box-shadow: var(--shadow-pop);
    animation: pop-in 0.2s var(--ease);
  }
  #share-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  #share-text {
    width: 100%; height: 180px;
    font-family: inherit;
    font-size: 13px; line-height: 1.5;
    color: var(--text-primary);
    background: var(--bg-page);
    border: 1px solid var(--divider);
    border-radius: 10px;
    padding: 10px;
    resize: none;
    outline: none;
  }
  #share-actions { display: flex; gap: 10px; margin-top: 14px; }
  #share-actions button {
    flex: 1;
    min-height: 40px;
    border-radius: var(--radius-btn);
    font-size: 14px; font-weight: 600;
    transition: transform 0.1s var(--ease);
  }
  #share-actions button:active { transform: scale(0.96); }
  #share-copy { background: var(--primary); color: #fff; }
  #share-close { background: var(--chip-bg); color: var(--text-secondary); }

  #editor {
    flex: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border: none;
    outline: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: transparent;
    color: var(--text-primary);
    caret-color: var(--primary);
    font-size: 16px;
    line-height: 1.75;
    padding: 20px;
    min-height: calc(100vh - 180px);
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
  }
  #editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text-tertiary);
    pointer-events: none;
  }
  #editor img {
    max-width: 100%;
    border-radius: 10px;
    margin: 10px 0;
    vertical-align: middle;
    -webkit-touch-callout: none; /* 长按不弹系统菜单 */
    -webkit-user-select: none;
    user-select: none;
  }
  #editor img.lp-dim { filter: brightness(0.65); transition: filter 0.15s ease; }
  /* 图片重点标注：主色边框 + 右上角小星标 */
  #editor img.starred {
    position: relative;
    border: 2px solid var(--primary);
  }
  #editor img.starred::after {
    content: '⭐';
    position: absolute;
    top: 6px; right: 6px;
    font-size: 18px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));
    pointer-events: none;
  }
  /* 缩略图条同步显示重点标注 */
  .img-thumb { position: relative; }
  .img-thumb.starred { outline: 2px solid var(--primary); outline-offset: -2px; }
  .img-thumb.starred::after {
    content: '⭐';
    position: absolute;
    top: 4px; right: 4px;
    font-size: 18px;
    line-height: 1;
    pointer-events: none;
  }

  /* 底部常驻格式按钮：与图片按钮同风格的胶囊（无选区时置灰禁用） */
  #fmt-bold,
  #fmt-hilite {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    min-height: 36px;
    padding: 8px 12px;
    border-radius: var(--radius-pill);
    background: var(--img-btn-bg);
    color: var(--img-btn-text);
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s var(--ease), transform 0.1s var(--ease), color 0.15s var(--ease);
  }
  #fmt-bold { font-weight: 800; } /* 字面 B 加粗显示，与工具栏其它文字一致 */
  #fmt-bold:active,
  #fmt-hilite:active { background: var(--chip-press); transform: scale(0.96); will-change: transform; }
  /* 已应用格式的按下态反馈（active 类由 JS 同步） */
  #fmt-bold.on,
  #fmt-hilite.on { background: var(--primary-soft); color: var(--primary); }
  /* 无选区：置灰不可用（disabled 时 pointer-events 放行，仍可视觉置灰） */
  #fmt-bold:disabled,
  #fmt-hilite:disabled { opacity: 0.45; pointer-events: none; }
  /* 编辑器里手动高亮的颜色（搜索页 mark 是另一个作用域，互不影响） */
  #editor mark { background: #FFF3B0; color: inherit; border-radius: 2px; }
  /* 列表卡片右上角“含重点图片”星标 */
  .note-item .star-flag {
    position: absolute;
    top: 12px; right: 12px;
    font-size: 16px;
    line-height: 1;
  }
  .note-item.has-star .time { padding-right: 20px; } /* 给星标让位，避免压住时间 */
  .note-item.has-star.has-due .star-flag { right: 76px; } /* 有倒计时角标时往左让位 */

  /* 置顶卡片：左侧 3px 主色竖条（60% 高、垂直居中）+ 右上角小图钉；多选模式下隐藏 */
  #list-view:not(.multi) .note-item.is-pinned .swipe-body::before {
    content: '';
    position: absolute;
    left: 0; top: 20%;
    width: 3px; height: 60%;
    background: var(--primary);
    border-radius: 2px;
  }
  .note-item .pin-flag {
    display: none;
    position: absolute;
    top: 12px; right: 12px;
    color: var(--pin-flag-color);
    line-height: 1;
  }
  #list-view:not(.multi) .note-item.is-pinned .pin-flag { display: block; }
  .note-item.has-pin .time { padding-right: 22px; } /* 给图钉让位 */
  .note-item.has-pin.has-due .pin-flag { right: 76px; } /* 有倒计时角标时往左让位 */
  .note-item.has-pin .star-flag { right: 34px; } /* 星标与图钉并存时错开 */
  .note-item.has-pin.has-due .star-flag { right: 98px; }
  /* 置顶区与普通区之间的分割线（只在有置顶便签时渲染） */
  .pin-divider {
    height: 1px;
    margin: 12px 0;
    background: var(--divider);
    list-style: none;
  }

  /* 底部工具条：图片按钮 + 保存状态 */
  .editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: calc(60px + env(safe-area-inset-bottom));
    padding: 8px 12px env(safe-area-inset-bottom);
    background: var(--bg-toolbar);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--divider);
  }
  #img-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    background: var(--img-btn-bg);
    color: var(--img-btn-text);
    font-size: 14px; font-weight: 500;
    transition: background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #img-btn:active { background: var(--chip-press); transform: scale(0.96); will-change: transform; }
  /* 三个胶囊按钮容器：横向排列、间距 8px、靠左 */
  .tool-group { display: flex; align-items: center; gap: 8px; }
  #save-status {
    font-size: 12px;
    color: var(--text-tertiary);
    opacity: 0;
    transition: opacity 0.3s var(--ease);
    padding-right: 8px;
  }
  #save-status.show { opacity: 1; }
  /* 编辑页字数统计：与图片按钮同行，靠右显示 */
  #word-count {
    font-size: 12px;
    color: #A8ADB7;
    padding-right: 8px;
    font-variant-numeric: tabular-nums; /* 数字宽度一致，防跳动 */
  }

  #image-strip {
    display: none;
    gap: 10px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 10px 20px;
    border-bottom: 1px solid var(--divider); /* 极浅分割线（contenteditable 内无法插 DOM，退而求其次放在缩略图条下缘） */
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .img-thumb {
    flex: 0 0 auto;
    width: 72px; height: 72px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============ ⋮ 菜单与关于弹窗 ============ */
  #menu-pop {
    position: absolute;
    right: 16px; top: 60px;
    z-index: 30;
    display: none;
    min-width: 160px;
    padding: 6px;
    background: var(--bg-card);
    border: 1px solid var(--divider);
    border-radius: 14px;
    box-shadow: var(--shadow-pop);
    transform-origin: top right;
  }
  #menu-pop.open { display: block; animation: pop-in 0.18s var(--ease); }
  #menu-pop button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 15px;
    color: var(--text-primary);
    text-align: left;
    transition: background 0.15s var(--ease);
  }
  #menu-pop button:active { background: var(--bg-page); }
  #menu-pop svg { color: var(--text-secondary); flex: 0 0 auto; }
  /* 菜单分组分割线 */
  #menu-pop .menu-sep {
    height: 1px;
    margin: 6px 12px;
    background: var(--divider);
  }
  /* 排序选项：勾号占位，未选中留空但保持对齐 */
  #menu-pop .menu-sort-check {
    flex: 0 0 auto;
    width: 18px;
    text-align: center;
    font-weight: 700;
    color: var(--primary);
  }

  #about-mask {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    align-items: center; justify-content: center;
    background: var(--mask);
  }
  #about-mask.open { display: flex; animation: fade-in 0.2s var(--ease); }
  #about-card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 28px 24px;
    width: calc(100% - 48px); max-width: 320px;
    text-align: center;
    box-shadow: var(--shadow-pop);
    animation: pop-in 0.2s var(--ease);
  }
  #about-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  #about-card p { font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 20px; }
  #about-close {
    border-radius: var(--radius-pill);
    background: var(--primary);
    color: #fff;
    font-size: 15px; font-weight: 600;
    padding: 11px 28px;
    transition: transform 0.15s var(--ease);
  }
  #about-close:active { transform: scale(0.96); }

  /* ============ 图片全屏查看器 ============ */
  #img-viewer {
    position: fixed; inset: 0; z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.92);
    touch-action: none; /* 手势交给 JS，浏览器不缩放不滚动 */
  }
  #img-viewer.open { display: flex; animation: fade-in 0.2s var(--ease); will-change: opacity; }
  /* 关闭动画由增强层接管：加 .closing 保持可见并淡出 0.18s */
  #img-viewer.closing { display: flex; animation: fade-out 0.18s var(--ease) forwards; }
  #img-viewer.closing #viewer-img { visibility: hidden; } /* 原 close 逻辑已移除 src，隐藏空图 */
  @keyframes viewer-fade-out { from { opacity: 1; } to { opacity: 0; } }
  #viewer-img {
    max-width: 95%;
    max-height: 95%;
    border-radius: 8px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    will-change: transform, opacity;
    animation: viewer-in 0.24s var(--ease-spring);
  }
  @keyframes viewer-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  #viewer-close {
    position: absolute;
    top: 20px; right: 20px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    transition: background 0.15s var(--ease), transform 0.1s var(--ease);
  }
  #viewer-close:active { background: rgba(255, 255, 255, 0.22); transform: scale(0.94); will-change: transform; }

  /* ============ 响应式：平板/横屏 ============ */
  @media (min-width: 600px) {
    .note-item { max-width: 640px; margin-left: auto; margin-right: auto; }
    #editor { max-width: 720px; }
  }

  /* ============ 首屏卡片依次入场（由增强层临时加 .boot-in） ============ */
  @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #note-list.boot-in .note-item { animation: card-in 0.2s var(--ease-swift) both; will-change: transform, opacity; }
  #note-list.boot-in .note-item:nth-child(2) { animation-delay: 0.03s; }
  #note-list.boot-in .note-item:nth-child(3) { animation-delay: 0.06s; }
  #note-list.boot-in .note-item:nth-child(4) { animation-delay: 0.09s; }
  #note-list.boot-in .note-item:nth-child(5) { animation-delay: 0.12s; }
  #note-list.boot-in .note-item:nth-child(6) { animation-delay: 0.15s; }
  #note-list.boot-in .note-item:nth-child(7) { animation-delay: 0.18s; }
  #note-list.boot-in .note-item:nth-child(n+8) { animation-delay: 0.2s; } /* 总时长封顶 0.4s */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- 主界面：便签列表 -->
<section id="list-view" class="view active">
  <div id="note-count-bar" aria-live="polite"><span id="note-count"></span></div>
  <div id="search-wrap">
    <svg id="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
    </svg>
    <input id="search-input" type="search" placeholder="搜索便签" autocomplete="off" enterkeyhint="search">
    <button id="search-clear" type="button" aria-label="清除搜索" title="清除">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div id="search-empty"></div>
  <div id="seg-bar" role="tablist">
    <button class="seg-item on" data-seg="all">全部</button>
    <button class="seg-item" data-seg="todo">待办</button>
    <button class="seg-item" data-seg="done">已完成</button>
  </div>
  <header id="list-header">
    <h1>便签</h1>
    <div class="hdr-actions">
      <button id="theme-btn" title="切换深浅主题" aria-label="切换深浅主题" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g id="theme-sun">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </g>
          <g id="theme-moon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </g>
        </svg>
      </button>
      <button id="sel-enter" title="选择多条便签" aria-label="选择多条便签">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="4" height="4" rx="1"/>
          <path d="M10 7h11"/>
          <rect x="3" y="15" width="4" height="4" rx="1"/>
          <path d="M10 17h11"/>
        </svg>
      </button>
      <button id="menu-btn" title="更多" aria-label="更多菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>
        </svg>
      </button>
    </div>
    <div id="sel-bar">
      <button id="sel-cancel">取消</button>
      <span id="sel-count">已选 0 条</span>
      <div id="sel-actions">
        <button id="sel-all" aria-pressed="false">全选</button>
        <button id="sel-delete">删除</button>
        <button id="sel-export">导出</button>
      </div>
    </div>
  </header>
  <div id="menu-pop">
    <button id="menu-export">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 21h16"/>
      </svg>
      <span>导出</span>
    </button>
    <button id="menu-import">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21V9m0 0l-4 4m4-4l4 4"/><path d="M4 3h16"/>
      </svg>
      <span>导入</span>
    </button>
    <button id="menu-about">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M12 11v5"/>
      </svg>
      <span>关于</span>
    </button>
    <div class="menu-sep"></div>
    <button class="menu-sort" data-sort="updated"><span class="menu-sort-check"></span><span>按修改时间</span></button>
    <button class="menu-sort" data-sort="created"><span class="menu-sort-check"></span><span>按创建时间</span></button>
    <button class="menu-sort" data-sort="title"><span class="menu-sort-check"></span><span>按标题（A-Z）</span></button>
    <button class="menu-sort" data-sort="custom"><span class="menu-sort-check"></span><span>自定义排序</span></button>
  </div>
  <div id="empty">
    <svg class="empty-icon" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="12" y="8" width="30" height="46" rx="4"/>
      <path d="M20 20h14M20 28h14M20 36h8"/>
      <path d="M44 32l9 9-13 13-10 1 1-10z"/>
    </svg>
    <p class="empty-title">还没有便签</p>
    <p class="empty-hint">点右下角 + 开始记录</p>
  </div>
  <ul id="note-list"></ul>
  <button id="add-btn" title="新建便签" aria-label="新建便签">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <div id="about-mask">
    <div id="about-card" role="dialog" aria-modal="true">
      <h2>极简备忘录 v1.4.2</h2>
      <p>如果它帮到你，可以请我喝杯咖啡</p>
      <button id="about-close">关闭</button>
    </div>
  </div>
  <!-- 分享兜底 modal：剪贴板 API 不可用时手动复制 -->
  <div id="share-mask">
    <div id="share-card" role="dialog" aria-modal="true" aria-label="复制分享内容">
      <h3>复制以下内容</h3>
      <textarea id="share-text" readonly></textarea>
      <div id="share-actions">
        <button id="share-copy">复制</button>
        <button id="share-close">关闭</button>
      </div>
    </div>
  </div>
  <input type="file" id="import-input" accept=".json,application/json" hidden>
  <!-- 主题径向扩散过渡层：JS 临时加 .on，结束后移除 -->
  <div id="theme-ripple" aria-hidden="true">
    <div class="ripple-layer"></div>
  </div>

  <!-- 新建选项 action sheet：笔记 / 待办 -->
  <div id="fab-sheet" role="dialog" aria-modal="true" aria-label="新建选项">
    <div class="sheet-card">
      <button class="sheet-opt" data-type="note">📝 新建笔记</button>
      <button class="sheet-opt" data-type="todo">✓ 新建待办</button>
      <button class="sheet-cancel">取消</button>
    </div>
  </div>
  <!-- 长按卡片操作菜单已移除：置顶/复制/删除改为左滑露出；长按负责拖拽排序 -->
</section>

<!-- 图片长按菜单（编辑页）：标记/取消重点 + 删除 -->
<div id="img-menu" role="dialog" aria-modal="true" aria-label="图片操作">
  <div class="sheet-card">
    <button class="sheet-opt" id="im-star">
      <span id="im-star-icon">⭐</span><span id="im-star-label">标记重点</span>
    </button>
    <button class="sheet-opt danger" id="im-delete">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
      <span>删除</span>
    </button>
    <button class="sheet-cancel">取消</button>
  </div>
</div>
<!-- 编辑界面 -->
<section id="editor-view" class="view">
  <div class="editor-bar">
    <div class="editor-bar-left">
      <button id="back-btn" title="返回列表" aria-label="返回列表">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>
    <div class="bar-spacer"></div>
    <div class="editor-bar-right">
      <button id="redo-btn" class="undo-redo-btn" title="重做" aria-label="重做" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v1"/>
        </svg>
      </button>
      <button id="undo-btn" class="undo-redo-btn" title="撤销" aria-label="撤销" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/>
        </svg>
      </button>
      <button id="share-btn" title="分享便签" aria-label="分享便签">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>

          <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>

          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>

      <button id="img-btn" type="button" title="从相册选图插入">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        <span>图片</span>
      </button>

    <span id="word-count">0 字</span>
    <span id="save-status">已保存</span>

  <div id="due-pop">
    <input type="datetime-local" id="due-input" aria-label="提醒时间">
    <button id="due-clear">清除</button>

  <input type="file" id="img-input" accept="image/*" multiple hidden>

<!-- 操作反馈 toast：挂在 body 直下，不随 #editor-view 显隐（列表页也可见） -->
<div id="undo-toast" role="status"></div>

<!-- 自定义删除确认框：按钮文字固定“是/否”，不受浏览器语言影响 -->

  <div class="confirm-card" role="document">
    <h3 class="confirm-title"></h3>
    <p class="confirm-msg"></p>
    <div class="confirm-btns">
      <button type="button" class="confirm-cancel"></button>
      <button type="button" class="confirm-ok"></button>

<!-- 图片全屏查看器（编辑页与列表页共用） -->
<div id="img-viewer" role="dialog" aria-modal="true" aria-label="图片查看">
  <button id="viewer-close" title="关闭" aria-label="关闭">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>

  <img id="viewer-img" alt="图片预览">

<script>
(function () {
  'use strict';

  var LEGACY_KEY = 'minimal-notes-v1'; // 旧版 localStorage 键，仅用于一次性迁移
  var DB_NAME = 'minimal-notes';
  var DB_VERSION = 3; // v3：便签增加待办字段 type/dueAt/doneAt 与预留字段
  var STORE = 'notes';
  var IMAGES = 'images';
  var MARKER_RE = /\[图片:([A-Za-z0-9]+)\]/g; // 旧版正文里的图片标记，仅用于打开时升级
  var $ = function (id) { return document.getElementById(id); };

  var listView   = $('list-view');
  var editorView = $('editor-view');
  var listEl     = $('note-list');
  var emptyEl    = $('empty');
  var countEl    = $('note-count');
  var editorEl   = $('editor');
  var stripEl    = $('image-strip');
  var saveStatus = $('save-status');
  var imgInput   = $('img-input');
  var importInput = $('import-input');
  var menuPop    = $('menu-pop');
  var headerEl   = $('list-header');
  var selCountEl = $('sel-count');
  var segBarEl   = $('seg-bar');      // 分段控件（全部/待办/已完成）
  var fabSheetEl = $('fab-sheet');    // 新建选项 action sheet
  var editorTodoHead = $('editor-todo-head'); // 编辑页待办区
  var editorTodoChk  = $('editor-todo-chk');
  var dueBtn    = $('due-btn');
  var duePopEl  = $('due-pop');
  var dueInput  = $('due-input');

  var notes = []; // 内存缓存，启动时从 IndexedDB 加载
  var currentId = null;
  var saveTimer = null;
  var statusTimer = null;
  var imgUrlCache = {}; // 图片 id → objectURL，本会话内复用
  var stripRenderToken = 0; // 防止并发渲染重复追加缩略图
  var openToken = 0; // 每次打开/离开编辑器 +1；在途异步结果回写前先校验，防笔记切换竞态
  var savedRange = null; // 点「图片」按钮前保存的编辑器选区，插入图片时恢复

  /* ---------- 待办清单状态 ---------- */
  var segFilter = 'all';            // 分段过滤：'all' | 'todo' | 'done'
  var SEG_LABELS = { all: '全部', todo: '待办', done: '已完成' };
  /* 排序方式：localStorage 持久化（ya-sort-by），置顶优先级始终最高 */
  var SORT_KEY = 'ya-sort-by';
  var SORT_VALUES = ['updated', 'created', 'title', 'custom']; /* custom：拖拽排序后写入 note.order */
  var sortBy = 'updated';
  try {
    var savedSort = localStorage.getItem(SORT_KEY);
    if (SORT_VALUES.indexOf(savedSort) !== -1) sortBy = savedSort; // 非法值回落默认
  } catch (e) { /* 隐私模式等场景 */ }
  var duePopTimer = null;           // 编辑页提醒弹层延时关闭定时器

  // 记录规范化：旧数据（无 type 字段）读取/写入时补齐默认值，不做批量重写
  function normalizeNote(n) {
    n.type = (n.type === 'todo') ? 'todo' : 'note';
    if (n.dueAt === undefined) n.dueAt = null;
    if (n.doneAt === undefined) n.doneAt = null;
    if (n.pinnedAt === undefined) n.pinnedAt = null;   // 预留
    if (n.color === undefined) n.color = null;         // 预留
    if (n.starred === undefined) n.starred = false;    // 预留
    if (n.order === undefined) n.order = null;         // 拖拽排序字段：null 时按 createdAt 兜底
    return n;
  }

  /* ---------- IndexedDB 存储层 ---------- */

  var dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          var store = db.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('updatedAt', 'updatedAt');
        }
        if (!db.objectStoreNames.contains(IMAGES)) {
          var images = db.createObjectStore(IMAGES, { keyPath: 'id' });
          images.createIndex('noteId', 'noteId');
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { dbPromise = null; reject(req.error); };
      req.onblocked = function () { dbPromise = null; reject(new Error('数据库被其他标签页占用')); };
    });
    return dbPromise;
  }

  function reqAsPromise(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGetAll() {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(STORE).objectStore(STORE).getAll());
    }).then(function (arr) {
      arr.forEach(normalizeNote); // 旧记录读取时补齐待办字段，不批量重写
      return arr;
    });
  }

  function dbGetAllImages() {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES).objectStore(IMAGES).getAll());
    });
  }

  function dbPut(note) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(STORE, 'readwrite').objectStore(STORE).put(normalizeNote(note)));
    });
  }

  function dbDelete(id) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(STORE, 'readwrite').objectStore(STORE).delete(id));
    });
  }

  /* 图片存取：Blob 直接入 IndexedDB，pos 记录在正文中的顺序 */

  function dbPutImage(rec) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES, 'readwrite').objectStore(IMAGES).put(rec));
    });
  }

  function dbGetImage(id) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES).objectStore(IMAGES).get(id));
    });
  }

  function dbDeleteImage(id) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES, 'readwrite').objectStore(IMAGES).delete(id));
    });
  }

  // 删除某便签的全部图片，resolve 被删除的图片 id 列表
  function dbDeleteImagesForNote(noteId) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var ids = [];
        var tx = db.transaction(IMAGES, 'readwrite');
        var index = tx.objectStore(IMAGES).index('noteId');
        var req = index.openCursor(IDBKeyRange.only(noteId));
        req.onsuccess = function () {
          var cursor = req.result;
          if (cursor) {
            ids.push(cursor.primaryKey);
            cursor.delete();
            cursor.continue();
          }
        };
        tx.oncomplete = function () { resolve(ids); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  // 批量删除：一个事务里同时删 notes 与其关联 images，要么全成功要么全失败
  function dbDeleteNotesWithImages(noteIds) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var idSet = {};
        noteIds.forEach(function (id) { idSet[id] = true; });
        var imgIds = [];
        var tx = db.transaction([STORE, IMAGES], 'readwrite');
        var ns = tx.objectStore(STORE);
        var is = tx.objectStore(IMAGES);
        noteIds.forEach(function (id) { ns.delete(id); });
        // 扫描 images store，按 noteId 命中即删，并记录图片 id 用于撤销 objectURL
        var req = is.openCursor();
        req.onsuccess = function () {
          var cursor = req.result;
          if (!cursor) return;
          var g = cursor.value;
          if (g && g.noteId && idSet[g.noteId]) {
            imgIds.push(cursor.primaryKey);
            cursor.delete();
          }
          cursor.continue();
        };
        tx.oncomplete = function () { resolve(imgIds); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error('事务已中止')); };
      });
    });
  }

  // 把旧版 localStorage 数据一次性迁入 IndexedDB，成功后删除旧键
  function migrateLegacy() {
    var raw = null;
    try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { /* 隐私模式等场景 */ }
    if (raw === null) return Promise.resolve();

    var list = [];
    try {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(function (n) {
          if (n && n.id) {
            list.push({
              id: String(n.id),
              content: typeof n.content === 'string' ? n.content : '',
              createdAt: Number(n.createdAt) || Date.now(),
              updatedAt: Number(n.updatedAt) || Number(n.createdAt) || Date.now()
            });
          }
        });
      }
    } catch (e) { /* 数据损坏则按空列表处理 */ }

    if (!list.length) {
      try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
      return Promise.resolve();
    }

    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        var store = tx.objectStore(STORE);
        list.forEach(function (n) { store.put(n); });
        tx.oncomplete = function () {
          try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
          resolve();
        };
        tx.onerror = function () { reject(tx.error); }; // 迁移失败保留旧数据，下次再试
      });
    });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function noteById(id) {
    for (var i = 0; i < notes.length; i++) {
      if (notes[i].id === id) return notes[i];
    }
    return null;
  }

  /* ---------- 待办工具函数 ---------- */

  function isTodo(note) { return note.type === 'todo'; }
  function isDone(note) { return note.doneAt != null; }

  // 待办卡片右上角倒计时文案（有 dueAt 且未完成才显示）
  /* ---------- 字数统计（编辑页）：中文按字、英文按词、数字按连续串 ---------- */

  var wordCountEl = $('word-count');
  var wordCountTimer = null;

  // 中文字符逐个计；英文单词 [a-zA-Z]+ 计一个；数字连续串 \d+ 计一个；空白/标签不计
  function countWords(text) {
    var m = text.match(/[\u4e00-\u9fa5]|[a-zA-Z]+|\d+/g);
    return m ? m.length : 0;
  }

  function updateWordCount() {
    if (!currentId) return;
    wordCountEl.textContent = countWords(editorEl.textContent) + ' 字';
  }

  function scheduleWordCount() {
    clearTimeout(wordCountTimer);
    wordCountTimer = setTimeout(updateWordCount, 300); // 防抖 300ms，不影响编辑性能
  }

  /* ---------- 分享便签：系统分享 → 剪贴板 → 手动复制 modal ---------- */

  var shareMaskEl = $('share-mask');
  var shareTextEl = $('share-text');

  // 分享文本：第一行标题（有才要），空一行，正文纯文本（img→[图片]，<br>/块级边界→换行，其余标签去掉）
  function buildShareText(note) {
    var body = String(note.content || '')
      .replace(/<img[^>]*>/gi, '[图片]')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/\s*(div|p|li|h[1-6]|blockquote)\s*>/gi, '\n');
    var d = document.createElement('div');
    d.innerHTML = body; // 剩余标签剥掉 + 实体解码，与 htmlToPlain 同思路
    var plain = (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
    var title = titleOf(note);
    var noTitle = title === '无标题';
    if (!plain && noTitle) return '';
    if (noTitle) return plain;
    return title + '\n\n' + plain;
  }

  function hideShareMask() { shareMaskEl.classList.remove('open'); }

  // 方式 3 兜底：只读 textarea 自动全选，用户手动复制
  function openShareFallback(text) {
    shareTextEl.value = text;
    shareMaskEl.classList.add('open');
    setTimeout(function () { shareTextEl.focus(); shareTextEl.select(); }, 50);
  }

  function doShare() {
    var note = noteById(currentId);
    if (!note) return;
    var text = buildShareText(note);
    if (!text) { showUndoToast('没有内容可分享'); return; }
    var title = titleOf(note);
    // 方式 2：剪贴板 API；再失败进入方式 3 modal
    var fallbackCopy = function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showUndoToast('已复制到剪贴板');
        }, function () { openShareFallback(text); });
      } else {
        openShareFallback(text);
      }
    };
    // 方式 1：系统分享；用户取消（AbortError）静默不报错
    if (navigator.share) {
      navigator.share({ title: title, text: text }).then(function () {
        showUndoToast('已分享');
      }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
  }

  $('share-btn').addEventListener('click', doShare);
  $('share-copy').addEventListener('click', function () {
    shareTextEl.focus();
    shareTextEl.select(); // 保证有选中态再 copy
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (ok) { hideShareMask(); showUndoToast('已复制到剪贴板'); }
    else showUndoToast('复制失败');
  });
  $('share-close').addEventListener('click', hideShareMask);
  shareMaskEl.addEventListener('click', function (e) {
    if (e.target === shareMaskEl) hideShareMask();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && shareMaskEl.classList.contains('open')) hideShareMask();
  });

  // ⋮ 菜单排序分组：勾选标记 + 立即重渲染
  function updateSortMenu() {
    var btns = menuPop.querySelectorAll('.menu-sort');
    for (var i = 0; i < btns.length; i++) {
      btns[i].querySelector('.menu-sort-check').textContent =
        btns[i].dataset.sort === sortBy ? '✓' : '';
    }
  }

  menuPop.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.menu-sort') : null;
    if (!btn) return;
    var v = btn.dataset.sort;
    if (SORT_VALUES.indexOf(v) === -1 || v === sortBy) return;
    sortBy = v;
    try { localStorage.setItem(SORT_KEY, sortBy); } catch (err) { /* 隐私模式等场景 */ }
    updateSortMenu();
    renderList(); // 切换排序立即重新渲染列表
  });

  function dueText(note) {
    if (!note.dueAt) return '';
    var diff = note.dueAt - Date.now();
    if (diff <= 0) return '已过期';
    var oneMin = 60 * 1000, oneHour = 60 * oneMin, oneDay = 24 * oneHour;
    var d = new Date(note.dueAt);
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (diff < oneMin) return '1 分钟内';
    if (diff < oneHour) return Math.floor(diff / oneMin) + ' 分钟后';
    if (diff < oneDay) {
      var h = Math.floor(diff / oneHour);
      if (h < 6) return h + ' 小时后';
      return '今天 ' + hm;
    }
    var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    if (d.toDateString() === tomorrow.toDateString()) return '明天 ' + hm;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  }

  // 切换待办完成状态（列表复选框与编辑页复选框共用）
  function toggleTodoDone(id) {
    var note = noteById(id);
    if (!note || !isTodo(note)) return;
    note.doneAt = isDone(note) ? null : Date.now();
    note.updatedAt = Date.now();
    dbPut(note).catch(function () { /* 存储失败静默 */ });
    renderList();
    if (currentId === id) syncEditorTodoUI();
  }

  /* ---------- 富文本与纯文本工具 ---------- */

  // HTML → 纯文本：块级元素边界与 <br> 转成换行，img 标签整个去掉
  function htmlToPlain(html) {
    var s = String(html || '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/\s*(div|p|li|h[1-6]|blockquote)\s*>/gi, '\n');
    var d = document.createElement('div');
    d.innerHTML = s;
    return d.textContent || '';
  }

  // 摘要用：整个去掉 img 标签，只保留纯文本
  function plainTextOf(html) {
    return htmlToPlain(html);
  }

  // 去掉图片后是否没有正文（纯图片便签不算空，不能被自动清理）
  function isNoteEmpty(note) {
    var d = document.createElement('div');
    d.innerHTML = note.content || '';
    var imgs = d.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) imgs[i].remove();
    return !d.textContent.trim();
  }

  // 标题 = 正文第一个非空行
  function firstLine(plain) {
    var lines = (plain || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (t) return t;
    }
    return '';
  }

  function titleOf(note) {
    return firstLine(plainTextOf(note.content)) || '无标题';
  }

  // 摘要 = 标题行之后的所有正文（展开可看全文；不超过 2 行时无展开按钮）
  function excerptOf(note) {
    var seen = 0;
    var lines = plainTextOf(note.content).split('\n');
    var rest = [];
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (!t) { if (seen) rest.push(''); continue; } // 保留标题下方的空行
      seen++;
      if (seen > 1) rest.push(t);
    }
    var out = rest.join('\n').replace(/^\n+|\n+$/g, '');
    return out || '没有更多内容';
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // datetime-local 值 ↔ 时间戳互转（均为本地时区）
  function toLocalInputValue(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocalInputValue(v) {
    var ts = new Date(v).getTime();
    return isNaN(ts) ? null : ts;
  }

      scheduleDragMove(g); // rAF 节流：不每个 touchmove 都重排
