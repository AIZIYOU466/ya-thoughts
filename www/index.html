<script>
(function () {
  'use strict';

  var LEGACY_KEY = 'minimal-notes-v1'; // 旧版 localStorage 键，仅用于一次性迁移
  var DB_NAME = 'minimal-notes';
  var DB_VERSION = 3; // v3：便签增加待办字段 type/dueAt/doneAt 与预留字段
  var STORE = 'notes';
  var IMAGES = 'images';
  var MARKER_RE = /\[图片:([A-Za-z0-9]+)\]/g; // 旧版正文里的图片标记，仅用于打开时升级
  var $ = function (id) { return document.getElementById(id); };

  var listView   = $('list-view');
  var editorView = $('editor-view');
  var listEl     = $('note-list');
  var emptyEl    = $('empty');
  var countEl    = $('note-count');
  var editorEl   = $('editor');
  var stripEl    = $('image-strip');
  var saveStatus = $('save-status');
  var imgInput   = $('img-input');
  var importInput = $('import-input');
  var menuPop    = $('menu-pop');
  var headerEl   = $('list-header');
  var selCountEl = $('sel-count');
  var segBarEl   = $('seg-bar');      // 分段控件（全部/待办/已完成）
  var editorTodoHead = $('editor-todo-head'); // 编辑页待办区
  var editorTodoChk  = $('editor-todo-chk');
  var dueBtn    = $('due-btn');
  var duePopEl  = $('due-pop');
  var dueInput  = $('due-input');

  var notes = []; // 内存缓存，启动时从 IndexedDB 加载
  var currentId = null;
  var saveTimer = null;
  var pendingSaveId = null; // backToList 捕获的离开便签：currentId 置 null 后写库仍可定位
  var statusTimer = null;
  var imgUrlCache = {}; // 图片 id → objectURL，本会话内复用
  var stripRenderToken = 0; // 防止并发渲染重复追加缩略图
  var openToken = 0; // 每次打开/离开编辑器 +1；在途异步结果回写前先校验，防笔记切换竞态
  var savedRange = null; // 点「图片」按钮前保存的编辑器选区，插入图片时恢复

  /* ---------- 待办清单状态 ---------- */
  var segFilter = 'all';            // 分段过滤：'all' | 'todo' | 'done'
  var SEG_LABELS = { all: '全部', todo: '待办', done: '已完成' };
  /* 排序方式：localStorage 持久化（ya-sort-by），置顶优先级始终最高 */
  var SORT_KEY = 'ya-sort-by';
  var SORT_VALUES = ['updated', 'created', 'title', 'custom']; /* custom：拖拽排序后写入 note.order */
  var sortBy = 'updated';
  try {
    var savedSort = localStorage.getItem(SORT_KEY);
    if (SORT_VALUES.indexOf(savedSort) !== -1) sortBy = savedSort; // 非法值回落默认
  } catch (e) { /* 隐私模式等场景 */ }
  var duePopTimer = null;           // 编辑页提醒弹层延时关闭定时器

  // 记录规范化：旧数据（无 type 字段）读取/写入时补齐默认值，不做批量重写
  function normalizeNote(n) {
    n.type = (n.type === 'todo') ? 'todo' : 'note';
    if (n.dueAt === undefined) n.dueAt = null;
    if (n.doneAt === undefined) n.doneAt = null;
    if (n.pinnedAt === undefined) n.pinnedAt = null;   // 预留
    if (n.color === undefined) n.color = null;         // 预留
    if (n.starred === undefined) n.starred = false;    // 预留
    if (n.deletedAt === undefined) n.deletedAt = null;    // 回收箱：null = 未删除
    if (n.deletedFrom === undefined) n.deletedFrom = null; // 回收箱：'manual' 手动 | 'auto' 自动清理
    if (n.order === undefined) n.order = null;         // 拖拽排序字段：null 时按 createdAt 兜底
    return n;
  }

  /* ---------- IndexedDB 存储层 ---------- */

  var dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          var store = db.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('updatedAt', 'updatedAt');
        }
        if (!db.objectStoreNames.contains(IMAGES)) {
          var images = db.createObjectStore(IMAGES, { keyPath: 'id' });
          images.createIndex('noteId', 'noteId');
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { dbPromise = null; reject(req.error); };
      req.onblocked = function () { dbPromise = null; reject(new Error('数据库被其他标签页占用')); };
    });
    return dbPromise;
  }

  function reqAsPromise(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbGetAll() {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(STORE).objectStore(STORE).getAll());
    }).then(function (arr) {
      arr.forEach(normalizeNote); // 旧记录读取时补齐待办字段，不批量重写
      return arr;
    });
  }

  function dbGetAllImages() {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES).objectStore(IMAGES).getAll());
    });
  }

  function dbPut(note) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(STORE, 'readwrite').objectStore(STORE).put(normalizeNote(note)));
    });
  }

  /* 图片存取：Blob 直接入 IndexedDB，pos 记录在正文中的顺序 */

  function dbPutImage(rec) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES, 'readwrite').objectStore(IMAGES).put(rec));
    });
  }

  function dbGetImage(id) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES).objectStore(IMAGES).get(id));
    });
  }

  function dbDeleteImage(id) {
    return openDB().then(function (db) {
      return reqAsPromise(db.transaction(IMAGES, 'readwrite').objectStore(IMAGES).delete(id));
    });
  }

  // 批量删除：一个事务里同时删 notes 与其关联 images，要么全成功要么全失败
  function dbDeleteNotesWithImages(noteIds) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var idSet = {};
        noteIds.forEach(function (id) { idSet[id] = true; });
        var imgIds = [];
        var tx = db.transaction([STORE, IMAGES], 'readwrite');
        var ns = tx.objectStore(STORE);
        var is = tx.objectStore(IMAGES);
        noteIds.forEach(function (id) { ns.delete(id); });
        // 扫描 images store，按 noteId 命中即删，并记录图片 id 用于撤销 objectURL
        var req = is.openCursor();
        req.onsuccess = function () {
          var cursor = req.result;
          if (!cursor) return;
          var g = cursor.value;
          if (g && g.noteId && idSet[g.noteId]) {
            imgIds.push(cursor.primaryKey);
            cursor.delete();
          }
          cursor.continue();
        };
        tx.oncomplete = function () { resolve(imgIds); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error('事务已中止')); };
      });
    });
  }

  // 把旧版 localStorage 数据一次性迁入 IndexedDB，成功后删除旧键
  function migrateLegacy() {
    var raw = null;
    try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { /* 隐私模式等场景 */ }
    if (raw === null) return Promise.resolve();

    var list = [];
    try {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(function (n) {
          if (n && n.id) {
            list.push({
              id: String(n.id),
              content: typeof n.content === 'string' ? n.content : '',
              createdAt: Number(n.createdAt) || Date.now(),
              updatedAt: Number(n.updatedAt) || Number(n.createdAt) || Date.now()
            });
          }
        });
      }
    } catch (e) { /* 数据损坏则按空列表处理 */ }

    if (!list.length) {
      try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
      return Promise.resolve();
    }

    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        var store = tx.objectStore(STORE);
        list.forEach(function (n) { store.put(n); });
        tx.oncomplete = function () {
          try { localStorage.removeItem(LEGACY_KEY); } catch (e) {}
          resolve();
        };
        tx.onerror = function () { reject(tx.error); }; // 迁移失败保留旧数据，下次再试
      });
    });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // 查便签：回收箱里的已删除便签视为不存在（任何入口都打不开/改不了）；
  // 回收箱视图直接用 notes 过滤，不依赖本函数。
  function noteById(id) {
    for (var i = 0; i < notes.length; i++) {
      if (notes[i].id === id && notes[i].deletedAt == null) return notes[i];
    }
    return null;
  }

  // 软删除：只打 deletedAt/deletedFrom 标记进回收箱（保留 3 天，之后物理删除），
  // 并立即取消其待办系统通知；图片 Blob 待到回收箱超期清理时才真正删除。
  function markNoteDeleted(id, from) {
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      if (n.id === id) {
        n.deletedAt = Date.now();
        n.deletedFrom = from;
        dbPut(n).catch(function () { /* 存储失败静默 */ });
        break;
      }
    }
    cancelNoteNotification(id);
  }

  /* ---------- 待办工具函数 ---------- */

  function isTodo(note) { return note.type === 'todo'; }
  function isDone(note) { return note.doneAt != null; }

  function isBinNote(n) { return !!(n && n.deletedAt != null); }

  // 回收箱条目：按删除时间倒序（最近删除的在前）
  function binNotes() {
    return notes.filter(isBinNote).sort(function (a, b) { return b.deletedAt - a.deletedAt; });
  }

  // 已过期：doneAt 为空 且已到截止时间（dueAt < now）；已完成优先，过期不回退
  function isOverdue(note) {
    return isTodo(note) && !isDone(note) && note.dueAt != null && note.dueAt < Date.now();
  }

  // 待办卡片右上角倒计时文案（有 dueAt 且未完成才显示）
  /* ---------- 字数统计（编辑页）：中文按字、英文按词、数字按连续串 ---------- */

  var wordCountEl = $('word-count');
  var wordCountTimer = null;

  // 中文字符逐个计；英文单词 [a-zA-Z]+ 计一个；数字连续串 \d+ 计一个；空白/标签不计
  function countWords(text) {
    var m = text.match(/[\u4e00-\u9fa5]|[a-zA-Z]+|\d+/g);
    return m ? m.length : 0;
  }

  function updateWordCount() {
    if (!currentId) return;
    wordCountEl.textContent = countWords(editorEl.textContent) + ' 字';
  }

  function scheduleWordCount() {
    clearTimeout(wordCountTimer);
    wordCountTimer = setTimeout(updateWordCount, 300); // 防抖 300ms，不影响编辑性能
  }

  /* ---------- 分享便签：系统分享 → 剪贴板 → 手动复制 modal ---------- */

  var shareMaskEl = $('share-mask');
  var shareTextEl = $('share-text');

  // 分享文本：第一行标题（有才要），空一行，正文纯文本（img→[图片]，<br>/块级边界→换行，其余标签去掉）
  function buildShareText(note) {
    var body = String(note.content || '')
      .replace(/<img[^>]*>/gi, '[图片]')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/\s*(div|p|li|h[1-6]|blockquote)\s*>/gi, '\n');
    var d = document.createElement('div');
    d.innerHTML = body; // 剩余标签剥掉 + 实体解码，与 htmlToPlain 同思路
    var plain = (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
    var title = titleOf(note);
    var noTitle = title === '无标题';
    if (!plain && noTitle) return '';
    if (noTitle) return plain;
    return title + '\n\n' + plain;
  }

  function hideShareMask() { shareMaskEl.classList.remove('open'); }

  // 方式 3 兜底：只读 textarea 自动全选，用户手动复制
  function openShareFallback(text) {
    shareTextEl.value = text;
    shareMaskEl.classList.add('open');
    setTimeout(function () { shareTextEl.focus(); shareTextEl.select(); }, 50);
  }

  function doShare() {
    var note = noteById(currentId);
    if (!note) return;
    var text = buildShareText(note);
    if (!text) { showUndoToast('没有内容可分享'); return; }
    var title = titleOf(note);
    // 方式 2：剪贴板 API；再失败进入方式 3 modal
    var fallbackCopy = function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showUndoToast('已复制到剪贴板');
        }, function () { openShareFallback(text); });
      } else {
        openShareFallback(text);
      }
    };
    // 方式 1：系统分享；用户取消（AbortError）静默不报错
    if (navigator.share) {
      navigator.share({ title: title, text: text }).then(function () {
        showUndoToast('已分享');
      }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
  }

  $('share-btn').addEventListener('click', doShare);
  $('share-copy').addEventListener('click', function () {
    shareTextEl.focus();
    shareTextEl.select(); // 保证有选中态再 copy
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (ok) { hideShareMask(); showUndoToast('已复制到剪贴板'); }
    else showUndoToast('复制失败');
  });
  $('share-close').addEventListener('click', hideShareMask);
  shareMaskEl.addEventListener('click', function (e) {
    if (e.target === shareMaskEl) hideShareMask();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && shareMaskEl.classList.contains('open')) hideShareMask();
  });

  // ⋮ 菜单排序分组：勾选标记 + 立即重渲染
  function updateSortMenu() {
    var btns = menuPop.querySelectorAll('.menu-sort');
    for (var i = 0; i < btns.length; i++) {
      btns[i].querySelector('.menu-sort-check').textContent =
        btns[i].dataset.sort === sortBy ? '✓' : '';
    }
  }

  menuPop.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.menu-sort') : null;
    if (!btn) return;
    var v = btn.dataset.sort;
    if (SORT_VALUES.indexOf(v) === -1 || v === sortBy) return;
    sortBy = v;
    try { localStorage.setItem(SORT_KEY, sortBy); } catch (err) { /* 隐私模式等场景 */ }
    updateSortMenu();
    renderList(); // 切换排序立即重新渲染列表
  });

  function dueText(note) {
    if (!note.dueAt) return '';
    var diff = note.dueAt - Date.now();
    if (diff <= 0) return '已过期';
    var oneMin = 60 * 1000, oneHour = 60 * oneMin, oneDay = 24 * oneHour;
    var d = new Date(note.dueAt);
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (diff < oneMin) return '1 分钟内';
    if (diff < oneHour) return Math.floor(diff / oneMin) + ' 分钟后';
    if (diff < oneDay) {
      var h = Math.floor(diff / oneHour);
      if (h < 6) return h + ' 小时后';
      return '今天 ' + hm;
    }
    var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    if (d.toDateString() === tomorrow.toDateString()) return '明天 ' + hm;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  }

  // 切换待办完成状态（列表复选框与编辑页复选框共用）
  function toggleTodoDone(id) {
    var note = noteById(id);
    if (!note || !isTodo(note)) return;
    note.doneAt = isDone(note) ? null : Date.now();
    note.updatedAt = Date.now();
    dbPut(note).catch(function () { /* 存储失败静默 */ });
    scheduleNoteNotification(note); // 完成 → 自动取消通知；取消完成 → 重新调度
    renderList();
    if (currentId === id) syncEditorTodoUI();
  }

  /* ---------- 富文本与纯文本工具 ---------- */

  // HTML → 纯文本：块级元素边界与 <br> 转成换行，img 标签整个去掉
  function htmlToPlain(html) {
    var s = String(html || '')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/\s*(div|p|li|h[1-6]|blockquote)\s*>/gi, '\n');
    var d = document.createElement('div');
    d.innerHTML = s;
    return d.textContent || '';
  }

  // 摘要用：整个去掉 img 标签，只保留纯文本
  function plainTextOf(html) {
    return htmlToPlain(html);
  }

  // 标题 = 正文第一个非空行
  function firstLine(plain) {
    var lines = (plain || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (t) return t;
    }
    return '';
  }

  function titleOf(note) {
    return firstLine(plainTextOf(note.content)) || '无标题';
  }

  // 摘要 = 标题行之后的所有正文（展开可看全文；不超过 2 行时无展开按钮）
  function excerptOf(note) {
    var seen = 0;
    var lines = plainTextOf(note.content).split('\n');
    var rest = [];
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (!t) { if (seen) rest.push(''); continue; } // 保留标题下方的空行
      seen++;
      if (seen > 1) rest.push(t);
    }
    var out = rest.join('\n').replace(/^\n+|\n+$/g, '');
    return out || '没有更多内容';
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // datetime-local 值 ↔ 时间戳互转（均为本地时区）
  function toLocalInputValue(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocalInputValue(v) {
    var ts = new Date(v).getTime();
    return isNaN(ts) ? null : ts;
  }

  // 相对时间（任务5）：刚刚 / X 分钟前 / X 小时前 / X 天前 / X 周前 / X 个月前 / X 年前
  function relativeTime(ts) {
    var diff = Date.now() - ts;
    var oneMin = 60 * 1000;
    var oneHour = 60 * oneMin;
    var oneDay = 24 * oneHour;
    if (diff < oneMin) return '刚刚';
    if (diff < oneHour) return Math.floor(diff / oneMin) + ' 分钟前';
    if (diff < oneDay) return Math.floor(diff / oneHour) + ' 小时前';
    if (diff < 7 * oneDay) return Math.floor(diff / oneDay) + ' 天前';
    if (diff < 30 * oneDay) return Math.floor(diff / (7 * oneDay)) + ' 周前';
    if (diff < 365 * oneDay) return Math.floor(diff / (30 * oneDay)) + ' 个月前';
    return Math.floor(diff / (365 * oneDay)) + ' 年前';
  }

  // 卡片时间区（任务5）：右下角两行「创建于 X / 编辑于 Y」。
  // 容错：createdAt 缺失用 updatedAt 兜底；updatedAt < createdAt 时以 createdAt 为准（无负数）。
  function renderNoteTime(el, note) {
    var created = Number(note.createdAt) || Number(note.updatedAt) || Date.now();
    var updated = Number(note.updatedAt) || created;
    if (updated < created) updated = created; // 用户改过系统时钟，避免显示负数
    el.textContent = '';
    var line1 = document.createElement('span');
    line1.textContent = '创建于 ' + relativeTime(created);
    el.appendChild(line1);
    if (updated - created >= 60 * 1000) { // 刚创建未编辑（<1 分钟）只显示一行
      var line2 = document.createElement('span');
      line2.textContent = '编辑于 ' + relativeTime(updated);
      el.appendChild(line2);
    }

  /* ---------- 列表渲染 ---------- */

  /* 多选模式状态 */
  var multiMode = false;
  var selectedIds = {};
  var listPressFired = false; // 摘要/待办按钮点击守卫（左滑与拖拽不再置位它，click 抑制走 gestureSuppressClick）

     点击切换 .expanded 类直接展示全文（无高度动画，最直接可靠）。
     展开状态按 note.id 记在内存里（不进存储，刷新即收起），
     renderList 重建卡片后自动恢复展开态。 */
  var expandedSummaries = {}; // id → true

  function prefersReducedMotion() {

  }

  // 摘要是否超过 2 行：临时加 .summary-measure（-webkit-line-clamp: unset）量出自然高，
  // 与「行高 × 2」比较；量完立即移除测量类（不产生闪烁）。
  // 关键：不能在“带 2 行钳制”的状态下读 scrollHeight —— 部分 WebView 会返回钳制后的
  // 高度，导致永远测不出溢出 → 按钮不出现。解除钳制后元素自身就是全文高度，
  // clientHeight / scrollHeight 均为真实自然高。
  function summaryOverflows(summary) {
    summary.classList.add('summary-measure');
    var natural = summary.scrollHeight;
    var cs = getComputedStyle(summary);
    var lineH = parseFloat(cs.lineHeight);
    summary.classList.remove('summary-measure');
    if (!lineH) lineH = Math.ceil(parseFloat(cs.fontSize) * 1.5) || 21;
    return natural > Math.ceil(lineH * 2) + 2;
  }

  // 点击：仅切换摘要容器 .expanded 并旋转箭头 180°；click 且 stopPropagation，
  // 不触发卡片打开/多选/手势，整块摘要区不绑任何点击事件。
  function buildSummaryToggle(id, summary) {
    var wasOpen = !!expandedSummaries[id];
    if (wasOpen) summary.classList.add('expanded');
    if (!summaryOverflows(summary)) return null; // ≤2 行：无展开按钮

    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'summary-toggle' + (wasOpen ? ' open' : '');
    b.setAttribute('aria-label', wasOpen ? '收起摘要' : '展开摘要');
    b.setAttribute('aria-expanded', wasOpen ? 'true' : 'false');
    b.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  /* 搜索状态 */
  var searchWrapEl  = $('search-wrap');
  var searchInput   = $('search-input');
  var searchClearEl = $('search-clear');
  var searchEmptyEl = $('search-empty');

  var searchDebounceTimer = null;    // 输入防抖 200ms

  var searchTextIdxStamp = 0;        // 索引构建时的便签数量与最大 updatedAt，用于失效判断

  function updateSelAllBtn() {

  // 把当前便签缓存转成小写纯文本索引；<100 条直接遍历，不建索引（避免过度优化）
  function buildSearchIndex() {
    var idx = {};
    var maxUpdated = 0;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      idx[n.id] = {
        t: titleOf(n).toLowerCase(),
        b: plainTextOf(n.content).toLowerCase()
      };
      if (n.updatedAt > maxUpdated) maxUpdated = n.updatedAt;
    }
    searchTextIdxStamp = notes.length * 1e13 + maxUpdated; // 条数+最新更新时间拼成失效戳
    searchTextIndex = idx;
    return idx;
  }

  // note -> 小写纯文本（优先取索引，未命中或索引失效则现算）
  function searchableTextOf(note) {
    if (notes.length >= 100) {
      if (!searchTextIndex || searchTextIdxStamp !== notes.length * 1e13 + maxUpdatedAtOf()) buildSearchIndex();
      var hit = searchTextIndex[note.id];
      if (hit) return hit.t + '\n' + hit.b;

    searchTextIndex = null; // <100 条不维护索引
    return (titleOf(note) + '\n' + plainTextOf(note.content)).toLowerCase();
  }

  function maxUpdatedAtOf() {
    var m = 0;
    for (var i = 0; i < notes.length; i++) if (notes[i].updatedAt > m) m = notes[i].updatedAt;
    return m;
  }

  function matchesSearch(note) {
    if (!searchQuery) return true;

  }

  // 输入防抖 200ms 后统一走 renderList，只重渲染列表
  function onSearchInput() {

    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(function () {
      var q = searchInput.value.trim().toLowerCase();

  function clearSearch() {

  searchClearEl.addEventListener('click', clearSearch);

  // 关键词高亮：纯文本先 HTML 转义再包 <mark>，天然防注入；大小写不敏感
  function highlightText(text, q) {
    var esc = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    if (!q) return esc;
    var qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return esc.replace(new RegExp(qEsc, 'gi'), '<mark>$&</mark>');

  function enterMultiMode(firstId) {
    stopMomentum(); // 进多选模式：停掉惯性
    multiMode = true;
    selectedIds = {};
    if (firstId) selectedIds[firstId] = true; // 被长按的那条自动选中
    renderList();
  }

  function exitMultiMode() {
    multiMode = false;
    selectedIds = {};
    renderList();
  }

  function toggleSelect(id) {
    if (selectedIds[id]) delete selectedIds[id];
    else selectedIds[id] = true;
    renderList(); // 重建列表刷新选中态
  }

  // 列表点击用事件委托：容器上只绑一次，点击时按 dataset.id 取当前渲染的 id，

    if (!li || !listEl.contains(li)) return;
    var id = li.dataset.id;
    if (!id) return;
    if (t.closest('.todo-chk')) return; // 复选框有自己的处理，已 stopPropagation 兜底
    if (t.closest('#sel-enter') || t.closest('#menu-btn')) return; // 顶栏按钮不在列表容器内，兜底防误开

  // 列表排序（含分段过滤）：
  // 全部：置顶 → 进行中待办（dueAt 升序/updatedAt 倒序）→ 已过期待办（dueAt 升序）→ 普通笔记 → 已完成待办（doneAt 倒序沉底）

  /* ---------- 置顶 ---------- */

  function isPinned(n) { return !!(n && n.pinnedAt); }

  function togglePin(id) {

    if (!note) return;

    for (var i = 0; i < sorted.length; i++) if (isPinned(sorted[i])) last = i;

  function compareNotesBySort(a, b) {

    if (sortBy === 'title') {

      return t !== 0 ? t : b.updatedAt - a.updatedAt; // 标题相同按更新时间兜底，保证顺序稳定

  /* ---------- 左滑操作菜单 + 拖拽排序（手势层，纯 Touch Events 重写版） ----------

      all[i].classList.remove('drag-shift', 'drag-anim');
      all[i].style.transform = '';
    }
    // 松手立即写入 IndexedDB 的 order；若原本是时间排序，自动切到自定义排序
    if (moved) saveCustomOrder(noteItemsInDom());
    if (moved && (sortBy === 'updated' || sortBy === 'created')) {
      sortBy = 'custom';
      try { localStorage.setItem(SORT_KEY, sortBy); } catch (err) {}
      updateSortMenu();
      renderList();
    }
  }

  // 拖拽结果落库：非置顶便签按可见顺序写 order（0..n）；被过滤隐藏的追加到末尾
  //（保持相对顺序）；置顶仍按 pinnedAt 排，不参与 order
  function saveCustomOrder(domItems) {
    var seen = {};
    var seq = [];
    for (var i = 0; i < domItems.length; i++) {
      var id = domItems[i].dataset.id;
      if (id) seen[id] = true;
      var n = id ? noteById(id) : null;
      if (n && !isPinned(n)) seq.push(n);
    }
    var hidden = notes.filter(function (x) { return !isPinned(x) && !seen[x.id]; })
      .sort(function (a, b) {
        var oa = (a.order == null ? a.createdAt : a.order);
        var ob = (b.order == null ? b.createdAt : b.order);
        return oa - ob || a.createdAt - b.createdAt;
      });
    var all = seq.concat(hidden);
    var jobs = [];
    for (i = 0; i < all.length; i++) { all[i].order = i; jobs.push(dbPut(all[i])); }
    Promise.all(jobs).catch(function () { /* 存储失败静默 */ });
  }

  // 左滑按钮动作：置顶 / 复制 / 删除（点击后直接执行，不先弹回卡片）
  function runSwipeAction(act, id) {
    if (!act || !id) return;
    if (act === 'pin') {
      var wasPinned = isPinned(noteById(id));
      pinWithFlip(id); // 立即切换 pinnedAt，卡片带过渡移到新位置
      showUndoToast(wasPinned ? '已取消置顶' : '已置顶');
    } else if (act === 'copy') {
      copyNoteText(id); // 立即复制，成功/失败自带 toast
    } else if (act === 'delete') {
      deleteSingleNote(id); // 先弹自定义确认框，确认后立即走曲线删除动画
    }
  }

  // 置顶/取消置顶的位移过渡（FLIP）：先记录所有卡片旧位置 → togglePin 触发重渲染
  // → 再把每张卡片从旧位置用 transform 过渡到新位置，避免“瞬间跳位”。
  // renderList 会重建 DOM，因此按 id 匹配新旧节点；减少动态效果时直接切换。
  function pinWithFlip(id) {
    if (prefersReducedMotion()) { togglePin(id); return; }
    var before = {};
    var oldItems = noteItemsInDom();
    for (var i = 0; i < oldItems.length; i++) {
      var oid = oldItems[i].dataset.id;
      if (oid) before[oid] = oldItems[i].getBoundingClientRect();
    }
    togglePin(id); // 内部 renderList() 重建列表
    var newItems = noteItemsInDom();
    var moving = [];
    for (i = 0; i < newItems.length; i++) {
      var el = newItems[i];
      var old = before[el.dataset.id];
      if (!old) continue;
      var dy = old.top - el.getBoundingClientRect().top;
      if (Math.abs(dy) < 1) continue;
      el.style.transition = 'none';
      el.style.transform = 'translate3d(0,' + dy + 'px,0)';
      moving.push(el);
    }
    if (!moving.length) return;
    void listEl.offsetHeight; // 提交起点帧
    for (i = 0; i < moving.length; i++) {
      moving[i].style.transition = 'transform 0.28s var(--ease-swift)';
      moving[i].style.transform = '';
    }
    setTimeout(function () {
      for (var k = 0; k < moving.length; k++) {
        if (moving[k].isConnected) { moving[k].style.transition = ''; moving[k].style.transform = ''; }
      }
    }, 320);
  }

  // 构建一枚左滑操作按钮。单一事件路径：只绑一个 click，点击后立即执行动作，
  // “关闭展开态 + 执行动作”同步完成，无两段式延迟；不绑任何 touch/pointer 事件，
  // 由 .swipe-actions 容器不挂监听 + 卡片 touchstart 首行排除 .swipe-actions
  // 双重保证：按钮上的触摸永不触发卡片手势，click 必定生效。
  function makeSwipeBtn(act, svg, label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'swipe-btn' + (act === 'delete' ? ' danger' : '');
    b.dataset.act = act;
    b.setAttribute('aria-label', label);
    b.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + svg + '</svg><span>' + label + '</span>';
    b.addEventListener('click', function (e) {
      e.stopPropagation(); // 不触发卡片打开/多选
      var li = b.closest('.note-item');
      if (!li) return;
      var id = li.dataset.id;
      if (!id) return;
      closeOpenSwipe(); // 关闭展开态 + 执行动作同步完成，无“先弹回、后执行”两段式
      runSwipeAction(act, id); // 立即执行；置顶重渲染、删除走曲线动画
    });
    return b;
  }

  // 空白处点按：收拢展开的卡片（Touch Events 版，监听卡片手势同款事件）
  document.addEventListener('touchstart', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('.note-item')) return;
    closeOpenSwipe();
  }, { passive: true });

  function renderList() {
    stopMomentum(); // 列表重渲染（分段/搜索/数据变化）：停掉惯性，避免滑到新内容上
    var sorted = sortedNotesFor(segFilter).filter(matchesSearch); // 分段与搜索"与"关系

    listEl.innerHTML = '';

    var hasNotes = sorted.length > 0;
    var emptyTitleEl = emptyEl.querySelector('.empty-title');
    var emptyHintEl = emptyEl.querySelector('.empty-hint');
    emptyEl.style.display = hasNotes ? 'none' : 'flex';
    if (emptyTitleEl && emptyHintEl) {
      if (segFilter === 'todo') {
        emptyTitleEl.textContent = '没有待办事项';
        emptyHintEl.textContent = '点下方「待办」新建一个';
      } else if (segFilter === 'done') {
        emptyTitleEl.textContent = '还没有完成的待办';
        emptyHintEl.textContent = '去「待办」里完成一个试试';
      } else {
        emptyTitleEl.textContent = '还没有便签';
        emptyHintEl.textContent = '点下方「笔记」或「待办」开始记录';
      }
    }
    countEl.textContent = hasNotes ? sorted.length + ' 条' : '';
    // 搜索无结果提示；普通空状态照旧
    if (searchQuery && !hasNotes) {
      searchEmptyEl.textContent = '没有找到含“' + searchInput.value.trim() + '”的便签';
      searchEmptyEl.style.display = 'block';
    } else {
      searchEmptyEl.style.display = 'none';
    }
    listView.classList.toggle('multi', multiMode);
    headerEl.classList.toggle('selecting', multiMode);
    if (multiMode) updateSelCount();
    if (multiMode) updateSelAllBtn();
    var lastPin = lastPinnedIndex(sorted); // 置顶区末尾下标，用于插分割线

    sorted.forEach(function (note, noteIdx) {
      var li = document.createElement('li');
      li.className = 'note-item';
      if (isTodo(note)) li.classList.add('is-todo');
      if (isTodo(note) && isDone(note)) li.classList.add('is-done');

      // 左滑操作区（置顶/复制/删除）+ 卡片本体集合：本体盖在按钮之上并随左滑位移
      var actions = document.createElement('div');
      actions.className = 'swipe-actions';
      actions.appendChild(makeSwipeBtn('pin', SWIPE_PIN_SVG, '置顶'));
      actions.appendChild(makeSwipeBtn('copy', SWIPE_COPY_SVG, '复制'));
      actions.appendChild(makeSwipeBtn('delete', SWIPE_DEL_SVG, '删除'));
      var face = document.createElement('div');
      face.className = 'swipe-body';

      var box = document.createElement('div');
      box.className = 'sel-box' + (selectedIds[note.id] ? ' on' : '');
      box.textContent = '✓';

      // 待办：卡片左侧圆形复选框，点击直接切换完成状态（不进编辑页）
      if (isTodo(note)) {
        var chk = document.createElement('div');
        chk.className = 'todo-chk' + (isDone(note) ? ' on' : (isOverdue(note) ? ' overdue' : ''));
        chk.textContent = '✓';
        chk.addEventListener('click', function (e) {
          e.stopPropagation(); // 不触发卡片打开/多选
          if (listPressFired) { listPressFired = false; return; }
          toggleTodoDone(note.id);
        });
        face.appendChild(chk);
      }

      var body = document.createElement('div');
      body.className = 'note-body';

      var title = document.createElement('div');
      title.className = 'title';
      if (searchQuery) {
        title.innerHTML = highlightText(titleOf(note), searchQuery); // 纯文本经转义后包 mark，无注入
      } else {
        title.textContent = titleOf(note); // textContent，天然防注入
      }

      var time = document.createElement('div');
      time.className = 'time';
      renderNoteTime(time, note);

      // 未完成待办且有截止时间：右上角显示倒计时，已过期标红
      if (isTodo(note) && !isDone(note) && note.dueAt) {
        li.classList.add('has-due');
        var due = document.createElement('div');
        var txt = dueText(note);
        due.className = 'due-badge' + (txt === '已过期' ? ' overdue' : '');
        due.textContent = txt;
        due.dataset.id = note.id; // 事件委托刷新倒计时文案
        face.appendChild(due);
      }

      // 该便签含重点图片 → 右上角小星标提示（异步查库，带缓存）
      if (note.id) {
        var starFlag = document.createElement('div');
        starFlag.className = 'star-flag';
        starFlag.textContent = '⭐';
        starFlag.style.display = 'none';
        face.appendChild(starFlag);
        noteHasStarredImage(note.id).then(function (has) {
          if (!has) return;
          li.classList.add('has-star');
          starFlag.style.display = 'block';
        });
      }

      // 置顶便签：卡片加 is-pinned（左侧竖条由 CSS ::before 绘制），右上角小图钉
      if (isPinned(note)) {
        li.classList.add('is-pinned', 'has-pin');
        var pinFlag = document.createElement('div');
        pinFlag.className = 'pin-flag';
        pinFlag.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l1 7 3 3H5l3-3z"/></svg>';
        face.appendChild(pinFlag);
      }

      // 摘要：默认 -webkit-line-clamp 2 行省略号；展开态由 expandedSummaries 恢复
      var wrap = document.createElement('div');
      wrap.className = 'excerpt-wrap';
      var summary = document.createElement('div');
      summary.className = 'summary';
      if (expandedSummaries[note.id]) summary.classList.add('expanded');
      if (searchQuery) {
        summary.innerHTML = highlightText(excerptOf(note), searchQuery);
      } else {
        summary.textContent = excerptOf(note);
      }
      wrap.appendChild(summary);

      body.appendChild(title);
      body.appendChild(wrap);
      body.appendChild(time);
      face.appendChild(box);
      face.appendChild(body);
      var clip = document.createElement('div');
      clip.className = 'swipe-clip'; // Bug2(B)：菜单裁剪容器（菜单藏在右缘外，左滑越过阈值才滑入）
      clip.appendChild(actions);
      li.appendChild(clip);
      li.appendChild(face);

      li.dataset.id = note.id; // 事件委托用：点击时从这里取 id

      // 手势：左滑操作菜单 + 长按拖拽排序（见「手势层」小节，纯 Touch Events）
      li.addEventListener('touchstart', onGestureStart, { passive: true }); // 不 preventDefault，click 合成不受影响
      // 长按/右键不再弹系统菜单（原长按操作菜单已移除）
      li.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      listEl.appendChild(li);

      // 溢出检测 → 超过 2 行才创建展开按钮。
      // li 已挂到 DOM；列表可见时立即量；不可见时（backToList 先 renderList 再
      // show('list')，此刻列表 display:none）自旋等到 .active 出现，量出的
      // scrollHeight 才是真实值。≤2 行 → 按钮完全不创建
      (function (li, wrap, summary) {
        var measure = function () {
          if (!listView.classList.contains('active')) { requestAnimationFrame(measure); return; }
          var btn = buildSummaryToggle(note.id, summary);
          if (btn) { wrap.classList.add('has-toggle'); wrap.appendChild(btn); }
        };
        measure();
      })(li, wrap, summary);

      // 置顶区与普通区之间插一条极浅分割线（无置顶或置顶排到最后时不显示）
      if (noteIdx === lastPin && lastPin < sorted.length - 1) {
        var divider = document.createElement('li');
        divider.className = 'pin-divider';
        listEl.appendChild(divider);
      }
    });
  }

  /* ---------- 单条操作菜单已移除：置顶/复制/删除改为左滑露出，长按负责拖拽排序 ---------- */

  // 复制标题+正文纯文本；优先 navigator.clipboard，失败（非安全上下文等）退回 execCommand
  function copyNoteText(id) {
    var note = noteById(id);
    if (!note) return;
    var text = titleOf(note) + '\n' + plainTextOf(note.content);
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showUndoToast(ok ? '已复制' : '复制失败');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showUndoToast('已复制');
      }, fallback);
    } else {
      fallback();
    }
  }

  // 删除单条便签及其图片（复用批量删除的事务）。
  // 普通模式与长按菜单「删除」都走「弧形飞入垃圾桶」动画：克隆卡片沿二次贝塞尔
  // 曲线以 linear 均匀速率飞向顶栏垃圾桶（550ms，rAF 手动驱动），动画结束回调里
  // 才真正删 IndexedDB + DOM，其余卡片 200ms 折叠补位；
  // 动画被节流打断/抛异常时由幂等兑底强删一次，保证数据一致；
  // prefers-reduced-motion 下不播放动画，直接删除。
  // 多选批量删除（#sel-delete）保持原有瞬时行为，不走此动画。
  function deleteSingleNote(id) {
    var note = noteById(id);
    if (!note) return;
    // 弃用原生 confirm（按钮文字随浏览器语言变），改用可复用自定义确认框；
    // 点击“是” → 立即走曲线删除动画；点“否”/遮罩 → 什么都不做
    confirmDialog({
      title: '删除便签',
      message: '删除后可到回收箱找回（保留 3 天），确定删除这条便签吗？',
      confirmText: '是',
      cancelText: '否'
    }).then(function (ok) {
      if (!ok) return;
      showUndoToast('已删除');
      var li = liForNoteId(id);
      // 卡片不在列表（分段/搜索过滤）/ 减少动态效果：跳过动画直接删
      if (prefersReducedMotion() || !li || !li.isConnected) { removeNoteNow(id); return; }
      var deleted = false; // 幂等兑底：动画完成/中断/异常都只执行一次数据删除
      var doDelete = function () {
        if (deleted) return;
        deleted = true;
        removeNoteNow(id);
      };
      try {
        // 复用曲线删除动画（内部按卡片当前 boundingRect 克隆，飞向右上角垃圾桶）；
        // 真实数据删除（IndexedDB note + images 清理）放进动画结束回调执行
        animateCardToTrash(id, li, doDelete);
      } catch (err) {
        flyAnimating = false; // 动画启动异常：复位飞行锁
        doDelete();           // 并强制删除一次，避免数据不一致
      }
    });
  }

  // 可复用的确认对话框：confirmDialog({title,message,confirmText,cancelText}) → Promise<boolean>
  // 遮罩淡入 150ms；点“是”resolve(true)，点“否”或遮罩 resolve(false)。
  // 同一时刻只允许一个对话；重复调用时后者立即拿到 false（防双开）。
  var confirmModalEl = null;
  var confirmOpen = false;
  function confirmDialog(opts) {
    opts = opts || {};
    if (!confirmModalEl) confirmModalEl = document.getElementById('confirm-modal');
    return new Promise(function (resolve) {
      if (!confirmModalEl || confirmOpen) { resolve(false); return; }
      confirmOpen = true;
      confirmModalEl.querySelector('.confirm-title').textContent = opts.title || '确认删除';
      confirmModalEl.querySelector('.confirm-msg').textContent = opts.message || '';
      var cancelBtn = confirmModalEl.querySelector('.confirm-cancel');
      var okBtn = confirmModalEl.querySelector('.confirm-ok');
      cancelBtn.textContent = opts.cancelText || '否';
      okBtn.textContent = opts.confirmText || '是';
      var settled = false;
      function finish(val) {
        if (settled) return;
        settled = true;
        confirmModalEl.classList.remove('show');
        setTimeout(function () { confirmOpen = false; }, 160); // 等淡出结束再允许下一次
        resolve(val);
      }
      cancelBtn.onclick = function () { finish(false); };
      okBtn.onclick = function () { finish(true); };
      confirmModalEl.onclick = function (e) { if (e.target === confirmModalEl) finish(false); }; // 点遮罩
      confirmModalEl.classList.add('show');
    });
  }

  // 找出当前列表中 id 对应的卡片 DOM（分段/搜索过滤下可能不在 → null）
  function liForNoteId(id) {
    var kids = listEl.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el.classList && el.classList.contains('note-item') && String(el.dataset.id) === String(id)) return el;
    }
    return null;
  }

  // 即删：软删除进回收箱（打标记）→ 卡片折叠补位（200ms）→ 计数/空态；
  // 图片 Blob 不删，待到回收箱超期清理时才真正连带删除。
  function removeNoteNow(id) {
    markNoteDeleted(id, 'manual');
    collapseListItem(liForNoteId(id), function () {
      var remain = sortedNotesFor(segFilter).filter(matchesSearch).length;
      if (remain === 0) renderList(); // 空态 / 计数由 renderList 统一处理
      else countEl.textContent = remain + ' 条';
    });
  }

  // 剩余卡片补位动画：把被删卡片的高度/内边距/外边距折叠到 0（200ms），
  // 下方卡片随之平滑上移填满缺口；结束后移除卡片 DOM 与相邻分割线。
  function collapseListItem(li, done) {
    if (!li || !li.isConnected) { done(); return; }
    var h = li.getBoundingClientRect().height;
    if (prefersReducedMotion() || !h) { removeLiAndDivider(li); done(); return; }
    var body = li.querySelector('.swipe-body'); // 卡片本体：与 li 同步折叠内边距
    li.style.boxSizing = 'border-box';
    li.style.overflow = 'hidden';
    li.style.height = h + 'px';
    li.style.transition = [
      'height 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'padding-top 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'padding-bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'margin-bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
      'opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1)'
    ].join(', ');
    if (body) {
      body.style.transition = 'padding-top 0.2s cubic-bezier(0.4, 0, 0.2, 1), padding-bottom 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
    }
    void li.offsetHeight; // 强制回流锁定起点
    li.style.height = '0px';
    li.style.paddingTop = '0px';
    li.style.paddingBottom = '0px';
    li.style.marginBottom = '0px';
    li.style.opacity = '0';
    if (body) { body.style.paddingTop = '0px'; body.style.paddingBottom = '0px'; }
    var settled = false;
    var finish = function () {
      if (settled) return;
      settled = true;
      li.removeEventListener('transitionend', onEnd);
      clearTimeout(fallback);
      removeLiAndDivider(li);
      done();
    };
    var onEnd = function (e) {
      if (e.target === li && (e.propertyName === 'height' || e.propertyName === 'margin-bottom')) finish();
    };
    var fallback = setTimeout(finish, 250); // transitionend 丢失兜底
    li.addEventListener('transitionend', onEnd);
  }

  // 移除卡片及其后的置顶分割线（分割线不参与补位动画，随卡片一并消失）
  function removeLiAndDivider(li) {
    var after = li.nextElementSibling;
    if (after && after.classList && after.classList.contains('pin-divider')) after.remove();
    li.remove();
  }

  /* ---------- 弧形删除动画（curved card deletion） ----------
     触发：卡片操作面板 / 左滑菜单点「删除」→ deleteSingleNote。
     克隆卡片固定定位到当前包围盒，逐帧沿二次贝塞尔曲线飞向右上角「选择」图标
     （原垃圾桶按钮已移除，落点锚点改为 sel-enter 的中心），
     位置/缩放/旋转统一走 linear 均匀速率（p = t）：全程匀速推进、无头重脚轻
     （scale 1→0.05 均匀收缩、旋转 0→25° 匀速递进）；
     opacity 前 60% 保持 1、后 40% 线性衰减到 0；transform-origin
     指向右上角落点。落点同步脉冲。同一时刻只允许一张卡片在飞。 */
  var flyAnimating = false; // 是否有卡片正在飞向落点
  var trashPulseTimer = null;

  function trashCenter() {
    var r = $('sel-enter').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function animateCardToTrash(id, li, done) {
    if (flyAnimating) { done(); return; } // 已有卡片在飞：本次直接删除，不排队
    flyAnimating = true;

    var s = li.getBoundingClientRect();
    var from = { x: s.left + s.width / 2, y: s.top + s.height / 2 }; // 卡片中心
    var end = trashCenter();                                          // 垃圾桶中心
    // 控制点：起点→终点连线的中点，再向右上偏移 (60, -80)，画一条明显上扬的弧线
    var midX = (from.x + end.x) / 2, midY = (from.y + end.y) / 2;
    var ctrl = { x: midX + 60, y: midY - 80 };

    var clone = document.createElement('div');
    clone.className = 'fly-clone';
    clone.setAttribute('aria-hidden', 'true');
    clone.style.left = s.left + 'px';
    clone.style.top = s.top + 'px';
    clone.style.width = s.width + 'px';
    clone.style.height = s.height + 'px';
    clone.style.willChange = 'transform, opacity'; // 提示合成器：只动画 transform/opacity
    clone.appendChild(li.cloneNode(true));
    document.body.appendChild(clone);
    void clone.offsetHeight; // 确保首帧定位生效后再起动画

    pulseTrashBtn(); // 垃圾桶同步脉冲（300ms）
    var t0 = performance.now();
    var DUR = 550;
    var finished = false;
    var finish = function () {
      if (finished) return;
      finished = true;
      clearTimeout(stall);
      clone.style.willChange = ''; // 动画结束移除合成提示
      clone.remove(); // 飞行结束：清理克隆体
      flyAnimating = false;
      if (done) done();
    };
    var stall = setTimeout(finish, DUR + 60); // rAF 被节流（切后台等）时兜底收尾
    // linear 均匀速率：p = t，位置/缩放/旋转全程匀速推进，无「头重脚轻」的慢开头快收尾。
    // opacity 前 60% 保持 1、后 40% 线性衰减到 0（不同时结束，飞入后期才淡出）。
    // 只改 transform（translate3d + scale + rotate）与 opacity，
    // 触发 GPU 合成加速；不动 top/left/width/height，避免多次布局抖动造成掉帧
    var frame = function (now) {
      try {
        var p = Math.min(1, (now - t0) / DUR);
        var e = p; // linear：均匀速率，p = t
        // 二次贝塞尔采样：p(t) = (1-t)²·P0 + 2(1-t)t·C + t²·P1（弧线形状不变，速度变均匀）
        var u = 1 - e;
        var cx = u * u * from.x + 2 * u * e * ctrl.x + e * e * end.x;
        var cy = u * u * from.y + 2 * u * e * ctrl.y + e * e * end.y;
        // scale 从 1 到 0.05 线性变化：sc = 1 - 0.95·p；
        // opacity：p < 0.6 保持 1，p ≥ 0.6 后按 (1 - (p-0.6)/0.4) 线性衰减到 0；
        // 旋转 0 → 25° 随同一线性进度递进
        var sc = 1 - 0.95 * e;
        var opacity = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
        clone.style.transform =
          'translate3d(' + (cx - from.x) + 'px,' + (cy - from.y) + 'px,0)' +
          ' scale(' + sc + ')' +
          ' rotate(' + (25 * e) + 'deg)';
        clone.style.opacity = String(opacity);
        if (p < 1) { requestAnimationFrame(frame); return; }
        finish();
      } catch (err) {
        finish(); // 动画异常兜底：清理克隆体并执行删除回调，保证数据一致
      }
    };
    requestAnimationFrame(frame);
  }

  // 落点脉冲：300ms 内 scale 1 → 1.2 → 1（CSS keyframes 一次性播放，打在「选择」图标上）
  function pulseTrashBtn() {
    var btn = $('sel-enter');
    if (!btn || prefersReducedMotion()) return;
    btn.classList.remove('pulsing');
    void btn.offsetWidth; // 重置动画
    btn.classList.add('pulsing');
    clearTimeout(trashPulseTimer);
    trashPulseTimer = setTimeout(function () { btn.classList.remove('pulsing'); }, 320);
  }

  /* ---------- 视图切换（简化版单向滑入/滑出，状态由 show() 全权管理） ---------- */

  var editorAnimCleanup = null; // 滑入/滑出过程的清理函数（transitionend + 超时兜底）
  var pendingListShow = false;   // 编辑页滑出结束后是否需要显示列表页
  var noBlurClearTimer = null;   // no-blur / will-change 清除定时器（防止泄漏）

  // 动画结束：移除一次性临时 class，编辑页回到基线到位态 translateX(0)。
  // 滑出（返回列表）结束时必须把编辑页彻底隐藏（去掉 .active → visibility:hidden），
  // 然后才让列表页可见（避免列表页闪现掩盖编辑页滑出动画）
  function finishEditorAnim() {
    if (editorAnimCleanup) { editorAnimCleanup(); editorAnimCleanup = null; }
    var wasLeaving = editorView.classList.contains('leaving');
    editorView.classList.remove('entering', 'leaving');
    // 清除上一次的 noBlurClearTimer，防止泄漏
    clearTimeout(noBlurClearTimer);
    document.body.classList.remove('no-blur-rest'); // 防御：中断路径清理分批恢复残留
    // 延迟清除 no-blur 和 will-change，确保动画完全结束
    noBlurClearTimer = setTimeout(function () {
      // 分批恢复 backdrop-filter：先恢复顶栏/搜索/分段（编辑层此刻已隐藏，恢复成本≈0），
      // 底部胶囊再冻结一帧恢复——避免 5 个玻璃面同帧重新采样造成的重绘尖峰（返回瞬间卡/闪根因之一）
      document.body.classList.add('no-blur-rest');
      document.body.classList.remove('no-blur');
      noBlurClearTimer = setTimeout(function () {
        document.body.classList.remove('no-blur-rest');
        listView.style.willChange = '';
        editorView.style.willChange = '';
        noBlurClearTimer = null;
      }, 16); // 下一帧恢复底部胶囊
    }, 80); // 动画结束后 80ms 再移除，避免视觉闪烁
    if (wasLeaving) {
      editorView.classList.remove('active'); // 去掉 .active → visibility:hidden + pointer-events:none
      headerEl.classList.remove('freeze-blur'); // 滑出结束，恢复顶栏模糊
      // 编辑页已隐藏，现在才显示列表页（问题 1+2 修复）
      if (pendingListShow) {
        pendingListShow = false;
        listView.classList.add('active');
      }
    }
  }

  // 挂动画结束监听：transitionend（transform）或 420ms 超时兜底
  //（后台标签页等场景收不到 transitionend，超时强制复位到位态）
  function watchEditorAnimEnd() {
    var onEnd = function (e) {
      if (e.target !== editorView || e.propertyName !== 'transform') return;
      finishEditorAnim();
    };
    var fallback = setTimeout(finishEditorAnim, 420); // 320ms 动画 + 100ms 余量
    editorAnimCleanup = function () {
      clearTimeout(fallback);
      clearTimeout(noBlurClearTimer); // 同时清除 no-blur 定时器，防止泄漏
      noBlurClearTimer = null;
      editorView.removeEventListener('transitionend', onEnd);
    };
    editorView.addEventListener('transitionend', onEnd);
  }

  // 返回列表：编辑页滑出（滑入途中点返回则直接掉头），结束后隐藏复位
  function hideEditorWithTransition() {
    if (!editorView.classList.contains('active')) return;
    if (editorAnimCleanup) { editorAnimCleanup(); editorAnimCleanup = null; } // 取消在途动画（同时清除 noBlurClearTimer）
    // 切换前：冻结 backdrop-filter + 提升合成层
    clearTimeout(noBlurClearTimer); // 清除上一次残留的 no-blur 清除定时器
    document.body.classList.remove('no-blur-rest'); // 同步清理分批恢复残留
    document.body.classList.add('no-blur');
    listView.classList.add('active'); // 提前让列表页可见，避免编辑页滑出时闪蓝底
    listView.style.willChange = 'transform, opacity';
    editorView.style.willChange = 'transform, opacity';
    headerEl.classList.add('freeze-blur'); // 滑出期间临时关顶栏 blur，避免合成闪白（约束3）
    editorView.classList.add('leaving'); // → translate3d(100%,0,0) + opacity 0，从任何当前位置都能过渡
    watchEditorAnimEnd();
  }

  function show(view) {
    var toEditor = view === 'editor';
    if (toEditor) {
      // 进入编辑页：列表页保持 active（编辑页盖住它即可），编辑页滑入
      pendingListShow = false;
      clearTimeout(noBlurClearTimer); // 清除可能残留的 no-blur 清除定时器
      finishEditorAnim(); // 上一次滑出未结束也要先复位，保证本次一定能进入
      // 根因修复：finishEditorAnim() 内部会排一个 80ms 的 no-blur/will-change 清理定时器；
      // 本函数马上要重新挂 no-blur/will-change 并启动 320ms 滑入动画，不清掉它会在
      // t≈80ms 提前移除，让动画剩余 3/4 处于「无合成层 + 重新激活 backdrop-filter」的
      // 高成本状态，收尾慢速段掉帧（编辑页滑入末尾顿挫根因）。
      clearTimeout(noBlurClearTimer);
      noBlurClearTimer = null;
      // 切换前：冻结 backdrop-filter + 提升合成层
      document.body.classList.add('no-blur');
      listView.style.willChange = 'transform, opacity';
      editorView.style.willChange = 'transform, opacity';
      headerEl.classList.remove('freeze-blur'); // 防御：确保进入编辑页时模糊恢复
      editorView.classList.add('active');       // visibility:visible + translate3d(0,0,0)
      editorView.classList.add('entering');     // 先摆到屏外起点 100%
      editorView.style.transition = 'none';     // 摆起点不参与过渡（含中途改道时避免来回弹）
      void editorView.offsetWidth;              // 强制重排，锁定起点
      editorView.style.transition = '';         // 恢复过渡
      editorView.classList.remove('entering');  // 100% → 0 滑入，结束停在基线到位态
      watchEditorAnimEnd();
    } else {
      // 返回列表页：先启动编辑页滑出，等动画结束后再显示列表页
      // （避免列表页瞬间 visible 掩盖编辑页滑出动画）
      pendingListShow = true;
      hideEditorWithTransition();
    }
  }

  /* ---------- 编辑器 ---------- */

  // 旧版正文用 [图片:id] 文本标记，打开时升级为内联 <img>（id 仅含字母数字，无注入风险）
  function upgradeLegacyMarkers(content) {
    return String(content || '').replace(MARKER_RE, '<img data-img-id="$1" alt="便签图片">');
  }

  function openNote(id) {
    stopMomentum(); // 离开列表进编辑页：停掉惯性
    resetCropBusy(); // 进入编辑页时重置 cropBusy（防止上次残留）
    var myToken = ++openToken; // 本次的入场号；后续在途异步都带着它校验
    var note = noteById(id);
    if (!note) return;
    pendingSaveId = null; // 上一条便签的离开写入目标已作废，换绑当前便签
    currentId = id;
    editorEl.innerHTML = upgradeLegacyMarkers(note.content); // 同步写入，无竞态
    hydrateImages(editorEl, myToken); // 异步补 src/pos，完成后校验 token
    savedRange = null; // 换了笔记，旧选区作废；没点过光标则插入时落到末尾
    savedSelection = null; // 底部格式按钮的选区快照同样作废（避免对新笔记误用旧选区）
    syncEditorTodoUI();
    resetUndoHistory(); // 每次打开便签都清空撤销历史
    updateWordCount(); // 打开即显示本篇字数
    show('editor');
    // 不自动聚焦编辑器：避免进入编辑页就弹键盘；用户点一下编辑器再输入
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  // 编辑页待办区（复选框 + 提醒按钮）随当前便签类型显隐与刷新
  function syncEditorTodoUI() {
    var note = noteById(currentId);
    var isT = !!(note && isTodo(note));
    editorTodoHead.style.display = isT ? 'flex' : 'none';
    dueBtn.style.display = isT ? 'inline-flex' : 'none';
    if (!isT) return;
    editorTodoChk.classList.toggle('on', isDone(note));
    if (note.dueAt) {
      var d = new Date(note.dueAt);
      dueBtn.textContent = '⏰ ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes());
      dueBtn.classList.remove('overdue');
    } else {
      dueBtn.textContent = '⏰ 设置提醒';
      dueBtn.classList.remove('overdue');
    }
    dueInput.value = note.dueAt ? toLocalInputValue(note.dueAt) : '';
    hideDuePop();
  }

  function createNote(type) {
    var now = Date.now();
    var note = { id: uid(), content: '', createdAt: now, updatedAt: now };
    if (type === 'todo') {
      note.type = 'todo';
      note.dueAt = null;
      note.doneAt = null;
    }
    notes.unshift(note);
    dbPut(note).catch(function () { /* 存储失败静默 */ });
    openNote(note.id);
  }

  // 写库提交：只落库，不读 DOM、不依赖 currentId。正文在 input 时已同步进内存 note 对象，
  // 所以定时器即使晚于返回/切便签触发也不会丢数据、不会把别的便签内容写串。
  function commitSave(id) {
    var nid = id || currentId || pendingSaveId;
    var note = noteById(nid);
    if (!note) return;
    scheduleNoteNotification(note); // 待办：随每次保存对齐系统通知（幂等，条件不满足自动取消）
    if (!id || id === currentId) {
      // 编辑器仍显示该便签：同步图片重点标注 + 清缓存（切换后跳过，避免读错 DOM）
      syncImagesStars();
      invalidateStarFlagCache(nid);
    }
    dbPut(note).then(function () {
      saveStatus.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(function () {
        saveStatus.classList.remove('show');
      }, 1200);
    }).catch(function () { /* 存储失败静默 */ });
  }

  function backToList() {
    openToken++; // 离开编辑器，作废该笔记所有在途异步加载
    var leavingId = currentId;
    pendingSaveId = leavingId; // 捕获离开便签：currentId 置 null 后写库仍能定位（修复 1.5.5 延迟保存丢失）
    currentId = null;
    clearTimeout(wordCountTimer); // 取消在途的字数统计，避免空引用
    clearTimeout(undoTimer);      // 同 wordCount：取消在途撤销快照序列化，避免滑出动画中途全量 innerHTML
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { commitSave(leavingId); }, 450); // 最终写库：写入 input 时已更新的内存对象，blur 是否触发都不丢
    // Bug4：返回列表——定向更新这一条卡片，不全量 renderList（innerHTML 重建全列表）。
    // renderList 重建所有卡片 + 重置滚动位置 → 主线程卡顿 + 列表跳回顶部 =整页重加载感/闪动。
    // 定向更新只改该卡片的标题/摘要/时间/待办态文本，其余卡片和滚动位置完全不动。
    // 根因修复：整块更新推迟到编辑页完全滑出隐藏后再执行——titleOf/excerptOf 会全量解析
    // 正文、摘要重测要强制回流；编辑后内容真变，同步执行会拉长「点击返回→动画首帧」
    //（与 blur 同步 autosave 叠加成返回卡顿主因）。滑出期间列表短暂显示旧内容，
    // 动画结束瞬间刷新（既定设计）；编辑器滑入/其他路径不受影响。
    if (leavingId != null) {
      (function (nid) {
        var apply = function () {
          // 编辑页还在（滑出中/滑入中）→ 等它隐藏后再更新，避免动画期间在列表上做回流
          if (editorView.classList.contains('active')) { requestAnimationFrame(apply); return; }
          var noteLeft = noteById(nid);
          var li = listEl.querySelector('li[data-id="' + nid + '"]');
          if (noteLeft && li) {
            // 更新标题（含搜索高亮）
            var tEl = li.querySelector('.title');
            if (tEl) tEl.innerHTML = searchQuery ? highlightText(titleOf(noteLeft), searchQuery) : titleOf(noteLeft);
            // 更新时间（创建于/编辑于两行）
            var tmEl = li.querySelector('.time');
            if (tmEl) renderNoteTime(tmEl, noteLeft);
            // 更新摘要（含搜索高亮，恢复展开态）
            var sEl = li.querySelector('.summary');
            if (sEl) {
              sEl.innerHTML = searchQuery ? highlightText(excerptOf(noteLeft), searchQuery) : excerptOf(noteLeft);
              sEl.classList.toggle('expanded', !!expandedSummaries[nid]);
              // 重建摘要展开按钮（等编辑页完全滑出隐藏后再测量，避免滑出首帧在列表上做强制回流）
              var wrapEl = sEl.parentElement;
              if (wrapEl) {
                var oldToggle = wrapEl.querySelector('.summary-toggle');
                if (oldToggle) oldToggle.remove();
                wrapEl.classList.remove('has-toggle');
                (function (nid2, sE, wE) {
                  var measure = function () {
                    // 编辑页还在（滑出中/滑入中）→ 等它隐藏后再测量挂按钮
                    if (editorView.classList.contains('active')) { requestAnimationFrame(measure); return; }
                    var btn = buildSummaryToggle(nid2, sE);
                    if (btn) { wE.classList.add('has-toggle'); wE.appendChild(btn); }
                  };
                  measure();
                })(nid, sEl, wrapEl);
              }
            }
            // 更新待办完成态（编辑器内可切换）
            if (isTodo(noteLeft)) {
              li.classList.add('is-todo');
              var chk = li.querySelector('.todo-chk');
              if (chk) {
                chk.classList.toggle('on', isDone(noteLeft));
                chk.classList.toggle('overdue', isOverdue(noteLeft)); // 过期圆圈同步变红
              }
              li.classList.toggle('is-done', isDone(noteLeft));
            }
            // 更新 due角标（编辑器内可修改截止时间）
            var badge = li.querySelector('.due-badge');
            if (isTodo(noteLeft) && !isDone(noteLeft) && noteLeft.dueAt) {
              var dTxt = dueText(noteLeft);
              if (!badge) {
                var face = li.querySelector('.swipe-body');
                if (face) {
                  badge = document.createElement('div');
                  badge.className = 'due-badge';
                  face.appendChild(badge);
                }
              }
              if (badge) {
                badge.className = 'due-badge' + (dTxt === '已过期' ? ' overdue' : '');
                badge.textContent = dTxt;
                badge.dataset.id = nid;
              }
              li.classList.add('has-due');
            } else if (badge) {
              badge.remove();
              li.classList.remove('has-due');
            }
          } else if (!noteLeft && li) {
            // 空便签已被清理，移除卡片
            li.remove();
          } else {
            // li 不存在或过滤器结构变化，安全回退全量重建（列表已可见，无需再 show('list')）
            renderList();
          }
        };
        apply();
      })(leavingId);
    }
    // 更新条数与空态
    var sorted = sortedNotesFor(segFilter).filter(matchesSearch);
    var hasNotes = sorted.length > 0;
    countEl.textContent = hasNotes ? sorted.length + ' 条' : '';
    emptyEl.style.display = hasNotes ? 'none' : 'flex';
    if (searchQuery && !hasNotes) {
      searchEmptyEl.textContent = '没有找到含"' + searchInput.value.trim() + '"的便签';
      searchEmptyEl.style.display = 'block';
    } else {
      searchEmptyEl.style.display = 'none';
    }
    show('list');
  }

  function deleteCurrent() {
    var note = noteById(currentId);
    var label = note ? titleOf(note) : '';
    confirmDialog({
      title: '删除便签',
      message: '删除后可到回收箱找回（保留 3 天），确定删除这条便签吗？',
      confirmText: '是',
      cancelText: '否'
    }).then(function (ok) {
      if (!ok || currentId == null) return;
      markNoteDeleted(currentId, 'manual');
      openToken++; // 同 backToList：删除即离开编辑器，作废在途加载
      currentId = null;
      renderList();
      show('list');
      showUndoToast('已删除');
    });
  }

  /* ---------- 撤销 / 重做（仅编辑页正文与标题内容） ---------- */

  var UNDO_MAX = 50;          // 历史栈上限
  var undoHistory = [];       // 快照栈：{ content, caretOffset, imgCount }
  var undoPointer = -1;       // 当前所在的历史位置
  var undoTimer = null;       // 500ms 防抖定时器
  var isRestoring = false;    // 恢复快照写 DOM 期间不产生新快照
  var lastPushedSnap = null;  // 上一次入栈（或打开便签）时的基准，用于识别图片增删
  var undoToastTimer = null;

  function caretOffsetNow() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !editorEl.contains(sel.anchorNode)) return -1;
    var r = sel.getRangeAt(0);
    var range = document.createRange();
    range.selectNodeContents(editorEl);
    range.setEnd(r.endContainer, r.endOffset);
    return range.toString().length; // 纯文本偏移量
  }

  function snapshotNow() {
    return {
      content: editorEl.innerHTML,
      caretOffset: caretOffsetNow(),
      imgCount: editorEl.querySelectorAll('img[data-img-id]').length
    };
  }

  // 光标按纯文本偏移恢复：从编辑器起点数第 offset 个字符处
  function setCaretByOffset(root, offset, range) {
    var remaining = offset;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while ((node = walker.nextNode())) {
      var len = node.nodeValue.length;
      if (remaining <= len) {
        try { range.setStart(node, remaining); range.collapse(true); return true; }
        catch (err) { return false; }
      }
      remaining -= len;
    }
    return false;
  }

  function pushUndoSnapshot() {
    undoTimer = null;
    var snap = snapshotNow();
    if (lastPushedSnap) {
      if (snap.content === lastPushedSnap.content) return; // 无实际变化
      // 仅图片增删（纯文本相同）不入历史：图片有独立的数据管理
      if (snap.imgCount !== lastPushedSnap.imgCount &&
          htmlToPlain(snap.content) === htmlToPlain(lastPushedSnap.content)) {
        lastPushedSnap = snap; // 图片状态同步到基准，但不产生撤销步
        return;
      }
    }
    undoHistory = undoHistory.slice(0, undoPointer + 1); // 新操作丢弃重做分支
    if (undoHistory.length >= UNDO_MAX) undoHistory.shift();
    undoHistory.push(snap);
    undoPointer = undoHistory.length - 1;
    lastPushedSnap = snap;
    updateUndoButtons();
  }

  // 内容变化后延迟 500ms 入栈，连续输入合并成一个快照
  function scheduleUndoSnapshot() {
    if (isRestoring) return;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(pushUndoSnapshot, 500);
  }

  function restoreSnapshot(snap) {
    isRestoring = true;
    editorEl.innerHTML = String(snap.content || '').replace(/ class="lp-dim"/g, '');
    var sel = window.getSelection();
    var restored = false;
    if (snap.caretOffset >= 0 && sel) {
      var range = document.createRange();
      if (setCaretByOffset(editorEl, snap.caretOffset, range)) {
        sel.removeAllRanges();
        sel.addRange(range);
        restored = true;
      }
    }
    if (!restored) { // 无有效偏移：光标放编辑器末尾
      editorEl.focus();
      var end = document.createRange();
      end.selectNodeContents(editorEl);
      end.collapse(false);
      if (sel) { sel.removeAllRanges(); sel.addRange(end); }
    }
    var note = noteById(currentId);
    if (note) {
      note.content = editorEl.innerHTML;
      note.updatedAt = Date.now();
      dbPut(note).catch(function () { /* 存储失败静默 */ });
    }
    renderImageStrip();
    // 快照不含图片增删历史：恢复后清掉库里已不存在的图片节点，避免幽灵图
    Array.prototype.forEach.call(editorEl.querySelectorAll('img[data-img-id]'), function (img) {
      var id = img.dataset.imgId;
      if (!id || imgUrlCache[id]) return;
      dbGetImage(id).then(function (rec) {
        if (rec || !img.isConnected) return;
        img.remove();
        var n = noteById(currentId);
        if (n) {
          n.content = editorEl.innerHTML;
          dbPut(n).catch(function () { /* 存储失败静默 */ });
        }
      });
    });
    isRestoring = false;
  }

  function updateUndoButtons() {
    $('undo-btn').disabled = undoPointer <= 0; // 最初状态：撤销变灰
    $('redo-btn').disabled = undoPointer >= undoHistory.length - 1;
  }

  // 打开便签时重置历史（历史不跨便签、不跨会话）
  function resetUndoHistory() {
    clearTimeout(undoTimer);
    undoTimer = null;
    isRestoring = true;
    undoHistory = [snapshotNow()];
    undoHistory[0].caretOffset = -1;
    undoPointer = 0;
    lastPushedSnap = undoHistory[0];
    isRestoring = false;
    updateUndoButtons();
  }

  function undoEdits() {
    if (undoPointer <= 0) return;
    clearTimeout(undoTimer);
    undoPointer--;
    lastPushedSnap = undoHistory[undoPointer];
    restoreSnapshot(undoHistory[undoPointer]);
    showUndoToast('已撤销');
    updateUndoButtons();
  }

  function redoEdits() {
    if (undoPointer >= undoHistory.length - 1) return;
    clearTimeout(undoTimer);
    undoPointer++;
    lastPushedSnap = undoHistory[undoPointer];
    restoreSnapshot(undoHistory[undoPointer]);
    showUndoToast('已重做');
    updateUndoButtons();
  }

  function showUndoToast(text, ms) { // ms 可选：手动检查等场景按需延长展示时长
    var toast = $('undo-toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(undoToastTimer);
    undoToastTimer = setTimeout(function () { toast.classList.remove('show'); }, ms || 1500);
  }

  /* ---------- 图片插入 ---------- */

  // 保存编辑器当前选区；光标不在编辑器里时存 null（插入时落到末尾）
  function saveEditorRange() {
    var sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    } else {
      savedRange = null;
    }
  }

  // 保存的选区是否还能用（起点节点必须仍连接在文档里且属于编辑器）
  function rangeIsValid(range) {
    return !!(range && range.startContainer && range.startContainer.isConnected &&
              editorEl.contains(range.startContainer));
  }

  // 在光标处插入元素：优先恢复点「图片」按钮前保存的选区，无效则落到编辑器末尾
  function insertNodeAtCaret(node) {
    editorEl.focus();
    var sel = window.getSelection();
    if (rangeIsValid(savedRange)) {
      sel.removeAllRanges();
      sel.addRange(savedRange); // 恢复保存的光标位置
    } else {
      savedRange = null;
      var end = document.createRange();
      end.selectNodeContents(editorEl);
      end.collapse(false); // 从未保存过有效光标，定位到编辑器末尾
      sel.removeAllRanges();
      sel.addRange(end);
    }
    var range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    // 光标移到插入内容之后，同时更新 savedRange，多张图按 DOM 顺序依次插入
    var r = document.createRange();
    r.setStartAfter(node);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
    savedRange = r.cloneRange();
    // contenteditable 不会因 DOM 操作自动触发 input，手动触发以启动自动保存
    editorEl.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // 落库 + 插入图片（裁剪产出与原图共用；mime 由调用方指定）
  // 先预建对象 URL 并预填缓存：插入后缩略图条/渲染直接命中缓存，不再重读 IndexedDB
  function insertImageBlob(blob, mime) {
    if (!currentId) return Promise.resolve(false);
    var rec = {
      id: uid(),
      noteId: currentId,
      mime: mime || blob.type || 'image/jpeg',
      blob: blob,
      pos: Date.now(), // 存储时在正文中的顺序（DOM 顺序）
      createdAt: Date.now(),
      starred: false // 图片重点标注，默认无
    };
    imgUrlCache[rec.id] = URL.createObjectURL(rec.blob);
    return dbPutImage(rec).then(function () {
      if (currentId !== rec.noteId) {
        // 上传落库前用户已离开该笔记：作废插入并清掉孤儿记录，避免图片串到别的便签
        dbDeleteImage(rec.id).catch(function () { /* 存储失败静默 */ });
        if (imgUrlCache[rec.id]) {
          URL.revokeObjectURL(imgUrlCache[rec.id]);
          delete imgUrlCache[rec.id];
        }
        return false;
      }
      var img = document.createElement('img');
      img.dataset.imgId = rec.id;
      img.dataset.imgNoteId = rec.noteId; // 供重点标注写库时补 noteId
      img.alt = '便签图片';
      img.contentEditable = 'false'; // 防 contenteditable 光标/编辑误入图片（存在时整段禁用编辑）
      img.draggable = false; // 防 contenteditable 原生拖拽吞 click（影响查看器打开）
      img.src = imgUrlCache[rec.id]; // 对象 URL 立即可用，不等落库
      insertNodeAtCaret(img);
      renderImageStrip();
      return true;
    }).catch(function () {
      if (imgUrlCache[rec.id]) {
        URL.revokeObjectURL(imgUrlCache[rec.id]);
        delete imgUrlCache[rec.id];
      }
      alert('图片保存失败，请重试');
      return false;
    });
  }

  // 选图入口：读尺寸 → 过小(<100px)直接插入；否则进裁剪队列逐张裁剪
  function handleImageFiles(files) {
    if (!currentId || !files || !files.length) return;
    Array.prototype.forEach.call(files, function (file) {
      if (!file || file.type.indexOf('image/') !== 0) return;
      if (file.size > 10 * 1024 * 1024) {
        alert('图片「' + file.name + '」超过 10MB，已跳过');
        return;
      }
      readImageElement(file).then(function (img) {
        if (img.naturalWidth < 100 || img.naturalHeight < 100) {
          return insertImageBlob(file, file.type); // 小图：跳过裁剪直接插入原图
        }
        cropQueue.push({ img: img, file: file, noteId: currentId });
        if (!cropBusy) { cropBusy = true; cropSkipped = 0; armCropBusyTimer(); openCropUI(cropQueue[0]); }
      }).catch(function () {
        showUndoToast('图片加载失败');
      });
    });
  }

  function getImageURL(id) {
    if (imgUrlCache[id]) return Promise.resolve(imgUrlCache[id]);
    return dbGetImage(id).then(function (rec) {
      if (!rec) return null;
      var url = URL.createObjectURL(rec.blob);
      imgUrlCache[id] = url;
      return url;
    }).catch(function () { return null; });
  }

  // 老图检测并压缩（一次性，静默执行）：解码 → 长边 >1920 则 canvas 压到 1920/0.85 →
  // 更新 IndexedDB 记录、替换缓存 objectURL、刷新 img.src。小图也打 compressed 标记，
  // 之后每次打开直接跳过，不再解码查尺寸。
  function maybeShrinkOldImage(rec, img, id, myToken) {
    if (!rec || !rec.blob) return Promise.resolve();
    return loadBlobToImage(rec.blob).then(function (el) {
      var w = el.naturalWidth, h = el.naturalHeight;
      if (w <= 1920 && h <= 1920) {
        rec.compressed = true; // 本就不大：标记一次，后续打开不重复解码
        return dbPutImage(rec).catch(function () { /* 静默 */ });
      }
      var scale = 1920 / Math.max(w, h);
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext('2d').drawImage(el, 0, 0, canvas.width, canvas.height);
      return blobFromCanvas(canvas).then(function (newBlob) {
        if (!newBlob) { // 编码失败不回退活：标记已尝试，避免每次打开都解码一遍
          rec.compressed = true;
          return dbPutImage(rec).catch(function () { /* 静默 */ });
        }
        rec.blob = newBlob;
        rec.mime = 'image/jpeg';
        rec.compressed = true;
        return dbPutImage(rec).then(function () {
          if (myToken !== openToken) return; // 已切笔记：库已更新，DOM 不换
          if (imgUrlCache[id]) {
            URL.revokeObjectURL(imgUrlCache[id]);
            delete imgUrlCache[id];
          }
          return getImageURL(id).then(function (url) {
            if (myToken !== openToken) return;
            if (url && img.isConnected) img.src = url; // 换上新压缩图
          });
        });
      });
    });
  }

  // Blob → Image 元素（拿自然尺寸；老图压缩/尺寸检查共用）
  function loadBlobToImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  // canvas → JPEG Blob（toBlob 优先，旧内核回退 toDataURL；失败返回 null）
  function blobFromCanvas(canvas) {
    return new Promise(function (resolve) {
      if (canvas.toBlob) {
        canvas.toBlob(function (b) { resolve(b || null); }, 'image/jpeg', 0.85);
      } else {
        try { resolve(dataURLtoBlob(canvas.toDataURL('image/jpeg', 0.85))); }
        catch (e) { resolve(null); }
      }
    });
  }

  // Blob → 压缩到长边 ≤1920 / 0.85 的 JPEG Blob（openViewer 兜底用）
  function compressBlobToBlob(blob) {
    return loadBlobToImage(blob).then(function (el) {
      var w = el.naturalWidth, h = el.naturalHeight;
      var scale = 1920 / Math.max(w, h);
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(el, 0, 0, cw, ch);
      return blobFromCanvas(canvas);
    });
  }

  // blob: URL → Blob（fetch 取回再查尺寸；失败返回 null）
  function fetchBlobByUrl(url) {
    return fetch(url).then(function (r) { return r.blob(); }).catch(function () { return null; });
  }

  // 打开笔记时为每张 img 恢复 src 并复用 objectURL；旧记录缺 pos 时按 DOM 顺序补写
  // myToken：调用时的 openToken，回调回来后不一致说明已切笔记，直接丢弃
  function hydrateImages(container, myToken) {
    if (myToken === undefined) myToken = openToken;
    var imgs = container.querySelectorAll('img[data-img-id]');
    Array.prototype.forEach.call(imgs, function (img, idx) {
      var id = img.dataset.imgId;
      if (!id) return;
      img.dataset.imgNoteId = currentId || ''; // 供重点标注写库时补 noteId
      if (imgUrlCache[id]) { img.src = imgUrlCache[id]; } // 命中缓存直接显示（不 return：老图压缩检查仍需走 dbGetImage）
      getImageURL(id).then(function (url) {
        if (myToken !== openToken) return; // 已切到别的笔记，丢弃过期结果
        if (url && img.isConnected) img.src = url;
      });
      dbGetImage(id).then(function (rec) {
        if (myToken !== openToken) return; // 过期结果不回写
        if (!rec) return;
        // 老图一次性压缩（v1.6.0 前插入的全分辨率图）：首次打开解码查尺寸并压缩，
        // 之后带 compressed 标记直接跳过；压缩失败也标记，避免每次打开重复解码
        var chain = rec.compressed ? Promise.resolve() :
          maybeShrinkOldImage(rec, img, id, myToken).catch(function () {
            if (rec) { rec.compressed = true; dbPutImage(rec).catch(function () {}); }
          });
        chain.then(function () {
          if (myToken !== openToken) return;
          if (rec.pos === undefined) {
            rec.pos = idx;
            return dbPutImage(rec);
          }
          if (rec.starred && img.isConnected) {
            img.classList.add('starred'); // 库里标记了重点 → 恢复样式
            renderImageStrip();
          }
        }).catch(function () { /* 补写失败静默 */ });
      }).catch(function () { /* 读取失败静默 */ });
    });
    renderImageStrip(myToken);
  }

  function renderImageStrip(myToken) {
    if (myToken === undefined) myToken = openToken;
    var ids = [];
    var seen = {};
    Array.prototype.forEach.call(editorEl.querySelectorAll('img[data-img-id]'), function (img) {
      var id = img.dataset.imgId;
      if (!seen[id]) { seen[id] = true; ids.push(id); }
    });

    stripEl.innerHTML = '';
    stripEl.style.display = ids.length ? 'flex' : 'none';

    var token = ++stripRenderToken;
    ids.forEach(function (id) {
      getImageURL(id).then(function (url) {
        // 双重校验：本条渲染已被更新，或已切换笔记，都丢弃过期结果
        if (!url || token !== stripRenderToken || myToken !== openToken) return;
        var wrap = document.createElement('div');
        wrap.className = 'img-thumb';
        var srcImg = editorEl.querySelector('img[data-img-id="' + id + '"]');
        if (srcImg && srcImg.classList.contains('starred')) wrap.classList.add('starred'); // 缩略图同步星标

        var img = document.createElement('img');
        img.src = url;
        img.alt = '便签图片';

        wrap.appendChild(img);
        stripEl.appendChild(wrap);
      });
    });
  }

  // 删除便签时清理其图片，并回收已生成的 objectURL
  /* ---------- 导出 / 导入 ---------- */

  function closeMenu() {
    menuPop.classList.remove('open');
    var mb = document.getElementById('menu-btn');
    if (mb) mb.classList.remove('open'); // 同步移除激活高亮
  }

  // Blob → base64（不带 data: 前缀），用 FileReader
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result);
        resolve(s.slice(s.indexOf(',') + 1));
      };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsDataURL(blob);
    });
  }

  // base64 → Blob，用 atob + Uint8Array
  function base64ToBlob(b64, mime) {
    var bin = atob(String(b64 || ''));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || 'application/octet-stream' });
  }

  function fileToText(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsText(file);
    });
  }

  // 核心导出：只导出 noteIds 里的笔记及其对应图片；filePrefix 决定文件名前缀
  function exportNotes(noteIds, filePrefix) {
    var idSet = {};
    (noteIds || []).forEach(function (id) { idSet[id] = true; });
    return openDB().then(function (db) {
      return Promise.all([
        reqAsPromise(db.transaction(STORE).objectStore(STORE).getAll()),
        reqAsPromise(db.transaction(IMAGES).objectStore(IMAGES).getAll())
      ]);
    }).then(function (all) {
      var noteRecs = all[0].filter(function (n) { return idSet[n.id]; }).map(normalizeNote);
      var imgRecs = all[1].filter(function (g) { return g.noteId && idSet[g.noteId]; });
      return Promise.all(imgRecs.map(function (rec) {
        return blobToBase64(rec.blob).then(function (b64) {
          return {
            id: rec.id, noteId: rec.noteId, mime: rec.mime, dataBase64: b64,
            pos: rec.pos, createdAt: rec.createdAt, // 附加字段，恢复时保留图片顺序
            starred: rec.starred === true // 保留重点标注
          };
        });
      })).then(function (imgs) {
        var payload = {
          version: 2, // v2：包含待办字段；导入侧兼容 version 1
          exportedAt: new Date().toISOString(),
          notes: noteRecs.map(function (n) {
            return {
              id: n.id, content: n.content, createdAt: n.createdAt, updatedAt: n.updatedAt,
              type: n.type, dueAt: n.dueAt, doneAt: n.doneAt,
              pinnedAt: n.pinnedAt, color: n.color, starred: n.starred,
              deletedAt: n.deletedAt, deletedFrom: n.deletedFrom, // 回收箱状态跨备份保留
              order: n.order // 拖拽排序字段
            };
          }),
          images: imgs
        };
        var d = new Date();
        var stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
        var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filePrefix + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      });
    }).catch(function () { alert('导出失败，请重试'); });
  }

  // ⋮ 菜单「导出」= 导出全部
  function doExport() {
    closeMenu();
    exportNotes(notes.map(function (n) { return n.id; }), 'notes-backup-');
  }

  function doImport() {
    closeMenu();
    importInput.click();
  }

  function validImportPayload(p) {
    return !!(p && typeof p === 'object' && (p.version === 1 || p.version === 2) &&
              Array.isArray(p.notes) &&
              (p.images === undefined || Array.isArray(p.images)));
  }

  function handleImportFile(file) {
    if (!file) return;
    fileToText(file).then(function (text) {
      var payload = JSON.parse(text); // 解析失败走 catch
      if (!validImportPayload(payload)) {
        alert('文件格式不正确，导入已取消');
        return;
      }
      var now = Date.now();
      var noteRecs = payload.notes.filter(function (n) {
        return n && typeof n.id === 'string';
      }).map(function (n) {
        // version 1 旧备份缺待办字段，按默认值补齐（dueAt/doneAt 为 null）
        var due = (payload.version >= 2 && typeof n.dueAt === 'number') ? n.dueAt : null;
        var done = (payload.version >= 2 && typeof n.doneAt === 'number') ? n.doneAt : null;
        return normalizeNote({
          id: n.id,
          content: typeof n.content === 'string' ? n.content : '',
          createdAt: Number(n.createdAt) || now,
          updatedAt: Number(n.updatedAt) || Number(n.createdAt) || now,
          type: n.type === 'todo' ? 'todo' : 'note',
          dueAt: due,
          doneAt: done,
          pinnedAt: (payload.version >= 2 && 'pinnedAt' in n && n.pinnedAt !== undefined) ? n.pinnedAt : null,
          color: (payload.version >= 2 && 'color' in n && n.color !== undefined) ? n.color : null,
          starred: (payload.version >= 2 && n.starred === true),
          deletedAt: (payload.version >= 2 && typeof n.deletedAt === 'number') ? n.deletedAt : null,
          deletedFrom: (payload.version >= 2 && (n.deletedFrom === 'manual' || n.deletedFrom === 'auto')) ? n.deletedFrom : null,
          order: typeof n.order === 'number' ? n.order : null // 拖拽排序字段（旧备份无则回退按创建时间）
        });
      });
      var imgRecs = (payload.images || []).filter(function (g) {
        return g && typeof g.id === 'string' && typeof g.dataBase64 === 'string';
      }).map(function (g) {
        return {
          id: g.id,
          noteId: typeof g.noteId === 'string' ? g.noteId : null,
          mime: typeof g.mime === 'string' ? g.mime : 'application/octet-stream',
          blob: base64ToBlob(g.dataBase64, g.mime),
          pos: Number(g.pos) || 0,
          createdAt: Number(g.createdAt) || now,
          starred: g.starred === true // 保留重点标注（旧备份无此字段默认 false）
        };
      });
      return openDB().then(function (db) {
        // 同一事务写入两个 store；put 天然按 id 覆盖，新 id 直接新增
        return new Promise(function (resolve, reject) {
          var tx = db.transaction([STORE, IMAGES], 'readwrite');
          var ns = tx.objectStore(STORE);
          var is = tx.objectStore(IMAGES);
          noteRecs.forEach(function (n) { ns.put(n); });
          imgRecs.forEach(function (g) { is.put(g); });
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      }).then(function () {
        return dbGetAll().then(function (arr) {
          notes = arr;
          backfillOrder(); // 导入后补齐缺失的 order（旧备份/无 order 字段的记录）
          renderList();
          alert('导入了 ' + noteRecs.length + ' 条笔记，' + imgRecs.length + ' 张图片');
        });
      });
    }).catch(function () {
      alert('导入失败：文件不是合法的备份 JSON');
    });
  }

  /* ---------- 图片裁剪（选图后全屏裁剪，确认后才插入；逻辑独立于查看器） ---------- */

  var cropEl = $('crop-overlay');
  var cropStageEl = $('crop-stage');
  var cropClipEl = $('crop-clip');
  var cropImgEl = $('crop-img');
  var cropFrameEl = $('crop-frame');
  var cropOkBtn = $('crop-ok');
  var cropQueue = [];   // 待裁剪队列（{img, file, noteId}）
  var cropBusy = false; // 正在裁剪（防重入与队列调度）
  var cropBusyTimer = null; // cropBusy 超时自愈定时器
  function resetCropBusy() {
    cropBusy = false;
    if (cropBusyTimer) { clearTimeout(cropBusyTimer); cropBusyTimer = null; }
  }
  function armCropBusyTimer() {
    if (cropBusyTimer) clearTimeout(cropBusyTimer);
    cropBusyTimer = setTimeout(function () {
      if (cropBusy) { console.warn('[crop] cropBusy 超时 30s 自愈重置'); resetCropBusy(); }
    }, 30000);
  }
