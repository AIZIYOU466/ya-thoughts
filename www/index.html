  resetCropBusy();
  var cropSkipped = 0;  // 本批被取消的张数（队列结束时 toast 提示）
  var cropData = null;  // 当前裁剪上下文：{img, job, baseW, baseH, scale, tx, ty, minScale, frame}
  var cropTouch = null; // 手势状态：{mode:'pinch'|'pan', startDist, startScale, lastX, lastY}

  // createObjectURL → Image 元素（拿自然尺寸；同时作为裁剪与 canvas 的数据源）
  // 大图自动压缩到长边 ≤ 1920px，避免 WebView 解码大 dataURL 静默失败
  function readImageElement(file) {
    return new Promise(function (resolve, reject) {
      var blobUrl = URL.createObjectURL(file);
      var timer = setTimeout(function () {
        URL.revokeObjectURL(blobUrl);
        reject(new Error('timeout'));
      }, 20000);
      var img = new Image();
      img.onerror = function () {
        clearTimeout(timer);
        URL.revokeObjectURL(blobUrl);
        reject(new Error('decode'));
      };
      img.onload = function () {
        clearTimeout(timer);
        var naturalW = img.naturalWidth, naturalH = img.naturalHeight;
        if (naturalW <= 1920 && naturalH <= 1920) {
          URL.revokeObjectURL(blobUrl);
          resolve(img);
          return;
        }
        // 长边超 1920 → canvas 压缩到 1920，质量 0.85
        var scale = 1920 / Math.max(naturalW, naturalH);
        var cw = Math.round(naturalW * scale);
        var ch = Math.round(naturalH * scale);
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(blobUrl);
        canvas.toBlob(function (blob) {
          if (!blob) { resolve(img); return; }
          var compUrl = URL.createObjectURL(blob);
          var compImg = new Image();
          compImg.onload = function () { resolve(compImg); };
          compImg.onerror = function () { resolve(img); };
          compImg.src = compUrl;
        }, 'image/jpeg', 0.85);
      };
      img.src = blobUrl;
    });
  }

  function cropInitData(job) {
    var img = job.img;
    var sw = cropStageEl.clientWidth, sh = cropStageEl.clientHeight;
    var fit = Math.min(sw / img.naturalWidth, sh / img.naturalHeight) * 0.92; // contain 92%，初始已覆盖裁剪框
    cropImgEl.style.width = Math.round(img.naturalWidth * fit) + 'px';
    cropImgEl.style.height = Math.round(img.naturalHeight * fit) + 'px';
    cropData = {
      img: img, job: job,
      baseW: img.naturalWidth * fit, baseH: img.naturalHeight * fit,
      scale: 1, minScale: 0.5,
      tx: (sw - img.naturalWidth * fit) / 2,
      ty: (sh - img.naturalHeight * fit) / 2,
      frame: null
    };
  }

  // 裁剪框：比例 + 尺寸 + 位置（中心略上移，给底部工具栏让位）；同时算出最小缩放
  function layoutCropFrame() {
    var d = cropData;
    var sw = cropStageEl.clientWidth, sh = cropStageEl.clientHeight;
    var r = d.ratio === 0 ? d.img.naturalWidth / d.img.naturalHeight : d.ratio;
    var fw = Math.min(sw * 0.62, sh * 0.5);
    var fh = fw / r;
    var fx = (sw - fw) / 2;
    var fy = Math.max(0, sh * 0.45 - fh / 2); // 中心在 45% 高度
    cropFrameEl.style.width = fw + 'px';
    cropFrameEl.style.height = fh + 'px';
    cropFrameEl.style.left = fx + 'px';
    cropFrameEl.style.top = fy + 'px';
    d.frame = { x: fx, y: fy, w: fw, h: fh };
    // 裁剪窗口：只在裁剪框矩形内显示图片（舞台坐标 → 包裹层 clip，切换比例时才变）
    cropClipEl.style.clipPath =
      'inset(' + fy + 'px ' + (sw - fx - fw) + 'px ' + (sh - fy - fh) + 'px ' + fx + 'px)';
    d.minScale = Math.max(0.5, Math.max(fw / d.baseW, fh / d.baseH)); // 保证裁剪框始终有图
  }

  function applyCropTransform() {
    if (!cropData) return;
    cropImgEl.style.transform =
      'translate(' + cropData.tx + 'px,' + cropData.ty + 'px) scale(' + cropData.scale + ')';
  }

  // 平移钳制：图片显示区必须覆盖整个裁剪框；触到边界时轻微震动提示
  function clampCropPan(vibrate) {
    var d = cropData, f = d.frame;
    var imgW = d.baseW * d.scale, imgH = d.baseH * d.scale;
    var nx = d.tx, ny = d.ty;
    if (imgW >= f.w) nx = Math.min(f.x, Math.max(f.x + f.w - imgW, d.tx));
    else nx = f.x + (f.w - imgW) / 2;
    if (imgH >= f.h) ny = Math.min(f.y, Math.max(f.y + f.h - imgH, d.ty));
    else ny = f.y + (f.h - imgH) / 2;
    if (vibrate && (nx !== d.tx || ny !== d.ty) && navigator.vibrate) {
      try { navigator.vibrate(10); } catch (e) {} // 到边轻震提示
    }
    d.tx = nx; d.ty = ny;
  }

  function openCropUI(job) {
    cropEl.classList.add('open'); // 先显示再量尺寸：display:none 时 clientWidth/Height 为 0
    document.body.style.overflow = 'hidden';
    cropInitData(job);
    cropData.ratio = 1; // 默认 1:1；高亮第一个比例按钮
    Array.prototype.forEach.call(document.querySelectorAll('#crop-ratios .crop-ratio-btn'), function (b) {
      b.classList.toggle('active', b.dataset.ratio === '1:1');
    });
    layoutCropFrame();
    applyCropTransform();
    cropImgEl.src = job.img.src; // 复用刚才解码的 DataURL
  }
  function hideCropUI() {
    cropEl.classList.remove('open');
    cropImgEl.removeAttribute('src');
    if (cropClipEl) cropClipEl.style.clipPath = ''; // 复位裁剪窗口，避免下次残留旧矩形
    cropData = null;
    cropTouch = null;
    document.body.style.overflow = '';
  }

  function nextCropJob() {
    cropQueue.shift();
    if (cropQueue.length) { armCropBusyTimer(); openCropUI(cropQueue[0]); return; }
    resetCropBusy();
    if (cropSkipped > 0) {
      showUndoToast('已跳过 ' + cropSkipped + ' 张图片');
      cropSkipped = 0;
    }
  }

  // 取消：跳过当前张，继续处理队列；队列空时结束

    if (!cropBusy || !cropEl.classList.contains('open')) return;
    cropSkipped++;
    hideCropUI();
    nextCropJob();
  }

  // 确认：裁剪框屏幕坐标 → 图片原始坐标 → Canvas → toBlob(JPEG 0.88) → 走现有插入链路
  // 修复卡顿：先截取上下文并立即关闭界面，重活（drawImage + 编码）挪到下一任务异步执行；
  // 输出长边封顶 2560px，避免大图裁剪后 IndexedDB 写入与渲染卡顿（下采样由 drawImage 完成）
  function confirmCrop() {
    var d = cropData;
    if (!d || !d.frame) return;
    var job = d.job;                       // 提前快照：hideCropUI 会清 cropData
    var img = d.img;
    var f = d.frame;
    var imgW = d.baseW * d.scale, imgH = d.baseH * d.scale;
    var rx = f.x - d.tx, ry = f.y - d.ty;  // 裁剪框相对图片显示区左上角
    var sx = rx / imgW * img.naturalWidth;
    var sy = ry / imgH * img.naturalHeight;
    var sw = f.w / imgW * img.naturalWidth;
    var sh = f.h / imgH * img.naturalHeight;
    var cw = Math.max(1, Math.round(sw)), chh = Math.max(1, Math.round(sh));
    var cap = 2560 / Math.max(cw, chh);   // 输出长边 ≤ 2560px
    if (cap < 1) { cw = Math.round(cw * cap); chh = Math.round(chh * cap); }
    hideCropUI(); // 立即响应：确认后界面马上关闭，不等到编码结束
    armCropBusyTimer(); // 启动 30s 超时自愈
    setTimeout(function () { // 重活挪出点击回调，不阻塞主线程
      try {
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = chh;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, chh);
        var done = function (blob) {
          if (currentId === job.noteId) insertImageBlob(blob, 'image/jpeg'); // 已切笔记则放弃插入
          nextCropJob();
        };

          canvas.toBlob(function (b) {
            if (b) done(b);
            else done(dataURLtoBlob(canvas.toDataURL('image/jpeg', 0.88))); // 罕见 null 兜底
          }, 'image/jpeg', 0.88);
        } else {
          done(dataURLtoBlob(canvas.toDataURL('image/jpeg', 0.88)));
        }

        nextCropJob();
      }

  // toBlob 不可用（旧内核）时的回退：toDataURL → Blob
  function dataURLtoBlob(dataURL) {
    var i = dataURL.indexOf(',');

    for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);

  // 裁剪手势：单指平移 + 双指捏合（0.5~3x，且不小于覆盖裁剪框所需的最小值）

    } else if (e.touches.length === 1 && !cropTouch) {

      var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;

      cropData.ty += y - cropTouch.lastY;
      cropTouch.lastX = x; cropTouch.lastY = y;

      cropTouch.lastY = e.touches[0].clientY;

    var btn = e.target && e.target.closest ? e.target.closest('#crop-ratios .crop-ratio-btn') : null;
    if (!btn) return;
    if (!cropData) return;
    var label = btn.dataset.ratio;
    cropData.ratio = label === 'orig' ? 0 :
      parseFloat(label.split(':')[0]) / parseFloat(label.split(':')[1]);
    Array.prototype.forEach.call(document.querySelectorAll('#crop-ratios .crop-ratio-btn'), function (b) {
      b.classList.toggle('active', b === btn);
    });

    clampCropPan(false);
    applyCropTransform();
  });

  /* ---------- 图片交互：放大查看 / 长按删除 ---------- */

  var viewerEl = $('img-viewer');
  var viewerImgEl = $('viewer-img');
  var viewerCloseEl = $('viewer-close');
  var vScale = 1, vTx = 0, vTy = 0;            // 查看器当前缩放与平移
  var pinchStartDist = 0, pinchStartScale = 1; // 双指手势起点
  var vLastX = 0, vLastY = 0;                  // 单指平移上一次位置
  var vStartX = 0, vStartY = 0;                // 本轮触摸起点，用于区分点击与拖动
  var pinchMode = false, vMoved = false;
  var vGesture = 'idle';                       // 手势状态机：idle/pinching/dragging/doubletap-pending
  var vTapTimer = null;                        // 双击等待定时器（300ms 无第二次则按单击处理）
  var vLastTapT = 0, vLastTapX = 0, vLastTapY = 0; // 上一次点击的时间与位置
  var vPendingClose = false;                   // 单击确认后关闭查看器（由 300ms 超时统一执行）
  var vAnimating = false;                      // 双击缩放动画进行中（期间忽略新手势）
  var vAnimStartT = 0;                         // 动画开始时间戳（入口自愈：锁超 400ms 强制解除）
  var vOpenedAt = 0;                           // 查看器打开时间戳（打开后 400ms 内忽略关闭点击，防双击竞态秒关）
  var vDblAnimTimer = null;                    // 动画锁兜底移除定时器
  var lpTimer = null, lpImg = null, lpX = 0, lpY = 0;
  var longPressFired = false; // 长按触发后抑制其后的 click，避免误放大

  function applyViewerTransform() {
    viewerImgEl.style.transform = 'translate(' + vTx + 'px,' + vTy + 'px) scale(' + vScale + ')';
  }

  function resetViewerTransform() {
    vScale = 1; vTx = 0; vTy = 0;
    vGesture = 'idle';
    clearTimeout(vTapTimer); vTapTimer = null;
    clearTimeout(vDblAnimTimer); vDblAnimTimer = null;
    vLastTapT = 0; vPendingClose = false; vAnimating = false; vMoved = false;
    viewerImgEl.classList.remove('v-anim');
    applyViewerTransform();
  }

  var viewerChecked = {};      // blob src → 已做尺寸检查（会话级去重：同一 URL 只查一次）
  var pendingViewerUrl = null; // 兜底压缩产生的临时 objectURL，关闭查看器时回收

  function openViewer(src) {
    if (!src) return;
    if (viewerEl.classList.contains('open') && viewerImgEl.getAttribute('src') === src) return; // 幂等：已开同图不重复
    // 兜底尺寸防护：blob URL 且本会话未查过 → 快速尺寸检查，长边 > 1920 先压缩再打开
    // （覆盖 hydrate 压缩尚未完成时点开大图的竞态；已压缩图查一次后置标，后续直接开）
    if (src.indexOf('blob:') === 0 && !viewerChecked[src]) {
      viewerChecked[src] = true;
      if (typeof createImageBitmap === 'function') {
        fetchBlobByUrl(src).then(function (blob) {
          if (!blob) { revealViewer(src); return; }
          return createImageBitmap(blob).then(function (bmp) {
            var w = bmp.width, h = bmp.height;
            if (bmp.close) bmp.close();
            if (w <= 1920 && h <= 1920) { revealViewer(src); return; }
            showUndoToast('加载中…', 3000);
            return compressBlobToBlob(blob).then(function (newBlob) {
              if (!newBlob) { revealViewer(src); return; }
              pendingViewerUrl = URL.createObjectURL(newBlob); // 临时压缩图，仅本次查看

            });
          });
        }).catch(function () { revealViewer(src); });
        return;
      }
      // 旧内核无 createImageBitmap：直接打开 + 短暂 loading 提示
      showUndoToast('加载中…');
      revealViewer(src);
      return;
    }

  }

  function revealViewer(src) {
    viewerImgEl.src = src;
    resetViewerTransform();
    viewerEl.classList.add('open');
    vOpenedAt = Date.now();
    document.body.style.overflow = 'hidden'; // 查看期间禁止页面滚动
  }

  function closeViewer() {
    resetViewerTransform(); // 关闭时彻底清理动画/手势状态，防止 vAnimating 卡死
    viewerEl.classList.remove('open');
    viewerImgEl.removeAttribute('src');
    document.body.style.overflow = '';
    if (pendingViewerUrl) { URL.revokeObjectURL(pendingViewerUrl); pendingViewerUrl = null; } // 回收临时压缩图
  }

  // 从事件目标向上找 <img>，只在自己所在的容器（编辑器/缩略图条）内找
  function imgFromEvent(e, root) {
    var t = e.target;
    while (t && t !== root) {
      if (t.nodeType === 1 && t.tagName === 'IMG') return t;
      t = t.parentNode;
    }
    return null;
  }

  function touchDist(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // 删除正文图片：DOM、IndexedDB、objectURL 三处清理，并触发自动保存
  // 确认框与其他删除入口统一走 confirmDialog（是/否），成功后统一 toast
  function deleteInlineImage(img) {
    var id = img.dataset && img.dataset.imgId;
    if (!id) return; // 缩略图等无 id 的图片不参与删除

  function openImgMenu(img) {

  function toggleImageStar(img) {
    var id = img.dataset && img.dataset.imgId;
    if (!id) return;
    var on = !img.classList.contains('starred');
    img.classList.toggle('starred', on);
    var patch = { id: id, starred: on };
    if (img.dataset.imgNoteId) patch.noteId = img.dataset.imgNoteId;
    dbPutImage(patch).then(function () {

  // 保存时把编辑器内每张图的 starred 同步进库（整段同步，不一致才写）
  function syncImagesStars() {
    var imgs = editorEl.querySelectorAll('img[data-img-id]');
    var seen = {};
    var jobs = [];
    Array.prototype.forEach.call(imgs, function (img) {
      var id = img.dataset.imgId;
      if (!id || seen[id]) return;
      seen[id] = true;
      var wanted = img.classList.contains('starred');
      jobs.push(dbGetImage(id).then(function (rec) {
        if (!rec || !!rec.starred === wanted) return;
        var patch = { id: id, starred: wanted };
        if (rec.noteId) patch.noteId = rec.noteId;
        return dbPutImage(patch);
      }).catch(function () { /* 存储失败静默 */ }));
    });
    return Promise.all(jobs);
  }

  var starredFlagCache = {};

    if (noteId in starredFlagCache) return Promise.resolve(starredFlagCache[noteId]);
    return dbGetAllImages().then(function (arr) { 
      var has = arr.some(function (g) { return g.noteId === noteId && g.starred === true; });
      starredFlagCache[noteId] = has;
      return has;
    }).catch(function () { return false; });
  }

  function cleanPref(key) { return localStorage.getItem(key) === '1'; } // 缺省 = 关闭

  /* 自动清理结果弹窗：最多列 10 条，超出折叠成「…还有 N 条」 */
  var cleanResultMask = $('clean-result-mask');

  /* ============ 回收箱（⋯ 菜单进入；软删除便签保留 3 天，超期在启动时清理） ============ */
  var binMaskEl = $('bin-mask');
  var binListEl = $('bin-list');
  var binDirty = false; // 恢复/清空后，关闭时刷新列表
  var BIN_KEEP_MS = 3 * 24 * 60 * 60 * 1000; // 回收箱保留 3 天

  // 恢复：清掉删除标记；置顶便签仍是最高级，恢复条在置顶之下排最前——
  // 默认按修改时间排序时把 updatedAt 提到现在（普通区最前/无截止待办最前），
  // 自定义排序下用 order=-1 把其放到普通区最前（下次拖拽会整体重写 order，无残留）。
  function restoreNote(id) {
    var note = null;
    for (var i = 0; i < notes.length; i++) if (notes[i].id === id) { note = notes[i]; break; }
    if (!note || !isBinNote(note)) return;
    note.deletedAt = null;
    note.deletedFrom = null;
    note.updatedAt = Date.now();
    if (sortBy === 'custom') note.order = -1;
    dbPut(note).catch(function () { /* 存储失败静默 */ });
    if (isTodo(note)) scheduleNoteNotification(note); // 恢复待办的系统通知
    binDirty = true;
    closeBin();
  }

  // 渲染回收箱：deletedAt 倒序（binNotes 已排好）；已超 3 天的条目不再展示（启动时已物理清理）
  function renderBin() {
    var now = Date.now();
    var items = binNotes().filter(function (n) { return n.deletedAt + BIN_KEEP_MS > now; });
    binListEl.innerHTML = '';
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'bin-empty';
      empty.innerHTML = '<div class="bin-empty-icon"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></svg></div>' +
        '<p>回收箱是空的</p><span>删除的便签会在这里保留 3 天</span>';
      binListEl.appendChild(empty);
      return;
    }
    items.forEach(function (n) {
      var row = document.createElement('div');
      row.className = 'bin-item';
      row.dataset.id = n.id;
      var info = document.createElement('div');
      info.className = 'bin-info';
      var t = document.createElement('div');
      t.className = 'bin-title';
      t.textContent = titleOf(n);
      var m = document.createElement('div');
      m.className = 'bin-meta';
      var how = n.deletedFrom === 'auto' ? '自动清理于 ' : '手动删除于 ';
      var remain = Math.max(1, Math.ceil((n.deletedAt + BIN_KEEP_MS - now) / (24 * 60 * 60 * 1000)));
      m.textContent = how + relativeTime(n.deletedAt) + ' · 还剩 ' + remain + ' 天';
      info.appendChild(t);
      info.appendChild(m);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bin-restore';
      btn.textContent = '恢复';
      row.appendChild(info);
      row.appendChild(btn);
      binListEl.appendChild(row);
    });
  }

  function closeBin() {
    binMaskEl.classList.remove('open');
    if (binDirty) { binDirty = false; renderList(); }
  }

  // 启动时物理清理：回收箱里超 3 天的便签永久删除（连带图片 Blob，超期不可恢复，静默无提示）
  function purgeExpiredBinItems() {
    var cutoff = Date.now() - BIN_KEEP_MS;
    var doomed = [];
    notes.forEach(function (n) { if (isBinNote(n) && n.deletedAt < cutoff) doomed.push(n.id); });
    if (!doomed.length) return;
    dbDeleteNotesWithImages(doomed).then(function (imgIds) {
      imgIds.forEach(function (id) {
        if (imgUrlCache[id]) {
          URL.revokeObjectURL(imgUrlCache[id]);
          delete imgUrlCache[id];
        }
      });
      notes = notes.filter(function (n) { return doomed.indexOf(n.id) === -1; }); // 物理删除
    }).catch(function () { /* 存储失败：下次启动再试 */ });
  }

  // App 启动时执行一次：今天 20:00 已过、且今天还没清理过才动手（无后台定时任务，打开即检查）。
  // v2：自动清理改为软删除进回收箱（deletedFrom='auto'）并弹窗告知；图片待到超期才物理删除。
  function runAutoClean() {
    var cleanDone = cleanPref(CLEAN_DONE_KEY), cleanExpired = cleanPref(CLEAN_EXPIRED_KEY);
    if (!cleanDone && !cleanExpired) return;
    var now = new Date();
    if (now.getHours() * 60 + now.getMinutes() < 20 * 60) return; // 未到 20:00
    var ymd = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    if (localStorage.getItem(CLEAN_LAST_KEY) === ymd) return; // 今天已清理过
    var doneNotes = [], expiredNotes = []; // 条件互斥：已完成优先，过期不重复计数；回收箱里的跳过
    notes.forEach(function (n) {
      if (!isTodo(n) || isBinNote(n)) return;
      if (isDone(n)) { if (cleanDone) doneNotes.push(n); }
      else if (isOverdue(n) && cleanExpired) expiredNotes.push(n);
    });
    if (!doneNotes.length && !expiredNotes.length) { setCleanLastDate(ymd); return; } // 无可清理项，仅记录日期
    doneNotes.concat(expiredNotes).forEach(function (n) { markNoteDeleted(n.id, 'auto'); }); // 软删 + 取消通知
    setCleanLastDate(ymd);
    renderList(); // 计数 / 空态由 renderList 统一处理
    showCleanResult(doneNotes, expiredNotes); // 结果弹窗（含回收箱找回提示）
  }

  // 双击判定：两次点击 <300ms 且位移 <30px；双击缩放动画期间忽略新手势
  viewerEl.addEventListener('touchstart', function (e) {
    if (vAnimSelfHeal()) return; // 双击动画进行中：忽略新手势（锁超 400ms 入口自愈解除）
    vMoved = false;
    vStartX = e.touches[0].clientX;
    vStartY = e.touches[0].clientY;
    if (e.touches.length === 2) {
      vGesture = 'pinching';
      clearTimeout(vTapTimer); vTapTimer = null; // 捏合开始：取消双击等待
      vLastTapT = 0; vPendingClose = false;
      pinchMode = true;
      pinchStartDist = touchDist(e.touches);
      pinchStartScale = vScale;
    } else {
      vLastX = e.touches[0].clientX;
      vLastY = e.touches[0].clientY;
      if (vGesture === 'idle') vGesture = vScale > 1 ? 'dragging' : 'idle';
      // 'doubletap-pending' 保持：第二指按下后若 touchmove 位移 >10px 会取消等待，up 时判定双击
    }
  }, { passive: false });
  viewerEl.addEventListener('touchmove', function (e) {
    e.preventDefault(); // touch-action:none 的兑底，确保页面不滚动
    if (vAnimSelfHeal()) return;
    if (e.touches.length === 2) {
      vMoved = true;
      var s = pinchStartScale * touchDist(e.touches) / pinchStartDist;
      vScale = Math.min(5, Math.max(1, s));
      if (vScale === 1) { vTx = 0; vTy = 0; }
      applyViewerTransform();
    } else if (e.touches.length === 1) {
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      if (vGesture === 'doubletap-pending') {
        // 等第二次点击时手指动了（>10px）：取消双击等待，转拖拽（放大态）或闲置
        if (Math.abs(x - vLastTapX) > 10 || Math.abs(y - vLastTapY) > 10) {
          clearTimeout(vTapTimer); vTapTimer = null;
          vPendingClose = false; vLastTapT = 0;
          vGesture = vScale > 1 ? 'dragging' : 'idle';
        } else {
          return; // 轻微抖动不计
        }
      }
      if (vGesture === 'dragging' && !pinchMode && vScale > 1) {
        if (Math.abs(x - vStartX) > 10 || Math.abs(y - vStartY) > 10) vMoved = true;
        vTx += x - vLastX;
        vTy += y - vLastY;
        vLastX = x; vLastY = y;
        applyViewerTransform();
      }
    }
  }, { passive: false });
  viewerEl.addEventListener('touchend', function (e) {
    if (vAnimSelfHeal()) return; // 动画锁未解除（含自愈后仍锁定）：不处理 touchend，防误走双击判定
    if (e.touches.length < 2) pinchMode = false;
    if (vGesture === 'pinching' && e.touches.length === 1) { // 双指抬起一根后继续单指平移
      vGesture = vScale > 1 ? 'dragging' : 'idle';
      vLastX = e.touches[0].clientX;
      vLastY = e.touches[0].clientY;
      vStartX = vLastX; vStartY = vLastY;
      return;
    }
    if (e.touches.length === 0 && vGesture !== 'pinching' && !vMoved) {
      var ct = e.changedTouches[0];
      var now = Date.now();
      var tx = ct.clientX, ty = ct.clientY;
      if (vGesture === 'doubletap-pending' && vLastTapT &&
          now - vLastTapT < 300 &&
          Math.abs(tx - vLastTapX) < 30 && Math.abs(ty - vLastTapY) < 30) {
        // 双击：执行缩放动画；置 vMoved 消费随后的合成 click，防误关查看器
        clearTimeout(vTapTimer); vTapTimer = null;
        vPendingClose = false; vLastTapT = 0;
        vGesture = 'idle';
        vMoved = true;
        toggleDoubleZoom(tx, ty);
      } else {
        // 第一次点击：进入等待第二次；300ms 内无第二次则按单击关闭查看器
        vLastTapT = now; vLastTapX = tx; vLastTapY = ty;
        vGesture = 'doubletap-pending';
        vPendingClose = true;
        clearTimeout(vTapTimer);
        vTapTimer = setTimeout(function () {
          vTapTimer = null;
          vGesture = 'idle';
          if (vPendingClose && !vMoved) closeViewer();
          vPendingClose = false;
        }, 300);
      }
    }
  }, { passive: false });

  // 双击缩放动画：<1.5x → 放大到 2.5x（双击点保持原位）；>=1.5x → 缩回 1x 复位
  function toggleDoubleZoom(tapX, tapY) {
    if (vAnimating) return;
    if (vScale < 1.5) {
      var ns = 2.5;
      vTx = tapX - (tapX - vTx) / vScale * ns;
      vTy = tapY - (tapY - vTy) / vScale * ns;
      vScale = ns;
    } else {
      vScale = 1; vTx = 0; vTy = 0;
    }
    viewerImgEl.classList.add('v-anim'); // 300ms 过渡曲线
    vAnimating = true;
    vAnimStartT = Date.now();
    applyViewerTransform();
    clearTimeout(vDblAnimTimer);
    vDblAnimTimer = setTimeout(endViewerAnim, 320); // transitionend 兜底
  }
  function endViewerAnim() {
    vAnimating = false;
    viewerImgEl.classList.remove('v-anim'); // 必须尽快移除，避免拖累后续捏合/拖拽
  }
  // vAnimating 入口自愈：锁超 400ms 仍未解除（定时器被 WebView 节流/丢事件）则强制解除，锁定不可能残留
  function vAnimSelfHeal() {
    if (vAnimating && Date.now() - vAnimStartT > 400) endViewerAnim();
    return vAnimating;
  }
  // transitionend 优先触发则提前结束动画锁；transform 可能不变而不触发，320ms 定时器兜底
  viewerImgEl.addEventListener('transitionend', function (e) {
    if (e.propertyName === 'transform' && vAnimating) {
      clearTimeout(vDblAnimTimer);
      endViewerAnim();
    }
  });

  // 点遮罩任意位置或 × 关闭；缩放/平移后的合成 click 不触发关闭；双击等待期间不关闭（由 300ms 超时判定）
  viewerEl.addEventListener('click', function (e) {
    if (vMoved) { vMoved = false; return; }
    if (vGesture === 'doubletap-pending') return;
    if (Date.now() - vOpenedAt < 400) return; // 打开 400ms 内忽略关闭点击：防桌面双击/移动端快速二连击把刚开的查看器瞬间关掉
    if (e.target === viewerEl || e.target === viewerImgEl || e.target === viewerCloseEl) {
      closeViewer();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewerEl.classList.contains('open')) closeViewer();
    if (e.key === 'Escape' && cropEl.classList.contains('open')) cancelCrop(); // 裁剪界面：Esc = 取消
  });

  $('img-btn').addEventListener('click', function () {
    saveEditorRange(); // 弹出文件选择器前立刻保存当前光标位置
    imgInput.click();
  });
  imgInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(imgInput.files); // 快照，避免重置 input 清空 FileList
    imgInput.value = ''; // 立即重置，保证同一张图能重复上传
    handleImageFiles(files);
  });

  editorEl.addEventListener('input', function () {
    // 内存先行：立即把最新正文同步进 note 对象（不落库）→ 打字→返回不再有丢失窗口，
    // 列表卡片定向更新、blur/防抖/保底写入都基于这个已更新的对象。
    var note = noteById(currentId);
    if (note) {
      note.content = editorEl.innerHTML.replace(/ class="lp-dim"/g, ''); // 序列化成 HTML；长按反馈类不入库
      note.updatedAt = Date.now();
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commitSave, 1000); // 输入停止 1 秒后写库
    scheduleUndoSnapshot(); // 内容变化延迟 500ms 压入撤销快照（防抖）
    scheduleWordCount(); // 字数统计防抖 300ms
  });
  editorEl.addEventListener('blur', function () {
    // 编辑后点返回：blur 与 click 同一手势任务。写库已与 DOM 解耦（commitSave 只写
    // input 时同步更新的内存对象），此处延迟 450ms>320+80 落库，不阻塞滑出首帧；
    // backToList 还会用离开便签 id 显式重排一次最终写入并吞掉本定时器，blur 是否触发都不丢。
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commitSave, 450);
  });

  /* ---------- 底部常驻格式按钮：加粗 / 高亮（对保存的选区操作） ---------- */

  var fmtBoldBtn = $('fmt-bold');
  var fmtHiliteBtn = $('fmt-hilite');
  var fontsizeBtn = $('fontsize-btn');
  var fsPopEl = $('fs-pop');
  var savedSelection = null; // 最近一次编辑器内选区快照：点底部按钮时 contenteditable 已失焦，靠它恢复

  function editorSelection() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0);
    if (!editorEl.contains(r.commonAncestorContainer)) return null;
    return sel;
  }
  function fmtState(cmd) {
    try { return document.queryCommandState(cmd); } catch (e) { return false; }
  }

  // selectionchange 持续记录选区：编辑器内出现新选区就覆盖保存；
  // 选区在编辑器内被收起/取消则清空；选区落到编辑器外（如点底部按钮失焦）保持不变
  function saveSelection() {
    var sel = editorSelection();
    if (sel) {
      savedSelection = sel.getRangeAt(0).cloneRange();
    } else {
      var live = window.getSelection();
      if (live && live.anchorNode && editorEl.contains(live.anchorNode)) {
        // 例外：焦点刚落到 B/A 按钮上时（个别内核 pointerdown 阻断焦点转移失效），
        // 选区会塌陷成光标 —— 这是点按钮的副作用，不是用户主动取消，快照保留
        var ae = document.activeElement;
        var onFmtBtn = !!(ae && (ae.id === 'fmt-bold' || ae.id === 'fmt-hilite' || ae.id === 'fontsize-btn'));
        if (!onFmtBtn) savedSelection = null;
      }
    }
    updateFmtButtons();
  }

  // 无选区置灰（disabled），有选区可点击；.on 标记当前选区已应用该格式（再点一次取消）
  function updateFmtButtons() {
    var hasSel = !!savedSelection && editorView.classList.contains('active');
    fmtBoldBtn.disabled = !hasSel;
    fmtHiliteBtn.disabled = !hasSel;
    fontsizeBtn.disabled = !hasSel;
    refreshFmtStates();
    refreshFsState();
  }
  function refreshFmtStates() {
    if (!savedSelection) {
      fmtBoldBtn.classList.remove('on');
      fmtHiliteBtn.classList.remove('on');
      return;
    }
    fmtBoldBtn.classList.toggle('on', fmtState('bold'));
    var markOn = false;
    try { markOn = !!document.queryCommandState('hiliteColor'); } catch (e) {}
    if (!markOn) markOn = !!selMarkAncestor(); // 有些内核不支持 hiliteColor 状态查询：退回检查 <mark> 祖先
    fmtHiliteBtn.classList.toggle('on', markOn);
  }

  // 恢复保存的选区（先聚焦编辑器）；选区已失效（内容被替换等）则作废并返回 false
  function restoreSelection() {
    if (!savedSelection) return false;
    var sc = savedSelection.startContainer;
    if (!sc || !sc.isConnected || !editorEl.contains(sc)) {
      savedSelection = null;
      updateFmtButtons();
      return false;
    }
    try {
      editorEl.focus();
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedSelection);
      return true;
    } catch (e) {
      savedSelection = null;
      updateFmtButtons();
      return false;
    }
  }

  function execFmt(cmd, val) {
    if (!restoreSelection()) return; // 无可用选区：什么都不做（按钮无选区时本就置灰）
    document.execCommand(cmd, false, val || null);
    refreshFmtStates();
    editorEl.dispatchEvent(new Event('input', { bubbles: true })); // 触发自动保存与撤销快照
  }

  // 选区内找 mark 祖先（用于高亮 toggle 与状态兜底检测）
  function selMarkAncestor() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    var anc = sel.getRangeAt(0).commonAncestorContainer;
    var el = anc.nodeType === 1 ? anc : anc.parentNode;
    return el && el.closest ? el.closest('#editor mark') : null;
  }

  // execCommand('hiliteColor') 不可用时 fallback：手动把选区包进 <mark>
  function wrapSelectionInMark() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    var range = sel.getRangeAt(0);
    var mk = document.createElement('mark');
    mk.appendChild(range.extractContents());
    range.insertNode(mk);
    sel.removeAllRanges();
    var r2 = document.createRange();
    r2.selectNodeContents(mk);
    sel.addRange(r2); // 选区保留
  }

  // 取消高亮：把选区 intersect 到的所有 <mark> 拆开（子节点原位移回）
  function unwrapSelectionMarks() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    var range = sel.getRangeAt(0);
    var marks = Array.prototype.slice.call(editorEl.querySelectorAll('mark'));
    marks.forEach(function (mk) {
      if (!range.intersectsNode(mk)) return;
      var p = mk.parentNode;
      if (!p) return;
      while (mk.firstChild) p.insertBefore(mk.firstChild, mk);
      p.removeChild(mk);
    });
    sel.removeAllRanges();
    sel.addRange(range); // 选区保留
  }

  // 高亮 toggle：已是高亮 → 取消；否则 execCommand，失败则包 <mark>
  function toggleHighlight() {
    if (!restoreSelection()) return; // 先恢复保存的选区再操作，与 execFmt 同一思路
    var markEl = selMarkAncestor();
    var stateOn = fmtState('hiliteColor');
    if (markEl) {
      unwrapSelectionMarks();
    } else if (stateOn) {
      document.execCommand('hiliteColor', false, 'transparent');
    } else {
      var ok = false;
      try { ok = document.execCommand('hiliteColor', false, '#FFF3B0'); } catch (e) {}
      if (!ok) wrapSelectionInMark();
    }
    refreshFmtStates();
    editorEl.dispatchEvent(new Event('input', { bubbles: true }));
  }

  fmtBoldBtn.addEventListener('click', function () { execFmt('bold'); });
  fmtHiliteBtn.addEventListener('click', toggleHighlight);

  /* ---------- 字号：选区内找 span.fs-*，应用到当前保存的选区（Range 包裹，保留加粗/高亮嵌套） ---------- */

  // 从当前选区公共祖先向上找 span.fs-*（与 selMarkAncestor 同思路）
  function fsSpanInSelection() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    var anc = sel.getRangeAt(0).commonAncestorContainer;
    var el = anc.nodeType === 1 ? anc : anc.parentNode;
    return el && el.closest
      ? el.closest('#editor span.fs-small, #editor span.fs-normal, #editor span.fs-large, #editor span.fs-xlarge')
      : null;
  }

  // 应用字号：已有 span → 替换类名（正常＝移除 className 拆回原文）；无则 Range 包裹新 span
  function applyFontSize(level) {
    if (!restoreSelection()) return; // 恢复保存的选区（点按钮时光标/选区已失焦）；失效则什么都不做
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { hideFsPop(); return; }
    var span = fsSpanInSelection();
    if (span) {
      if (level === 'normal') {
        var p = span.parentNode;
        while (span.firstChild) p.insertBefore(span.firstChild, span); // 拆开 span，子节点（含 b/mark）原位移回
        p.removeChild(span);
      } else {
        span.className = 'fs-' + level; // 直接替换档位，无需先取消
      }
    } else if (level !== 'normal') {
      var range = sel.getRangeAt(0);
      var sp = document.createElement('span');
      sp.className = 'fs-' + level;
      sp.appendChild(range.extractContents()); // 把选中内容（含已有标签）整体包进 span，不破坏嵌套
      range.insertNode(sp);
      sel.removeAllRanges();
      var r2 = document.createRange();
      r2.selectNodeContents(sp);
      sel.addRange(r2); // 选区保留
    }
    refreshFsState();
    editorEl.dispatchEvent(new Event('input', { bubbles: true })); // 触发自动保存与撤销快照
    hideFsPop();
  }

  // 当前档位高亮：胶囊 .on + 面板对应档位 active；无 fs 类时显示"正常"选中
  function refreshFsState() {
    var lvl = null;
    if (savedSelection) {
      var anc = savedSelection.commonAncestorContainer;
      var el = anc.nodeType === 1 ? anc : anc.parentNode;
      var sp = el && el.closest
        ? el.closest('span.fs-small, span.fs-normal, span.fs-large, span.fs-xlarge')
        : null;
      if (sp) lvl = sp.className.indexOf('fs-xlarge') >= 0 ? 'xlarge'
        : sp.className.indexOf('fs-large') >= 0 ? 'large'
        : sp.className.indexOf('fs-small') >= 0 ? 'small' : 'normal';
    }
    fontsizeBtn.classList.toggle('on', !!lvl);
    var cur = lvl || 'normal';
    Array.prototype.forEach.call(fsPopEl.querySelectorAll('.fs-opt'), function (b) {
      b.classList.toggle('active', b.dataset.level === cur);
    });
  }

  function hideFsPop() { fsPopEl.classList.remove('open'); }
  function toggleFsPop() {
    if (fsPopEl.classList.contains('open')) { hideFsPop(); return; }
    refreshFsState(); // 打开时同步当前档位高亮
    fsPopEl.classList.add('open');
  }

  fontsizeBtn.addEventListener('click', toggleFsPop);
  fsPopEl.addEventListener('click', function (e) {
    var opt = e.target && e.target.closest ? e.target.closest('.fs-opt') : null;
    if (opt) applyFontSize(opt.dataset.level);
  });
  // 点击面板外部关闭（与菜单弹窗同款路由，按钮本身除外）
  document.addEventListener('click', function (e) {
    if (!fsPopEl.classList.contains('open')) return;
    if (fsPopEl.contains(e.target) || e.target === fontsizeBtn || fontsizeBtn.contains(e.target)) return;
    hideFsPop();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && fsPopEl.classList.contains('open')) hideFsPop();
  });

  // 按下不抢编辑器焦点，选区才不会丢（pointerdown 阻止焦点转移，click 仍会触发）
  Array.prototype.forEach.call([fmtBoldBtn, fmtHiliteBtn, fontsizeBtn], function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    b.addEventListener('mousedown', function (e) { e.preventDefault(); }); // 不支持 Pointer Events 的旧内核兜底
  });

  // 选区持续记录 + 按钮可用态同步
  document.addEventListener('selectionchange', saveSelection);

  // 粘贴时只保留纯文本与换行，清掉富文本格式
  editorEl.addEventListener('paste', function (e) {
    e.preventDefault();
    var text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
    document.execCommand('insertText', false, text);
  });

  window.addEventListener('beforeunload', function () {
    if (currentId || pendingSaveId) commitSave();
  });

  // 应用内提醒：启动时检查已到期未完成的待办，alert 提示（最多列 5 条）
  function checkDueReminders() {
    try {
      if (sessionStorage.getItem('due-reminded') === '1') return; // 本会话已提醒过
    } catch (e) { /* 隐私模式等场景 */ }
    var now = Date.now();
    var due = notes.filter(function (n) {
      return isTodo(n) && !isDone(n) && n.deletedAt == null && n.dueAt && n.dueAt <= now;
    }).sort(function (a, b) { return a.dueAt - b.dueAt; });
    if (!due.length) return;
    var lines = due.slice(0, 5).map(function (n) { return '· ' + titleOf(n); });
    if (due.length > 5) lines.push('...还有 ' + (due.length - 5) + ' 条');
    alert('你有 ' + due.length + ' 条待办已到期\n' + lines.join('\n'));
    try { sessionStorage.setItem('due-reminded', '1'); } catch (e) {}
  }

  /* ---------- 待办系统通知（@capacitor/local-notifications）----------
     仅 Capacitor 打包环境生效：浏览器里 Capacitor.Plugins 不存在或有缺项时整段静默跳过。
     通知 id = djb2(note.id) 的 32 位正整数（同一便签稳定、非 0，符合 Android 要求）。 */
  function getLocalNotifications() {
    if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications)) return null;
    return window.Capacitor.Plugins.LocalNotifications;
  }

  function hashNoteId(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return Math.abs(h) || 1;
  }

  function requestNotificationPermission() {
    var ln = getLocalNotifications();
    if (!ln) return Promise.resolve(false);
    return ln.checkPermissions().then(function (perm) {
      if (perm.display === 'granted') return true;
      return ln.requestPermissions().then(function (p) { return p.display === 'granted'; });
    }).catch(function () { return false; });
  }

  function checkExactAlarmSetting() {
    var ln = getLocalNotifications();
    if (!ln || !ln.checkExactNotificationSetting) return; // 插件/平台不支持则跳过
    ln.checkExactNotificationSetting().then(function (s) {
      if (s && s.exact_alarm && s.exact_alarm !== 'granted') {
        console.log('[notify] 精确闹钟权限未授予，待办提醒可能延迟触发');
      }
    }).catch(function () { /* 静默 */ });
  }

  function cancelNoteNotification(noteId) {
    var ln = getLocalNotifications();
    if (!ln || !noteId) return;
    ln.cancel({ notifications: [{ id: hashNoteId(noteId) }] }).catch(function () { /* 静默 */ });
  }

  function scheduleNoteNotification(note) {
    var ln = getLocalNotifications();
    if (!ln || !note) return;
    // 非待办 / 无提醒时间 / 已完成 / 已过期 → 取消旧通知（不调度过期提醒）
    if (!(isTodo(note) && note.dueAt && !isDone(note)) || note.dueAt <= Date.now()) {
      cancelNoteNotification(note.id);
      return;
    }
    ln.schedule({
      notifications: [{
        id: hashNoteId(note.id),
        title: '待办提醒',
        body: titleOf(note).slice(0, 50),
        schedule: { at: new Date(note.dueAt) },
        extra: { noteId: note.id },
        ongoing: false,
        autoCancel: true,
        allowWhileIdle: true
      }]
    }).catch(function () { /* 静默 */ });
  }

  // 启动恢复：遍历全部便签逐条对齐通知（覆盖重启丢通知、导入数据等场景）
  function resyncAllTodoNotifications() {
    if (!getLocalNotifications()) return;
    notes.forEach(function (n) {
      if (n.deletedAt == null) scheduleNoteNotification(n); // 回收箱里的不重新调度
    });
  }

  /* ---------- 应用内更新（国内镜像；只 Capacitor 环境生效，浏览器静默跳过） ---------- */
  var UPDATE_MODAL = $('update-modal');
  var CURRENT_VERSION = '1.6.6'; // 与 android/app/build.gradle 的 versionName 保持一致
  var UPDATE_URLS = [
    'https://cdn.jsdelivr.net/gh/AIZIYOU466/ya-thoughts@main/version.json',
    'https://gh-proxy.com/https://raw.githubusercontent.com/AIZIYOU466/ya-thoughts/main/version.json',
    'https://ghfast.top/https://raw.githubusercontent.com/AIZIYOU466/ya-thoughts/main/version.json'
  ];
  var updateInfo = null; // 当前弹出的版本信息（供稍后/下载记录 dismiss）
  var UPDATE_TIMEOUT = 3000; // 单个镜像超时（毫秒）：5s 缩短为 3s
  var autoRetriesLeft = 2;   // 自动检查全镜像失败后的重试次数（+首轮共 3 轮；手动检查不重试）

  // 版本号 '1.6.0' 风格逐位数字比较：a>b→1，a<b→-1，相等→0（1.10.0 > 1.9.0，非字典序）
  function compareVersion(a, b) {
    var pa = a.split('.'), pb = b.split('.');
    var n = Math.max(pa.length, pb.length);
    for (var i = 0; i < n; i++) {
      var x = parseInt(pa[i] || 0, 10), y = parseInt(pb[i] || 0, 10);
      if (x > y) return 1;
      if (x < y) return -1;
    }
    return 0;
  }

  // 轮询 3 个国内镜像：逐个 fetch（3 秒超时），第一个成功即用；全部失败时
  // 自动检查（force=false）会 2 秒后重试（最多 3 轮），手动检查（force=true）
  // 不重试但始终 toast 反馈结果。全程 console.log 便于真机 adb logcat 定位。
  function checkForUpdate(force) {
    if (!(window.Capacitor && window.Capacitor.Plugins)) {
      if (force) showUndoToast('检查更新仅在 App 内可用'); // 浏览器网页点菜单项也给反馈
      return;
    }
    var i = 0, failures = [];
    (function next() {
      if (i >= UPDATE_URLS.length) { // 全部镜像失败
        var reason = failures.length
          ? failures.filter(function (v, k) { return failures.indexOf(v) === k; }).join(' / ')
          : '未知错误';
        console.log('[update] 全部镜像检查失败：' + reason);
        if (force) {
          showUndoToast('检查更新失败：' + reason);
        } else if (autoRetriesLeft > 0) {
          autoRetriesLeft--;
          console.log('[update] 2 秒后自动重试（剩余 ' + autoRetriesLeft + ' 次）');
          setTimeout(function () { checkForUpdate(false); }, 2000);
        }
        return;
      }
      var url = UPDATE_URLS[i++];
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, UPDATE_TIMEOUT);
      console.log('[update] 尝试镜像 ' + i + '/' + UPDATE_URLS.length + '：' + url);
      fetch(url, { signal: ctrl.signal })
        .then(function (r) {
          if (!r.ok) throw { kind: 'http', status: r.status };
          return r.json();
        })
        .then(function (info) {
          clearTimeout(timer);
          if (!info || !info.version) { // 200 但内容无效：当失败处理，继续换镜像
            console.log('[update] 镜像返回无效版本信息');
            failures.push('无效响应');
            next();
            return;
          }
          var cmp = compareVersion(CURRENT_VERSION, info.version);
          if (cmp >= 0) { // 不是新版本（含版本同位：当前代码 == 已发布版本）
            console.log('[update] 已是最新：本地 ' + CURRENT_VERSION + ' >= 远端 ' + info.version);
            if (force) showUndoToast('已是最新版本 v' + CURRENT_VERSION);
            return;
          }
          if (!force) { // 自动检查：同版本 24h 内已提醒过 → 不重复打扰；手动检查每次都查
            var dv = localStorage.getItem('update_dismissed_version');
            var da = parseInt(localStorage.getItem('update_dismissed_at') || '0', 10);
            if (dv === info.version && da && Date.now() - da < 24 * 3600 * 1000) {
              console.log('[update] 24h 内已提醒过 ' + info.version + '，跳过');
              return;
            }
          }
          console.log('[update] 发现新版本 ' + info.version + '，打开更新弹窗');
          showUpdateDialog(info);
        })
        .catch(function (err) {
          clearTimeout(timer);
          var reason = (err && err.name === 'AbortError') ? '超时'
            : (err && err.kind === 'http') ? 'HTTP ' + err.status
            : '网络错误';
          console.log('[update] 镜像失败：' + reason);
          failures.push(reason);
          next();
        });
    })();
  }

  function showUpdateDialog(info) {
    if (UPDATE_MODAL.classList.contains('open')) return;
    updateInfo = info;
    $('update-version').textContent = 'v' + info.version;
    $('update-notes').textContent = info.notes || '';
    UPDATE_MODAL.classList.add('open');
    document.body.style.overflow = 'hidden'; // 弹窗期间禁止页面滚动
  }

  function closeUpdateModal() {
    UPDATE_MODAL.classList.remove('open');
    updateInfo = null;
    document.body.style.overflow = '';
  }

  // 记录"已提醒过该版本"，24h 内不再打扰
  function dismissUpdateFor(info) {
    localStorage.setItem('update_dismissed_version', info.version);
    localStorage.setItem('update_dismissed_at', String(Date.now()));
  }
  $('update-later').addEventListener('click', function () {
    if (updateInfo) dismissUpdateFor(updateInfo);
    closeUpdateModal();
  });
  $('update-download').addEventListener('click', function () {
    if (!updateInfo) return;
    dismissUpdateFor(updateInfo); // 先记录再打开，避免 WebView 切后台后状态丢失
    window.open(updateInfo.apkUrl, '_blank'); // 真机点击无反应时改 window.location.href = info.apkUrl
    closeUpdateModal();
  });
  UPDATE_MODAL.addEventListener('click', function (e) {
    if (e.target !== UPDATE_MODAL) return; // 点卡片内部不处理
    if (updateInfo) dismissUpdateFor(updateInfo);
    closeUpdateModal();
  });

  // 点击通知 → 打开对应便签编辑页（启动时注册一次）
  function registerNotificationTap() {
    var ln = getLocalNotifications();
    if (!ln) return;
    ln.addListener('localNotificationActionPerformed', function (res) {
      try {
        var noteId = res && res.notification && res.notification.extra && res.notification.extra.noteId;
        if (!noteId || !noteById(noteId)) return; // 便签已删除则忽略
        if (document.getElementById('editor-view').classList.contains('active')) {
          document.getElementById('back-btn').click(); // 先走正常返回（含离开便签延迟保存），再打开目标
        }
        openNote(noteId);
      } catch (e) { /* 静默 */ }
    });
  }

  // 启动：打开数据库 → 迁移旧 localStorage 数据 → 加载 → 首次渲染 → 到期提醒 → 恢复系统通知
  openDB()
    .then(migrateLegacy)
    .then(dbGetAll)
    .then(function (arr) {
      notes = arr;
      backfillOrder(); // 无 order 字段的旧便签按 createdAt 升序补齐（初始顺序按创建时间）
      updateSortMenu(); // 应用持久化的排序方式后再首次渲染
      renderList();
      runAutoClean(); // 每天 20:00 后首次打开检查一次（内部视情况再 renderList）
      purgeExpiredBinItems(); // 回收箱超 3 天条目物理清理（静默）
      checkDueReminders();
      requestNotificationPermission(); // 启动时请求通知权限（Android 13+ 弹窗；浏览器静默跳过）
      checkExactAlarmSetting();        // 启动时检查精确闹钟权限（Android 专用，未授权仅告警不打扰）
      resyncAllTodoNotifications();    // 重启后恢复所有待办的系统通知
      registerNotificationTap();       // 点击通知 → 打开对应便签
      if (window.Capacitor) setTimeout(checkForUpdate, 2000); // 应用内更新检查（2 秒后；浏览器跳过）
    })
    .catch(function () {
      // 数据库打不开（极端隐私模式等）时显示空列表
      renderList();
    });

  /* ---------- 全局错误捕获（仅 Capacitor 环境 toast + console；浏览器 console 静默） ---------- */
  var globalErrorFn = function (ev) {
    try {
      var msg = ev && ev.message;
      console.error('[global] 未捕获错误:', ev && ev.error ? ev.error : msg);
      if (window.Capacitor && window.Capacitor.Plugins) showUndoToast('出错了，请稍后重试');
    } catch (e) { /* 捕获逻辑自身异常不再上报，避免二次崩溃 */ }
  };
  var globalRejectFn = function (ev) {
    try {
      var reason = ev && ev.reason;
      console.error('[global] 未处理的 Promise 拒绝:', reason);
      if (window.Capacitor && window.Capacitor.Plugins) showUndoToast('出错了，请稍后重试');
    } catch (e) { /* 同上 */ }
  };
  window.addEventListener('error', globalErrorFn);
  window.addEventListener('unhandledrejection', globalRejectFn);
})();

/* ---------- UI 动效增强层（独立 IIFE，只做表现增强，不改任何业务逻辑） ---------- */
(function () {
  'use strict';
  var listView = document.getElementById('list-view');
  var editorView = document.getElementById('editor-view');
  var viewerEl = document.getElementById('img-viewer');
  var listEl = document.getElementById('note-list');
  // 触觉反馈：不支持的平台静默忽略
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  /* --- 页面切换动画已简化并内联到业务层 show()：类名增删与 transitionend 清理
         都在同处完成，不再用 MutationObserver 观察/接管（原实现的存在 400ms
         静默窗口与 animationend 丢事件两个隐患，会导致 transform 停在中间态） --- */

  /* --- 图片查看器关闭动画接管：open 移除后保活 0.18s 淡出 ---
     修复 1.6.0 卡死：旧代码 animationend 比对遗留的 'viewer-fade-out'，与
     #img-viewer.closing 实际使用的通用 fade-out 不符，条件永假 → .closing 常驻，
     全屏透明遮罩永久拦截所有输入 = 整页"卡死"。动画名修正 + 兜底定时器双保险。 */
  var closingLatch = false, closingTimer = null;
  var vo = new MutationObserver(function () {
    var open = viewerEl.classList.contains('open');
    if (!open && !closingLatch) {
      closingLatch = true; // 闭锁：本次关闭只补一次 .closing，移除后不重加
      viewerEl.classList.add('closing');
      clearTimeout(closingTimer);
      closingTimer = setTimeout(function () { // 兜底：animationend 丢失（切后台/节流）时强制卸载遮罩层
        closingTimer = null;
        viewerEl.classList.remove('closing');
      }, 260);
    } else if (open) {
      closingLatch = false;
      clearTimeout(closingTimer); closingTimer = null;
      viewerEl.classList.remove('closing');
    }
  });
  vo.observe(viewerEl, { attributes: true, attributeFilter: ['class'] });
  viewerEl.addEventListener('animationend', function (e) {
    if (e.target === viewerEl && e.animationName === 'fade-out') {
      clearTimeout(closingTimer); closingTimer = null;
      viewerEl.classList.remove('closing'); // 闭锁保持 true，MutationObserver 不会重加
    }
  });

  /* --- 首屏卡片依次入场：只对首次渲染生效，之后的重渲染不闪动 --- */
  var bootDone = false;
  var lo = new MutationObserver(function () {
    if (bootDone || !listEl.children.length) return;
    bootDone = true;
    lo.disconnect();
    listEl.classList.add('boot-in');
    setTimeout(function () { listEl.classList.remove('boot-in'); }, 600);
  });
  lo.observe(listEl, { childList: true });

  /* --- 触觉反馈：capture 阶段监听，不影响原处理逻辑 --- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('#sel-delete')) buzz(30); // 删除确认后 30ms
    if (t.closest('#sel-export') || t.closest('#menu-export')) buzz(20); // 导出 20ms
  }, true);
})();

/* ---------- Android 物理返回键：编辑页 → 列表；多选 → 退出多选；列表 → 退出 App ----------
   仅 Capacitor 打包环境生效：浏览器里 window.Capacitor 不存在，整段跳过，不影响网页测试。
   页面状态从 DOM class 读取（两个 IIFE 闭包内的 backToList/exitMultiMode 不直接可见），
   通过触发现有按钮的 click 复用原有处理函数，不改任何业务逻辑。 */
(function () {
  'use strict';
  if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)) return;
  var App = window.Capacitor.Plugins.App;
  App.addListener('backButton', function () {
    // 更新弹窗打开时 → 等同"稍后"（记录 dismiss 并关闭，不返回列表）
    if (document.getElementById('update-modal').classList.contains('open')) {
      document.getElementById('update-later').click();
      return;
    }
    // 裁剪界面打开时 → 取消裁剪（不是返回列表）
    if (document.getElementById('crop-overlay').classList.contains('open')) {
      document.getElementById('crop-cancel').click();
      return;
    }
    // 编辑页 → 返回列表（复用 #back-btn 的现有处理 backToList）
    if (document.getElementById('editor-view').classList.contains('active')) {
      document.getElementById('back-btn').click();
      return;
    }
    // 多选模式 → 退出多选（复用 #sel-cancel 的现有处理 exitMultiMode）
    if (document.getElementById('list-view').classList.contains('multi')) {
      document.getElementById('sel-cancel').click();
      return;
    }
    // 列表页且非多选 → 允许退出 App
    App.exitApp();
  });
})();
</script>
