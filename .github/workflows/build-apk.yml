name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # version.json 是回写提交，会再次触发本工作流（GitHub Actions 不认 [skip ci]），
    # bot 的 push 直接跳过，否则同一版本会被反复重建成同一份 APK
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync root index.html to www
        run: cp index.html www/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            2>&1 | tee build-apk.log

      # 构建日志留档：失败时能从 artifact 看到 Gradle 报什么，不用管理员权限翻 Actions 日志
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build-apk.log
          if-no-files-found: ignore

      - name: Cleanup keystore
        if: always()
        run: rm -f android/release.keystore

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate version.json
        run: |
          V="${{ steps.get_version.outputs.version }}"
          R="AIZIYOU466/ya-thoughts"
          # notes 沿用开发者在本仓库手写的这一份；缺失时才回退到默认文案
          NOTES="$(node -e 'try{console.log(require("./version.json").notes||"")}catch(e){console.log("")}')"
          if [ -z "$NOTES" ]; then NOTES="发版 v$V"; fi
          V="$V" R="$R" NOTES="$NOTES" node > version.json.tmp <<'NODE'
          const v = process.env.V, r = process.env.R, notes = process.env.NOTES;
          const direct = `https://github.com/${r}/releases/download/v${v}/app-release.apk`;
          const out = {
            version: v,
            notes,
            // apkUrl 保留：老版本客户端（<=1.7.5）只读这个字段
            apkUrl: `https://gh-proxy.com/${direct}`,
            apkUrls: [`https://gh-proxy.com/${direct}`, `https://ghfast.top/${direct}`, direct],
            releaseUrl: `https://github.com/${r}/releases/tag/v${v}`
          };
          process.stdout.write(JSON.stringify(out, null, 2) + '\n');
          NODE
          mv version.json.tmp version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json [skip ci]" || echo "no changes"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Ya thoughts v${{ steps.get_version.outputs.version }}
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YaThoughts-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      # 构建日志回写到仓库：失败时把报错落盘并提交，没管理员权限也能看到 Gradle 具体报什么。
      # 成功时清掉上一次留下的。提交者是 bot，上面的 if 会跳过本次推送，不会自己跑自己。
      - name: Commit build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f android/build-apk.log ] && ! grep -q "BUILD SUCCESSFUL" android/build-apk.log; then
            {
              echo "# 构建失败日志（自动回写）"
              echo
              # FAILURE 块在日志末尾，从这里开始截；没找到就退化成纯 tail
              awk '/\* What went wrong:/{f=1} f' android/build-apk.log | head -300
              if ! grep -q "What went wrong" android/build-apk.log; then tail -200 android/build-apk.log; fi
            } > ci-build-log.md
            git add ci-build-log.md
          else
            git rm -f ci-build-log.md --ignore-unmatch >/dev/null
          fi
          git commit -m "ci: build log [skip ci]" || echo "no changes"
          git push
